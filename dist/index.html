  // Riwayat singkat status usulan. Catatan pengembalian dari OD ditampilkan apa adanya,
  // karena itu satu-satunya cara HOD tahu apa yang harus diperbaiki.
  function panelStatus(sub) {
    if (!sub) return "";
    var peta = { DRAFT: "is-plain", SUBMITTED: "is-blue", RETURNED: "is-amber", OD_ACCEPTED: "is-emerald" };
    // Paket reguler sudah dibagikan: HOD boleh membuka permintaan di luar siklus (F6-1).
    var bolehLuar = ["APPROVED", "DISTRIBUTED"].indexOf(sub.status) !== -1 &&
      NBRbac.can(NBStore.user(), "plan.submit") && NBStore.siklusAktif().status === "OPEN";
    if (sub.status === "DRAFT" && !sub.review_note && !sub.off_cycle) return "";
    return "<div class='nb-card nb-card-pad' style='margin-bottom:24px'>" +
      "<div class='nb-note' style='align-items:center'>" +
      (sub.off_cycle ? NBUi.badge(T("luar.badge"), "is-violet") + " " : "") +
      NBUi.badge(T("plan.status" + sub.status), peta[sub.status] || "") +
      "<div><div style='font-weight:600'>" + NBUi.esc(T("kirim.status" + sub.status)) + "</div>" +
      (sub.review_note
        ? "<div class='nb-cell-sub'>" + NBUi.esc(T("review.catatanTerakhir", { c: sub.review_note })) + "</div>"
        : "") +
      (sub.submitted_at
        ? "<div class='nb-cell-sub'>" + NBUi.esc(T("kirim.dikirimPada",
            { t: NBFormat.tanggal(sub.submitted_at) })) +
          (sub.is_late ? " " + NBUi.esc(T("review.terlambat")) : "") + "</div>"
        : "") +
      (sub.off_cycle_reason ? "<div class='nb-cell-sub'>" + NBUi.esc(sub.off_cycle_reason) + "</div>" : "") +
      "</div>" +
      (bolehLuar ? "<button class='nb-btn nb-btn-outline' id='pLuar' style='margin-left:auto'>" +
        NBUi.esc(T("luar.tombol")) + "</button>" : "") +
      "</div></div>";
  }

  // Mutasi masuk dari departemen lain. BR-D menuntut persetujuan departemen penerima,
  // jadi baris ini muncul di layar penerima, bukan hanya di layar pengirim.
  function panelMutasi(c, deptId) {
    var masuk = NBStore.mutasiMasuk(c.cycle_id).filter(function (b) {
      return b.transfer_status && (b.target_department_id === deptId ||
        (b.action_type === "INTERNAL_TRANSFER" && b.department_id === deptId));
    });
    if (!masuk.length) return "";
    return "<div class='nb-card' style='margin-bottom:24px'>" +
      "<div class='nb-toolbar'><div><div style='font-weight:600'>" + NBUi.esc(T("mutasi.judul")) + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("mutasi.sub")) + "</div></div></div>" +
      "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>" + NBUi.esc(T("umum.karyawan")) + "</th>" +
      "<th>" + NBUi.esc(T("mutasi.thAsal")) + "</th>" +
      "<th>" + NBUi.esc(T("plan.thBulan")) + "</th>" +
      "<th>" + NBUi.esc(T("umum.status")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("umum.aksi")) + "</th>" +
      "</tr></thead><tbody>" + masuk.map(function (b) {
        var e = NBStore.karyawan(b.employee_id);
        var asal = NBStore.departemen(b.department_id);
        return "<tr><td><div class='nb-cell-title'>" + NBUi.esc(e ? e.name : b.employee_id) + "</div>" +
          "<div class='nb-cell-sub'>" + NBUi.esc(b.justification || "") + "</div></td>" +
          "<td>" + NBUi.esc(asal ? asal.name : b.department_id) + "</td>" +
          "<td>" + NBUi.esc(NBFormat.bulanPendek(b.effective_month)) + "</td>" +
          "<td>" + (b.reduction_reason === "Pindah entitas" ? NBUi.badge(T("pindah.badge"), "is-indigo") + " " : "") +
            NBUi.badge(T("mutasi.st" + b.transfer_status),
              b.transfer_status === "CONFIRMED" ? "is-emerald"
              : (b.transfer_status === "REJECTED" ? "is-red" : "is-amber")) +
            (b.transfer_note ? "<div class='nb-cell-sub'>" + NBUi.esc(b.transfer_note) + "</div>" : "") + "</td>" +
          "<td class='nb-num' style='white-space:nowrap'>" +
            (b.transfer_status === "PENDING"
              ? (b.reduction_reason === "Pindah entitas"
                  ? "<select class='nb-select' data-pindah-posisi='" + b.line_item_id + "' style='width:200px;display:inline-block'>" +
                    NBStore.posisiTerlihat().filter(function (p) { return p.department_id === deptId; }).map(function (p) {
                      return "<option value='" + p.position_id + "'>" + NBUi.esc(p.title + " (" + p.grade_id + ")") + "</option>"; }).join("") +
                    "</select> <button class='nb-btn nb-btn-outline' data-pindah-ok='" + b.line_item_id + "'>" +
                    NBUi.esc(T("pindah.terima")) + "</button> "
                  : "<button class='nb-btn nb-btn-outline' data-mutasi-ok='" + b.line_item_id + "'>" +
                    NBUi.esc(T("mutasi.terima")) + "</button> ") +
                "<button class='nb-btn nb-btn-ghost-danger' data-mutasi-no='" + b.line_item_id + "'>" +
                NBUi.esc(T("mutasi.tolak")) + "</button>"
              : "<span class='nb-muted'>-</span>") + "</td></tr>";
      }).join("") + "</tbody></table></div></div>";
  }

  function render() {
    var u = NBStore.user();
    var c = NBStore.siklusAktif();
    var deps = NBStore.departemenTerlihat();
    var deptId = deptAktif();
    if (!c || !deptId) {
      return "<div class='nb-card'>" + NBUi.kosong(T("dash.siklusKosong"), T("dash.siklusKosongSub")) + "</div>";
    }
    state.department_id = deptId;

    var sub = NBStore.submissionDepartemen(c.cycle_id, deptId);
    var baris = sub ? NBStore.barisSubmission(sub.submission_id) : [];
    var jaga = NBStore.bolehRencana(c.cycle_id, deptId);
    var bolehUbah = jaga.ok;

    var current = NBStore.currentHc(c.cycle_id, deptId);
    var rekap = NBActions.rekap(baris, deptId);
    var proposed = current + rekap.netto;
    var galat = baris.filter(function (b) { return NBStore.periksaBaris(b).errors.length; }).length;

    var pilihDept = deps.length > 1
      ? "<select class='nb-select' id='pDept' style='width:260px'>" + deps.map(function (d) {
          return "<option value='" + d.department_id + "'" +
                 (d.department_id === deptId ? " selected" : "") + ">" + NBUi.esc(d.name) + "</option>";
        }).join("") + "</select>"
      : "<span class='nb-badge is-plain'>" + NBUi.esc((NBStore.departemen(deptId) || {}).name) + "</span>";

    var isi = baris.length
      ? "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
        "<th>" + NBUi.esc(T("plan.thId")) + "</th>" +
        "<th>" + NBUi.esc(T("plan.thAction")) + "</th>" +
        "<th>" + NBUi.esc(T("plan.thSasaran")) + "</th>" +
        "<th>" + NBUi.esc(T("plan.thRincian")) + "</th>" +
        "<th>" + NBUi.esc(T("plan.thBulan")) + "</th>" +
        "<th class='nb-num'>" + NBUi.esc(T("plan.thQty")) + "</th>" +
        "<th class='nb-num'>" + NBUi.esc(T("plan.thHc")) + "</th>" +
        "<th>" + NBUi.esc(T("plan.thValidasi")) + "</th>" +
        (bolehUbah ? "<th class='nb-num'>" + NBUi.esc(T("umum.aksi")) + "</th>" : "") +
        "</tr></thead><tbody>" +
        baris.map(function (b) { return barisTabel(b, bolehUbah); }).join("") +
        "</tbody></table></div>"
      : NBUi.kosong(T("plan.kosong"), T("plan.kosongSub"), NBUi.svg("layers"));

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("plan.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("plan.sub", { name: c.name })) + "</p></div>" +
      (bolehUbah
        ? "<div style='display:flex;gap:8px'>" +
          "<button class='nb-btn nb-btn-outline' id='pTambah'>" + NBUi.esc(T("plan.tambahBaris")) + "</button>" +
          (baris.length && NBRbac.can(NBStore.user(), "plan.submit")
            ? "<button class='nb-btn nb-btn-primary' id='pKirim'" + (galat ? " disabled" : "") + ">" +
              NBUi.esc(T("kirim.tombol")) + "</button>"
            : (baris.length ? NBUi.badge(T("plan.hodYangKirim"), "is-plain") : "")) + "</div>"
        : NBUi.badge(T(jaga.kunci || "plan.errTutup",
            jaga.kunci === "plan.errTerkunci" && sub
              ? { s: T("plan.status" + sub.status) } : (jaga.vars || {})), "is-amber")) +
    "</div>" +
    panelStatus(sub) +
    panelMutasi(c, deptId) +

    "<div class='nb-kpigrid'>" +
      NBUi.kpi(T("plan.kpiCurrent"), NBFormat.angka(current), "users", "",
               T("plan.kpiCurrentKet")) +
      NBUi.kpi(T("plan.kpiTambah"), NBFormat.delta(rekap.tambah + rekap.masuk), "chart", "is-emerald",
               T("plan.kpiTambahKet", { m: rekap.masuk })) +
      NBUi.kpi(T("plan.kpiKurang"), NBFormat.delta(-(rekap.kurang + rekap.keluar)), "chart", "is-red",
               T("plan.kpiKurangKet", { k: rekap.keluar })) +
      NBUi.kpi(T("plan.kpiProposed"), NBFormat.angka(proposed), "layers", "is-blue",
               T("plan.kpiProposedKet", { n: NBFormat.delta(rekap.netto) })) +
    "</div>" +

    (galat
      ? "<div class='nb-card nb-card-pad' style='margin-bottom:24px;border-color:var(--nb-red-200);" +
        "background:var(--nb-red-50)'><b>" + NBUi.esc(T("plan.adaGalat", { n: galat })) + "</b> " +
        NBUi.esc(T("plan.adaGalatKet")) + "</div>"
      : "") +

    "<div class='nb-card'>" +
      "<div class='nb-toolbar'>" +
        "<div style='display:flex;gap:12px;align-items:center'>" + pilihDept +
        (sub ? NBUi.badge(T("plan.status" + sub.status), sub.status === "DRAFT" ? "is-plain" : "is-blue") : "") +
        "</div>" +
        "<div class='nb-cell-sub'>" + NBUi.esc(T("plan.jumlahBaris", { n: baris.length })) + "</div>" +
      "</div>" + isi +
    "</div>";
  }

  function ambilForm(deptId) {
    function v(id) { var el = document.getElementById(id); return el ? el.value : null; }
    function c(id) { var el = document.getElementById(id); return el ? el.checked : false; }
    return {
      action_type: v("fAction"),
      employee_id: v("fEmployee"), vacancy_id: v("fVacancy"), position_id: v("fPosition"),
      new_position_title: v("fTitle"), target_grade_id: v("fGrade"),
      target_department_id: v("fDeptTujuan"), target_manager_id: v("fAtasanTujuan"),
      vacancy_subtype: v("fSubtipe"),
      reduction_reason: v("fSebab"), replacement_flag: v("fReplacement"),
      quantity: v("fQty") || 1, effective_month: v("fBulan") || 0,
      fill_immediately: c("fIsiLangsung"), parent_line_item_id: v("fInduk"),
      justification: v("fAlasan") || "", department_id: deptId
    };
  }

  function pasangModal(deptId, baris, nilai) {
    var host = document.createElement("div");
    host.innerHTML = formulir(deptId, baris, nilai);
    document.body.appendChild(host.firstChild);
    var modal = document.getElementById("mPlan");

    function tutup() { modal.remove(); }
    modal.querySelectorAll("[data-tutup]").forEach(function (b) { b.onclick = tutup; });
    modal.onclick = function (e) { if (e.target === modal) tutup(); };

    // Mengganti action type menggambar ulang formulir, karena bidang yang perlu diisi berbeda.
    document.getElementById("fAction").onchange = function () {
      var data = ambilForm(deptId);
      if (baris) { data.line_item_id = baris.line_item_id; data.submission_id = baris.submission_id; }
      tutup();
      pasangModal(deptId, baris, data);
    };

    document.getElementById("fSimpan").onclick = function () {
      var c = NBStore.siklusAktif();
      var data = ambilForm(deptId);
      var uji = Object.assign({}, baris || {}, data);
      uji.submission_id = (baris && baris.submission_id) ||
        ((NBStore.submissionDepartemen(c.cycle_id, deptId) || {}).submission_id || "");
      var hasil = NBValidate.periksa(uji, {
        semuaBaris: uji.submission_id ? NBStore.barisSubmission(uji.submission_id) : [],
        gradeAsal: data.employee_id ? (NBStore.karyawan(data.employee_id) || {}).grade_id : null,
        currentHc: null,
        levelGrade: function (id) { return (NBStore.grade(id) || {}).level || 0; }
      });
      if (hasil.errors.length) {
        document.getElementById("fPesan").innerHTML = hasil.errors.map(function (g) {
          return "<div class='nb-badge is-red' style='margin:2px 4px 2px 0'>" +
                 NBUi.esc(g.kode + " " + T(g.kunci, g.vars)) + "</div>";
        }).join("");
        return;
      }
      var res = baris
        ? NBStore.ubahBaris(baris.line_item_id, data)
        : NBStore.tambahBaris(c.cycle_id, deptId, data);
      if (!res.ok) { NBUi.toast(res.kunci ? T(res.kunci, res.vars || {}) : res.alasan, "error"); return; }
      tutup();
      NBUi.toast(T(baris ? "plan.barisDiubah" : "plan.barisDitambah"));
      NBApp.ulang();
    };
  }

  function mount() {
    var deptId = deptAktif();

    var pd = document.getElementById("pDept");
    if (pd) pd.onchange = function () { state.department_id = this.value; NBApp.ulang(); };

    var tambah = document.getElementById("pTambah");
    if (tambah) tambah.onclick = function () { pasangModal(deptId, null); };

    document.querySelectorAll("button[data-ubah]").forEach(function (b) {
      b.onclick = function () {
        var c = NBStore.siklusAktif();
        var sub = NBStore.submissionDepartemen(c.cycle_id, deptId);
        var baris = NBStore.barisSubmission(sub.submission_id).filter(function (x) {
          return x.line_item_id === b.dataset.ubah;
        })[0];
        if (baris) pasangModal(deptId, baris);
      };
    });

    document.querySelectorAll("button[data-hapus]").forEach(function (b) {
      b.onclick = function () {
        NBUi.konfirmasi({
          judul: T("plan.hapusJudul"), pesan: T("plan.hapusTanya", { id: b.dataset.hapus }),
          ok: T("plan.hapus"), batal: T("umum.batal"), gaya: "nb-btn-soft-danger"
        }, function () {
          var res = NBStore.hapusBaris(b.dataset.hapus);
          NBUi.toast(res.ok ? T("plan.barisDihapus") : T(res.kunci || "plan.errTutup", res.vars || {}),
                     res.ok ? "ok" : "error");
          if (res.ok) NBApp.ulang();
        });
      };
    });

    // Kisi (F6-3): perubahan sel tersimpan begitu ditinggalkan, lewat jalur ubahBaris yang sama.
    function simpanSel(el, field) {
      var res = NBStore.ubahBaris(el.dataset.kisiBulan || el.dataset.kisiQty, (function () {
        var o = {}; o[field] = el.value; return o; })());
      if (!res.ok) { NBUi.toast(T(res.kunci, res.vars || {}), "error"); }
      NBApp.ulang();
    }
    document.querySelectorAll("select[data-kisi-bulan]").forEach(function (el) {
      el.onchange = function () { simpanSel(el, "effective_month"); };
    });
    document.querySelectorAll("input[data-kisi-qty]").forEach(function (el) {
      el.onchange = function () { simpanSel(el, "quantity"); };
      el.onkeydown = function (e) { if (e.key === "Enter") { el.blur(); } };
    });
    var luar = document.getElementById("pLuar");
    if (luar) luar.onclick = function () {
      var c = NBStore.siklusAktif();
      NBUi.konfirmasi({
        judul: T("luar.judul"), pesan: T("luar.pesan"),
        perluAlasan: true, labelAlasan: T("luar.alasanLabel"), pesanAlasan: T("review.errAlasan"),
        ok: T("luar.tombol"), batal: T("umum.batal")
      }, function (alasan) {
        var res = NBStore.bukaPermintaanLuarSiklus(c.cycle_id, state.department_id, alasan);
        NBUi.toast(res.ok ? T("luar.dibuka") : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
        if (res.ok) NBApp.ulang();
      });
    };
    var kirim = document.getElementById("pKirim");
    if (kirim) kirim.onclick = function () {
      var c = NBStore.siklusAktif();
      NBUi.konfirmasi({
        judul: T("kirim.judul"), pesan: T("kirim.pesan"),
        ok: T("kirim.tombol"), batal: T("umum.batal")
      }, function () {
        var res = NBStore.kirimSubmission(c.cycle_id, deptId);
        NBUi.toast(res.ok ? T("kirim.berhasil") : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
        if (res.ok) NBApp.ulang();
      });
    };

    document.querySelectorAll("button[data-mutasi-ok]").forEach(function (b) {
      b.onclick = function () {
        NBUi.konfirmasi({
          judul: T("mutasi.terimaJudul"), pesan: T("mutasi.terimaPesan"),
          ok: T("mutasi.terima"), batal: T("umum.batal")
        }, function () {
          var res = NBStore.konfirmasiMutasi(b.dataset.mutasiOk, "CONFIRM", null);
          NBUi.toast(res.ok ? T("mutasi.diterima") : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
          if (res.ok) NBApp.ulang();
        });
      };
    });

    document.querySelectorAll("button[data-pindah-ok]").forEach(function (b) {
      b.onclick = function () {
        var id = b.dataset.pindahOk;
        var sel = document.querySelector("select[data-pindah-posisi='" + id + "']");
        NBUi.konfirmasi({
          judul: T("pindah.terimaJudul"), pesan: T("pindah.terimaPesan"),
          perluAlasan: true, labelAlasan: T("review.alasanLabel"), pesanAlasan: T("review.errAlasan"),
          ok: T("pindah.terima"), batal: T("umum.batal")
        }, function (alasan) {
          var res = NBStore.konfirmasiPindahEntitas(id, sel ? sel.value : "", alasan);
          NBUi.toast(res.ok ? T("pindah.diterima", { id: res.baris.line_item_id }) : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
          if (res.ok) NBApp.ulang();
        });
      };
    });
    document.querySelectorAll("button[data-mutasi-no]").forEach(function (b) {
      b.onclick = function () {
        NBUi.konfirmasi({
          judul: T("mutasi.tolakJudul"), pesan: T("mutasi.tolakPesan"),
          perluAlasan: true, labelAlasan: T("review.alasanLabel"),
          placeholder: T("mutasi.tolakPlaceholder"), pesanAlasan: T("review.errAlasan"),
          ok: T("mutasi.tolak"), batal: T("umum.batal"), gaya: "nb-btn-soft-danger"
        }, function (alasan) {
          var res = NBStore.konfirmasiMutasi(b.dataset.mutasiNo, "REJECT", alasan);
          NBUi.toast(res.ok ? T("mutasi.ditolak") : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
          if (res.ok) NBApp.ulang();
        });
      };
    });
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.planning = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/usulan.js */
// Layar Review Usulan (FR-04). Milik OD.
// Satu-satunya jalan mundur bagi usulan yang sudah dikirim adalah Returned, dan itu
// wajib menyertakan alasan. Aturan ini dijaga di store, bukan hanya di layar ini.
(function (global) {
  "use strict";

  var T = function (k, v) { return NBi18n.t(k, v); };
  var state = { buka: null };

  var STATUS = {
    DRAFT:       { i18n: "plan.statusDRAFT",       badge: "is-plain" },
    SUBMITTED:   { i18n: "plan.statusSUBMITTED",   badge: "is-blue" },
    RETURNED:    { i18n: "plan.statusRETURNED",    badge: "is-amber" },
    OD_ACCEPTED: { i18n: "plan.statusOD_ACCEPTED", badge: "is-emerald" }
  };

  function barisRingkas(s) {
    var d = NBStore.departemen(s.department_id);
    var st = STATUS[s.status] || { i18n: s.status, badge: "" };
    var r = s.ringkas;
    return "<tr class='" + (state.buka === s.submission_id ? "is-active" : "") +
      "' data-sub='" + s.submission_id + "' style='cursor:pointer'>" +
      "<td><div class='nb-cell-title'>" + NBUi.esc(d ? d.name : s.department_id) +
        (s.off_cycle ? " " + NBUi.badge(T("luar.badge"), "is-violet") : "") + "</div>" +
        "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(s.submission_id) + " v" + s.version + "</div></td>" +
      "<td>" + NBUi.badge(T(st.i18n), st.badge) +
        (s.is_late ? " " + NBUi.badge(T("review.terlambat"), "is-red") : "") + "</td>" +
      "<td class='nb-num'>" + NBFormat.angka(r.baris) + "</td>" +
      "<td class='nb-num'>" + NBFormat.delta(r.netto) + "</td>" +
      "<td>" + (r.galat
          ? NBUi.badge(T("plan.errorN", { n: r.galat }), "is-red")
          : (r.peringatan ? NBUi.badge(T("plan.warnN", { n: r.peringatan }), "is-amber")
                          : NBUi.badge(T("plan.siap"), "is-emerald"))) +
        (r.mutasiMenunggu ? " " + NBUi.badge(T("review.mutasiMenunggu", { n: r.mutasiMenunggu }), "is-violet") : "") +
      "</td>" +
      "<td>" + (s.submitted_at ? NBFormat.tanggalPendek(s.submitted_at)
                               : "<span class='nb-muted'>-</span>") + "</td>" +
    "</tr>";
  }

  // Keputusan 4c dan 5c: OD menetapkan atasan baru di departemen tujuan sebelum konsolidasi.
  function kontrolAtasan(b) {
    var calon = NBStore.karyawanTerlihat({ department_id: b.target_department_id }).filter(function (e) {
      return NBStore.levelGrade(e.grade_id) >= NBOrganisasi.LEVEL_MANAJER;
    });
    var terkunci = b.status !== "SUBMITTED" && b.status !== "DRAFT";
    return "<div style='margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap'>" +
      "<span class='nb-cell-sub'>" + NBUi.esc(T("review.atasanTujuan")) + "</span>" +
      (terkunci
        ? NBUi.badge(b.target_manager_id ? ((NBStore.karyawan(b.target_manager_id) || {}).name || b.target_manager_id) : "-", "is-plain")
        : "<select class='nb-select' data-atasan-untuk='" + b.line_item_id + "' style='width:220px'>" +
          "<option value=''>-</option>" + calon.map(function (e) {
            return "<option value='" + e.employee_id + "'" + (e.employee_id === b.target_manager_id ? " selected" : "") + ">" +
              NBUi.esc(e.name + " (" + e.grade_id + ")") + "</option>";
          }).join("") + "</select>" +
          "<button class='nb-btn nb-btn-outline' data-tetapkan='" + b.line_item_id + "'>" + NBUi.esc(T("review.tetapkan")) + "</button>") +
      (!b.target_manager_id ? " " + NBUi.badge("W05c", "is-amber") : "") +
    "</div>";
  }

  function detail() {
    if (!state.buka) return "";
    var sub = NBStore.daftarSubmission(NBStore.siklusAktif().cycle_id).filter(function (s) {
      return s.submission_id === state.buka;
    })[0];
    if (!sub) return "";
    var baris = NBStore.barisSubmission(sub.submission_id);
    var d = NBStore.departemen(sub.department_id);

    var isi = baris.map(function (b) {
      var dampak = NBActions.dampakHc(b);
      var h = NBStore.periksaBaris(b);
      return "<tr><td><span class='nb-code'>" + NBUi.esc(b.line_item_id) + "</span></td>" +
        "<td>" + NBUi.badge(T("act." + b.action_type), (NBActions.def(b.action_type) || {}).badge) + "</td>" +
        "<td><div class='nb-cell-title'>" + NBUi.esc(namaSasaran(b)) + "</div>" +
          "<div class='nb-cell-sub'>" + NBUi.esc(b.justification || "") + "</div>" +
          (b.action_type === "TRANSFER" && b.target_department_id ? kontrolAtasan(b) : "") + "</td>" +
        "<td>" + (b.effective_month ? NBUi.esc(NBFormat.bulanPendek(b.effective_month)) : "-") + "</td>" +
        "<td class='nb-num'>" + (dampak.perusahaan === 0 ? "0" : "<b>" + NBFormat.delta(dampak.perusahaan) + "</b>") + "</td>" +
        "<td>" + (h.errors.length ? NBUi.badge(T("plan.errorN", { n: h.errors.length }), "is-red")
                 : (b.transfer_status ? NBUi.badge(T("mutasi.st" + b.transfer_status), "is-violet")
                                      : NBUi.badge(T("plan.siap"), "is-emerald"))) + "</td></tr>";
    }).join("");

    var aksi = sub.status === "SUBMITTED"
      ? "<button class='nb-btn nb-btn-soft-danger' id='rKembali'>" + NBUi.esc(T("review.kembalikan")) + "</button>" +
        "<button class='nb-btn nb-btn-primary' id='rTerima'>" + NBUi.esc(T("review.terima")) + "</button>"
      : "<span class='nb-cell-sub'>" + NBUi.esc(T("review.tidakBisa", { s: T((STATUS[sub.status] || {}).i18n || sub.status) })) + "</span>";

    return "<div class='nb-card' style='margin-top:24px'>" +
      "<div class='nb-toolbar'><div>" +
        "<div style='font-weight:600'>" + NBUi.esc(T("review.detailJudul", { d: d ? d.name : "" })) + "</div>" +
        "<div class='nb-cell-sub'>" + NBUi.esc(sub.review_note
            ? T("review.catatanTerakhir", { c: sub.review_note })
            : T("review.detailSub")) + "</div>" +
      "</div><div style='display:flex;gap:8px'>" + aksi + "</div></div>" +
      "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
        "<th>" + NBUi.esc(T("plan.thId")) + "</th>" +
        "<th>" + NBUi.esc(T("plan.thAction")) + "</th>" +
        "<th>" + NBUi.esc(T("plan.thSasaran")) + "</th>" +
        "<th>" + NBUi.esc(T("plan.thBulan")) + "</th>" +
        "<th class='nb-num'>" + NBUi.esc(T("plan.thHc")) + "</th>" +
        "<th>" + NBUi.esc(T("plan.thValidasi")) + "</th>" +
      "</tr></thead><tbody>" + isi + "</tbody></table></div></div>";
  }

  function namaSasaran(b) {
    if (b.employee_id) return (NBStore.karyawan(b.employee_id) || {}).name || b.employee_id;
    if (b.new_position_title) return b.new_position_title;
    if (b.position_id) return (NBStore.posisi(b.position_id) || {}).title || b.position_id;
    if (b.vacancy_id) return b.vacancy_id;
    return "-";
  }

  function render() {
    var c = NBStore.siklusAktif();
    if (!c) return "<div class='nb-card'>" + NBUi.kosong(T("dash.siklusKosong"), T("dash.siklusKosongSub")) + "</div>";
    var daftar = NBStore.daftarSubmission(c.cycle_id);
    var deps = NBStore.departemenTerlihat();

    var dikirim = daftar.filter(function (s) { return s.status === "SUBMITTED"; }).length;
    var diterima = daftar.filter(function (s) { return s.status === "OD_ACCEPTED"; }).length;
    var dikembalikan = daftar.filter(function (s) { return s.status === "RETURNED"; }).length;
    var belum = deps.length - daftar.filter(function (s) { return s.status !== "DRAFT"; }).length;

    var isi = daftar.length
      ? "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
        "<th>" + NBUi.esc(T("umum.departemen")) + "</th>" +
        "<th>" + NBUi.esc(T("umum.status")) + "</th>" +
        "<th class='nb-num'>" + NBUi.esc(T("review.thBaris")) + "</th>" +
        "<th class='nb-num'>" + NBUi.esc(T("review.thNetto")) + "</th>" +
        "<th>" + NBUi.esc(T("plan.thValidasi")) + "</th>" +
        "<th>" + NBUi.esc(T("review.thDikirim")) + "</th>" +
        "</tr></thead><tbody>" + daftar.map(barisRingkas).join("") + "</tbody></table></div>"
      : NBUi.kosong(T("review.kosong"), T("review.kosongSub"), NBUi.svg("layers"));

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("review.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("review.sub", { name: c.name })) + "</p></div>" +
      NBUi.badge(c.name, "is-plain") + "</div>" +

    "<div class='nb-kpigrid'>" +
      NBUi.kpi(T("review.kpiMenunggu"), NBFormat.angka(dikirim), "layers", "is-blue", T("review.kpiMenungguKet")) +
      NBUi.kpi(T("review.kpiDiterima"), NBFormat.angka(diterima), "check", "is-emerald", "") +
      NBUi.kpi(T("review.kpiDikembalikan"), NBFormat.angka(dikembalikan), "chart", "is-amber", "") +
      NBUi.kpi(T("review.kpiBelum"), NBFormat.angka(belum < 0 ? 0 : belum), "building", "", T("review.kpiBelumKet")) +
    "</div>" +

    "<div class='nb-card'>" +
      "<div class='nb-toolbar'><div><div style='font-weight:600'>" + NBUi.esc(T("review.daftar")) + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("review.daftarSub")) + "</div></div></div>" + isi +
    "</div>" + detail();
  }

  function mount() {
    document.querySelectorAll("tr[data-sub]").forEach(function (tr) {
      tr.onclick = function () { state.buka = tr.dataset.sub; NBApp.ulang(); };
    });

    document.querySelectorAll("button[data-tetapkan]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.dataset.tetapkan;
        var sel = document.querySelector("select[data-atasan-untuk='" + id + "']");
        var res = NBStore.tetapkanAtasanMutasi(id, sel ? sel.value : "");
        NBUi.toast(res.ok ? T("review.atasanDitetapkan") : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
        if (res.ok) NBApp.ulang();
      };
    });
    var terima = document.getElementById("rTerima");
    if (terima) terima.onclick = function () {
      NBUi.konfirmasi({
        judul: T("review.terimaJudul"), pesan: T("review.terimaPesan"),
        ok: T("review.terima"), batal: T("umum.batal")
      }, function () {
        var res = NBStore.reviewSubmission(state.buka, "ACCEPT", null);
        NBUi.toast(res.ok ? T("review.diterima") : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
        if (res.ok) NBApp.ulang();
      });
    };

    var kembali = document.getElementById("rKembali");
    if (kembali) kembali.onclick = function () {
      NBUi.konfirmasi({
        judul: T("review.kembalikanJudul"), pesan: T("review.kembalikanPesan"),
        perluAlasan: true, labelAlasan: T("review.alasanLabel"),
        placeholder: T("review.alasanPlaceholder"), pesanAlasan: T("review.errAlasan"),
        ok: T("review.kembalikan"), batal: T("umum.batal"), gaya: "nb-btn-soft-danger"
      }, function (alasan) {
        var res = NBStore.reviewSubmission(state.buka, "RETURN", alasan);
        NBUi.toast(res.ok ? T("review.dikembalikan") : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
        if (res.ok) NBApp.ulang();
      });
    };
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.usulan = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/konsolidasi.js */
// Layar Konsolidasi (FR-05). Milik OD.
// Angka di layar ini tidak pernah dihitung di sini. Semuanya berasal dari NBStore.konsolidasi,
// supaya aturan anti double counting hanya hidup di satu tempat dan bisa diuji sendiri.
(function (global) {
  "use strict";

  var T = function (k, v) { return NBi18n.t(k, v); };
  var state = { tab: "dept" };

  function tabelDept(k) {
    return "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>" + NBUi.esc(T("umum.departemen")) + "</th>" +
      "<th>" + NBUi.esc(T("umum.status")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("kons.thCurrent")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("kons.thTambah")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("kons.thKurang")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("kons.thNetto")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("kons.thProposed")) + "</th>" +
      "</tr></thead><tbody>" +
      k.perDept.map(function (d) {
        var st = d.status === "NONE" ? T("kons.stNONE") : T("plan.status" + d.status);
        var badge = d.ikut ? "is-emerald" : (d.status === "NONE" ? "is-plain" : "is-amber");
        return "<tr" + (d.ikut ? "" : " style='opacity:.65'") + ">" +
          "<td><div class='nb-cell-title'>" + NBUi.esc(d.name) + "</div>" +
            "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(d.cost_center_id) + "</div></td>" +
          "<td>" + NBUi.badge(st, badge) + "</td>" +
          "<td class='nb-num'>" + NBFormat.angka(d.current) + "</td>" +
          "<td class='nb-num'>" + (d.tambah ? NBFormat.delta(d.tambah) : "<span class='nb-muted'>0</span>") + "</td>" +
          "<td class='nb-num'>" + (d.kurang ? NBFormat.delta(-d.kurang) : "<span class='nb-muted'>0</span>") + "</td>" +
          "<td class='nb-num'><b>" + NBFormat.delta(d.netto) + "</b></td>" +
          "<td class='nb-num'>" + NBFormat.angka(d.proposed) + "</td></tr>";
      }).join("") +
      "<tr><td colspan='2'><b>" + NBUi.esc(T("kons.totalPerusahaan")) + "</b></td>" +
        "<td class='nb-num'><b>" + NBFormat.angka(k.total.current) + "</b></td>" +
        "<td class='nb-num'><b>" + NBFormat.delta(k.total.tambah) + "</b></td>" +
        "<td class='nb-num'><b>" + NBFormat.delta(-k.total.kurang) + "</b></td>" +
        "<td class='nb-num'><b>" + NBFormat.delta(k.total.netto) + "</b></td>" +
        "<td class='nb-num'><b>" + NBFormat.angka(k.total.proposed) + "</b></td></tr>" +
      "</tbody></table></div>";
  }

  // Tingkat legal entity, hanya tampil bila entitasnya lebih dari satu.
  function tabelEntitas(k) {
    return "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>" + NBUi.esc(T("umum.entitas")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("kons.thDepartemen")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("kons.thCurrent")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("kons.thNetto")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("kons.thProposed")) + "</th>" +
      "</tr></thead><tbody>" + k.perEntitas.map(function (e) {
        return "<tr><td><div class='nb-cell-title'>" + NBUi.esc(e.name) + "</div>" +
          "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(e.entity_id) + "</div></td>" +
          "<td class='nb-num'>" + e.departemen + "</td>" +
          "<td class='nb-num'>" + NBFormat.angka(e.current) + "</td>" +
          "<td class='nb-num'><b>" + NBFormat.delta(e.netto) + "</b></td>" +
          "<td class='nb-num'>" + NBFormat.angka(e.proposed) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function tabelAction(k) {
    var isi = k.perAction.filter(function (a) { return a.baris > 0; });
    if (!isi.length) return NBUi.kosong(T("kons.kosong"), T("kons.kosongSub"));
    return "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>" + NBUi.esc(T("plan.thAction")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("review.thBaris")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("plan.thQty")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("kons.thDampak")) + "</th>" +
      "<th>" + NBUi.esc(T("kons.thCatatan")) + "</th>" +
      "</tr></thead><tbody>" + isi.map(function (a) {
        return "<tr><td>" + NBUi.badge(T("act." + a.action), (NBActions.def(a.action) || {}).badge) + "</td>" +
          "<td class='nb-num'>" + NBFormat.angka(a.baris) + "</td>" +
          "<td class='nb-num'>" + NBFormat.angka(a.qty) + "</td>" +
          "<td class='nb-num'>" + (a.hc ? "<b>" + NBFormat.delta(a.hc) + "</b>"
                                        : "<span class='nb-muted'>0</span>") + "</td>" +
          "<td class='nb-cell-sub'>" + NBUi.esc(T("kons.ket" + a.action)) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function tabelBulan(k) {
    var maks = k.perBulan.reduce(function (m, b) { return Math.max(m, b.tambah, b.kurang); }, 1);
    return "<div style='padding:4px 20px 20px;display:grid;" +
      "grid-template-columns:repeat(12,1fr);gap:6px;align-items:end'>" +
      k.perBulan.map(function (b) {
        var t = Math.round(b.tambah / maks * 70), g = Math.round(b.kurang / maks * 70);
        return "<div style='text-align:center'>" +
          "<div style='height:76px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px'>" +
            (b.tambah ? "<div style='height:" + t + "px;background:var(--nb-emerald-bd);" +
              "border-radius:4px 4px 0 0'></div>" : "") +
            (b.kurang ? "<div style='height:" + g + "px;background:var(--nb-red-200);" +
              "border-radius:0 0 4px 4px'></div>" : "") +
          "</div>" +
          "<div class='nb-kpi-label' style='margin:6px 0 2px'>" + NBUi.esc(NBFormat.bulanPendek(b.bulan)) + "</div>" +
          "<div class='nb-cell-sub'>" + (b.tambah ? "+" + b.tambah : "") +
            (b.kurang ? " -" + b.kurang : "") + (!b.tambah && !b.kurang ? "-" : "") + "</div>" +
        "</div>";
      }).join("") + "</div>" +
      "<p class='nb-cell-sub' style='padding:0 20px 20px;margin:0'>" + NBUi.esc(T("kons.bulanKet")) + "</p>";
  }

  function render() {
    var c = NBStore.siklusAktif();
    if (!c) return "<div class='nb-card'>" + NBUi.kosong(T("dash.siklusKosong"), T("dash.siklusKosongSub")) + "</div>";
    var k = NBStore.konsolidasi(c.cycle_id);
    var bolehKunci = k.kelengkapan.ikut > 0 && c.status !== "CLOSED" &&
      k.perDept.some(function (d) { return d.status === "OD_ACCEPTED"; });

    var tabs = [["dept", "kons.tabDept"], ["action", "kons.tabAction"], ["bulan", "kons.tabBulan"]];
    if (k.perEntitas.length > 1) tabs.splice(1, 0, ["entitas", "kons.tabEntitas"]);
    var isiTab = state.tab === "dept" ? tabelDept(k)
               : (state.tab === "entitas" ? tabelEntitas(k)
               : (state.tab === "action" ? tabelAction(k) : tabelBulan(k)));

    var pengecualian = k.exceptions.length
      ? "<div class='nb-card nb-card-pad' style='margin-bottom:24px'>" +
        "<div class='nb-card-head'>" + NBUi.svg("shield") + "<div>" +
        "<h3>" + NBUi.esc(T("kons.exJudul", { n: k.exceptions.length })) + "</h3>" +
        "<p>" + NBUi.esc(T("kons.exSubJudul")) + "</p></div></div>" +
        k.exceptions.map(function (e) {
          return "<div class='nb-setting' style='margin-bottom:8px'>" +
            NBUi.badge(T("kons.jenis" + e.jenis), e.jenis === "MUTASI" ? "is-violet" : "is-amber") +
            "<div style='flex:1'>" + NBUi.esc(T(e.kunci, Object.assign({}, e.vars, {
              s: e.vars.s ? (T("plan.status" + e.vars.s) !== "plan.status" + e.vars.s
                    ? T("plan.status" + e.vars.s) : T("mutasi.st" + e.vars.s)) : "" }))) + "</div></div>";
        }).join("") + "</div>"
      : "";

    var riwayat = k.terkunci.length
      ? "<div class='nb-card' style='margin-top:24px'>" +
        "<div class='nb-toolbar'><div><div style='font-weight:600'>" +
        NBUi.esc(T("kons.riwayat")) + "</div><div class='nb-cell-sub'>" +
        NBUi.esc(T("kons.riwayatSub")) + "</div></div></div>" +
        "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
        "<th>" + NBUi.esc(T("kons.thVersi")) + "</th>" +
        "<th>" + NBUi.esc(T("snap.thDirilis")) + "</th>" +
        "<th class='nb-num'>" + NBUi.esc(T("umum.departemen")) + "</th>" +
        "<th class='nb-num'>" + NBUi.esc(T("review.thBaris")) + "</th>" +
        "<th class='nb-num'>" + NBUi.esc(T("kons.thProposed")) + "</th>" +
        "</tr></thead><tbody>" + k.terkunci.map(function (r) {
          var oleh = (NBStore.pengguna(r.locked_by) || {}).name || r.locked_by;
          return "<tr><td><span class='nb-code'>" + NBUi.esc(r.consolidation_id) + "</span></td>" +
            "<td>" + NBFormat.tanggalPendek(r.locked_at) +
              "<div class='nb-cell-sub'>" + NBUi.esc(oleh) + "</div></td>" +
            "<td class='nb-num'>" + NBFormat.angka(r.departemen) + "</td>" +
            "<td class='nb-num'>" + NBFormat.angka(r.baris) + "</td>" +
            "<td class='nb-num'>" + NBFormat.angka(r.proposed) + "</td></tr>";
        }).join("") + "</tbody></table></div></div>"
      : "";

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("kons.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("kons.sub", { name: c.name })) + "</p></div>" +
      (bolehKunci
        ? "<button class='nb-btn nb-btn-primary' id='kKunci'>" + NBUi.esc(T("kons.kunci")) + "</button>"
        : NBUi.badge(T("kons.belumSiap"), "is-amber")) +
    "</div>" +

    "<div class='nb-kpigrid'>" +
      NBUi.kpi(T("kons.kpiCurrent"), NBFormat.angka(k.total.current), "users", "",
               T("kons.kpiCurrentKet", { n: k.kelengkapan.departemen })) +
      NBUi.kpi(T("kons.kpiTambah"), NBFormat.delta(k.total.tambah), "chart", "is-emerald",
               T("kons.kpiTambahKet", { n: k.total.mutasi })) +
      NBUi.kpi(T("kons.kpiKurang"), NBFormat.delta(-k.total.kurang), "chart", "is-red", "") +
      NBUi.kpi(T("kons.kpiProposed"), NBFormat.angka(k.total.proposed), "layers", "is-blue",
               T("kons.kpiProposedKet", { a: k.kelengkapan.ikut, b: k.kelengkapan.departemen })) +
    "</div>" +

    pengecualian +

    "<div class='nb-card'>" +
      "<div class='nb-toolbar'><div class='nb-tabs'>" +
        tabs.map(function (t) {
          return "<button class='nb-tab" + (state.tab === t[0] ? " is-active" : "") +
                 "' data-tab='" + t[0] + "'>" + NBUi.esc(T(t[1])) + "</button>";
        }).join("") +
      "</div><div class='nb-cell-sub'>" + NBUi.esc(T("kons.barisIkut", { n: k.total.baris })) + "</div></div>" +
      isiTab +
    "</div>" + riwayat;
  }

  function mount() {
    document.querySelectorAll("button[data-tab]").forEach(function (b) {
      b.onclick = function () { state.tab = b.dataset.tab; NBApp.ulang(); };
    });

    var kunci = document.getElementById("kKunci");
    if (kunci) kunci.onclick = function () {
      var c = NBStore.siklusAktif();
      NBUi.konfirmasi({
        judul: T("kons.kunciJudul"), pesan: T("kons.kunciPesan"),
        ok: T("kons.kunci"), batal: T("umum.batal")
      }, function () {
        var res = NBStore.kunciKonsolidasi(c.cycle_id);
        NBUi.toast(res.ok ? T("kons.terkunci", { id: res.konsolidasi.consolidation_id })
                          : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
        if (res.ok) NBApp.ulang();
      });
    };
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.konsolidasi = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/biaya.js */
// Layar Perhitungan Biaya (FR-06).
// Dua tab: asumsi biaya yang berlaku, dan hasil perhitungan atas usulan yang sudah
// dikonsolidasikan. Tidak ada satu pun angka rupiah yang dihitung di berkas ini.
(function (global) {
  "use strict";

  var T = function (k, v) { return NBi18n.t(k, v); };
  var state = { tab: "hasil", grade: null };

  function tabelAsumsi(c) {
    var ctx = NBStore.konteksBiaya(c.cycle_id);
    var grades = NBStore.semuaGrade();
    var gradeAktif = state.grade || grades[Math.min(6, grades.length - 1)].grade_id;

    var rincian = NBStore.biayaGrade(gradeAktif, c.cycle_id);
    var kelompok = [
      ["biaya.grupUtama", NBCosting.UTAMA],
      ["biaya.grupRincian", NBCosting.RINCIAN]
    ];

    var pilih = "<select class='nb-select' id='bGrade' style='width:260px'>" +
      grades.map(function (g) {
        return "<option value='" + g.grade_id + "'" + (g.grade_id === gradeAktif ? " selected" : "") +
               ">" + NBUi.esc(g.grade_id + " " + g.label) + "</option>";
      }).join("") + "</select>";

    var isi = rincian
      ? kelompok.map(function (kel) {
          // Rincian sengaja tidak dijumlahkan: hanya lima angka utama yang menjadi biaya.
          var sub = kel[0] === "biaya.grupUtama"
            ? kel[1].reduce(function (a, k) { return a + (rincian.komponen[k] || 0); }, 0) : null;
          return "<tr class='is-active'><td colspan='2'><b>" + NBUi.esc(T(kel[0])) + "</b></td>" +
              "<td class='nb-num'><b>" + (sub === null ? "<span class='nb-muted'>" +
                NBUi.esc(T("biaya.rincianKet")) + "</span>" : NBFormat.rupiah(sub)) + "</b></td></tr>" +
            kel[1].map(function (k) {
              return "<tr><td colspan='2' style='padding-left:32px'>" + NBUi.esc(T("komp." + k)) + "</td>" +
                "<td class='nb-num nb-mono'>" + NBFormat.rupiah(rincian.komponen[k] || 0) + "</td></tr>";
            }).join("");
        }).join("") +
        "<tr><td colspan='2'><b>" + NBUi.esc(T("biaya.totalBulanan")) + "</b></td>" +
        "<td class='nb-num'><b>" + NBFormat.rupiah(rincian.total) + "</b></td></tr>"
      : "<tr><td colspan='3'>" + NBUi.kosong(T("biaya.tanpaAsumsi"), "") + "</td></tr>";

    return "<div class='nb-toolbar'><div style='display:flex;gap:12px;align-items:center'>" + pilih +
      NBUi.badge(T("biaya.paket", { id: ctx.assumption_id || "-",
                                    t: NBFormat.tanggal(ctx.tanggal) }), "is-plain") +
      "</div></div>" +
      "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th colspan='2'>" + NBUi.esc(T("biaya.thKomponen")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("biaya.thPerBulan")) + "</th>" +
      "</tr></thead><tbody>" + isi + "</tbody></table></div>" +
      "<div style='padding:20px'>" +
      "<p class='nb-cell-sub'>" + NBUi.esc(T("biaya.catatanUtama")) + "</p>" +
      "<p class='nb-cell-sub'>" + NBUi.esc(T("biaya.catatanPph")) + "</p>" +
      "</div>";
  }

  function tabelHasil(c, h) {
    if (!h || !h.baris) {
      return NBUi.kosong(T("biaya.kosong"), T("biaya.kosongSub"), NBUi.svg("layers"));
    }
    return "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>" + NBUi.esc(T("plan.thId")) + "</th>" +
      "<th>" + NBUi.esc(T("plan.thAction")) + "</th>" +
      "<th>" + NBUi.esc(T("umum.departemen")) + "</th>" +
      "<th>" + NBUi.esc(T("plan.thBulan")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("biaya.thBulanBerlaku")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("biaya.thPerBulan")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("biaya.thTahunan")) + "</th>" +
      "</tr></thead><tbody>" +
      h.rincian.map(function (r) {
        var b = r.baris, x = r.biaya;
        var d = NBStore.departemen(b.department_id);
        return "<tr><td><span class='nb-code'>" + NBUi.esc(b.line_item_id) + "</span></td>" +
          "<td>" + NBUi.badge(T("act." + b.action_type), (NBActions.def(b.action_type) || {}).badge) +
            (x.jenis === "delta" ? "<div class='nb-cell-sub'>" + NBUi.esc(T("biaya.selisihGrade",
              { a: x.grade_asal, b: x.grade_tujuan })) + "</div>" : "") + "</td>" +
          "<td>" + NBUi.esc(d ? d.name : b.department_id) + "</td>" +
          "<td>" + (b.effective_month ? NBUi.esc(NBFormat.bulanPendek(b.effective_month)) : "-") + "</td>" +
          "<td class='nb-num'>" + (x.applicable_months || "<span class='nb-muted'>0</span>") + "</td>" +
          "<td class='nb-num nb-mono'>" + (x.monthly_cost ? NBFormat.uang(x.monthly_cost, x.mata_uang)
                                        : "<span class='nb-muted'>-</span>") + "</td>" +
          "<td class='nb-num nb-mono'>" + (x.annualized_cost ? NBFormat.uang(x.annualized_cost, x.mata_uang) +
                                          (x.mata_uang && x.mata_uang !== "IDR" && x.annualized_idr !== null
                                            ? "<div class='nb-cell-sub'>" + NBFormat.rupiah(x.annualized_idr) + "</div>" : "")
                                        : "<span class='nb-muted'>-</span>") + "</td></tr>";
      }).join("") +
      "<tr><td colspan='5'><b>" + NBUi.esc(T("kons.totalPerusahaan")) + "</b></td>" +
      "<td class='nb-num'><b>" + NBFormat.rupiah(h.total.monthly) + "</b></td>" +
      "<td class='nb-num'><b>" + NBFormat.rupiah(h.total.annualized) + "</b></td></tr>" +
      "</tbody></table></div>";
  }

  function tabelDept(h) {
    if (!h || !h.perDept.length) return NBUi.kosong(T("biaya.kosong"), T("biaya.kosongSub"));
    return "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>" + NBUi.esc(T("umum.departemen")) + "</th>" +
      "<th>" + NBUi.esc(T("dash.thCostCenter")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("review.thBaris")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("biaya.thPerBulan")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("biaya.thTahunan")) + "</th>" +
      "</tr></thead><tbody>" + h.perDept.map(function (d) {
        return "<tr><td>" + NBUi.esc(d.name) +
            (d.mata_uang && d.mata_uang !== "IDR"
              ? "<div class='nb-cell-sub'>" + NBUi.esc(d.mata_uang + (d.kurs ? " \u00d7 " + NBFormat.angka(d.kurs) : "")) + "</div>" : "") +
          "</td>" +
          "<td class='nb-mono'>" + NBUi.esc(d.cost_center_id) + "</td>" +
          "<td class='nb-num'>" + d.baris + "</td>" +
          "<td class='nb-num nb-mono'>" + NBFormat.uang(d.monthly, d.mata_uang) + "</td>" +
          "<td class='nb-num nb-mono'>" + NBFormat.uang(d.annualized, d.mata_uang) +
            (d.mata_uang && d.mata_uang !== "IDR" && d.annualized_idr
              ? "<div class='nb-cell-sub'>" + NBFormat.rupiah(d.annualized_idr) + "</div>" : "") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function kurvaBulan(h) {
    if (!h) return "";
    var maks = h.perBulan.reduce(function (m, b) { return Math.max(m, b.biaya); }, 1);
    return "<div style='padding:4px 20px 20px;display:grid;grid-template-columns:repeat(12,1fr);" +
      "gap:6px;align-items:end'>" + h.perBulan.map(function (b) {
        var t = Math.max(2, Math.round(b.biaya / maks * 80));
        return "<div style='text-align:center'>" +
          "<div style='height:84px;display:flex;align-items:flex-end'>" +
          "<div style='width:100%;height:" + t + "px;background:var(--nb-blue-bd);border-radius:4px 4px 0 0'></div>" +
          "</div><div class='nb-kpi-label' style='margin:6px 0 2px'>" +
          NBUi.esc(NBFormat.bulanPendek(b.bulan)) + "</div>" +
          "<div class='nb-cell-sub'>" + (b.biaya ? NBFormat.rupiahRingkas(b.biaya) : "-") + "</div></div>";
      }).join("") + "</div>" +
      "<p class='nb-cell-sub' style='padding:0 20px 20px;margin:0'>" + NBUi.esc(T("biaya.kurvaKet")) + "</p>";
  }

  function render() {
    var u = NBStore.user();
    var c = NBStore.siklusAktif();
    if (!c) return "<div class='nb-card'>" + NBUi.kosong(T("dash.siklusKosong"), T("dash.siklusKosongSub")) + "</div>";
    var h = NBStore.biayaSiklus(c.cycle_id);
    var selisih = h ? h.tanpaProrata - h.total.annualized : 0;

    var tabs = [["hasil", "biaya.tabHasil"], ["dept", "biaya.tabDept"],
                ["bulan", "biaya.tabBulan"], ["asumsi", "biaya.tabAsumsi"]];
    var isi = state.tab === "asumsi" ? tabelAsumsi(c)
            : (state.tab === "dept" ? tabelDept(h)
            : (state.tab === "bulan" ? kurvaBulan(h) : tabelHasil(c, h)));

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("biaya.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("biaya.sub", { name: c.name })) + "</p></div>" +
      NBUi.badge(T("biaya.paket", { id: h ? h.assumption_id : "-",
                                    t: NBFormat.tanggal(h ? h.tanggal : c.start_date) }), "is-plain") +
    "</div>" +

    (h && h.total.tanpaKurs && h.total.tanpaKurs.length
      ? "<div class='nb-card nb-card-pad' style='margin-bottom:24px;border-color:var(--nb-amber-bd);" +
        "background:var(--nb-amber-bg)'>" + NBUi.esc(T("biaya.tanpaKurs", { n: h.total.tanpaKurs.join(", ") })) + "</div>"
      : "") +
    "<div class='nb-kpigrid'>" +
      NBUi.kpi(T("biaya.kpiTahunan"), h ? NBFormat.rupiahRingkas(h.total.annualized) : "-",
               "chart", "is-blue", T("biaya.kpiTahunanKet", { n: h ? h.baris : 0 }), true) +
      NBUi.kpi(T("biaya.kpiBulanan"), h ? NBFormat.rupiahRingkas(h.total.monthly) : "-",
               "chart", "", T("biaya.kpiBulananKet"), true) +
      NBUi.kpi(T("biaya.kpiTanpaProrata"), h ? NBFormat.rupiahRingkas(h.tanpaProrata) : "-",
               "shield", "is-amber", T("biaya.kpiTanpaProrataKet"), true) +
      NBUi.kpi(T("biaya.kpiSelisih"), h ? NBFormat.rupiahRingkas(selisih) : "-",
               "check", "is-emerald", T("biaya.kpiSelisihKet"), true) +
    "</div>" +

    "<div class='nb-card'>" +
      "<div class='nb-toolbar'><div class='nb-tabs'>" + tabs.map(function (t) {
        return "<button class='nb-tab" + (state.tab === t[0] ? " is-active" : "") +
               "' data-tab='" + t[0] + "'>" + NBUi.esc(T(t[1])) + "</button>";
      }).join("") + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("biaya.dasar")) + "</div></div>" +
      isi +
    "</div>";
  }

  function mount() {
    document.querySelectorAll("button[data-tab]").forEach(function (b) {
      b.onclick = function () { state.tab = b.dataset.tab; NBApp.ulang(); };
    });
    var g = document.getElementById("bGrade");
    if (g) g.onchange = function () { state.grade = this.value; NBApp.ulang(); };
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.biaya = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/review.js */
// Layar Management Review (FR-07).
// Aturan yang dikunci: manajemen boleh menurunkan angka, kenaikan wajib lewat pengembalian
// ke departemen. Larangan menaikkan dijaga di store, bukan hanya disembunyikan di layar ini.
(function (global) {
  "use strict";

  var T = function (k, v) { return NBi18n.t(k, v); };
  var state = { tab: "baris" };

  var KEPUTUSAN = {
    APPROVED: { i18n: "mgmt.stAPPROVED", badge: "is-emerald" },
    REDUCED:  { i18n: "mgmt.stREDUCED",  badge: "is-amber" },
    REJECTED: { i18n: "mgmt.stREJECTED", badge: "is-red" }
  };

  function namaSasaran(b) {
    if (b.employee_id) return (NBStore.karyawan(b.employee_id) || {}).name || b.employee_id;
    if (b.new_position_title) return b.new_position_title;
    if (b.position_id) return (NBStore.posisi(b.position_id) || {}).title || b.position_id;
    if (b.vacancy_id) return b.vacancy_id;
    return "-";
  }

  function tabelBaris(r, bolehPutus) {
    if (!r.baris.length) {
      return NBUi.kosong(T("mgmt.kosong"), T("mgmt.kosongSub"), NBUi.svg("layers"));
    }
    return "<div class='nb-tablewrap'><table class='nb-table' style='min-width:1060px'><thead><tr>" +
      "<th>" + NBUi.esc(T("plan.thId")) + "</th>" +
      "<th>" + NBUi.esc(T("plan.thAction")) + "</th>" +
      "<th>" + NBUi.esc(T("plan.thSasaran")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("mgmt.thQty")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("mgmt.thBiaya")) + "</th>" +
      "<th>" + NBUi.esc(T("mgmt.thKeputusan")) + "</th>" +
      (bolehPutus ? "<th class='nb-num'>" + NBUi.esc(T("umum.aksi")) + "</th>" : "") +
      "</tr></thead><tbody>" + r.baris.map(function (x) {
        var b = x.baris;
        var d = NBStore.departemen(b.department_id);
        var k = KEPUTUSAN[b.decision];
        return "<tr><td><span class='nb-code'>" + NBUi.esc(b.line_item_id) + "</span></td>" +
          "<td>" + NBUi.badge(T("act." + b.action_type), (NBActions.def(b.action_type) || {}).badge) + "</td>" +
          "<td><div class='nb-cell-title'>" + NBUi.esc(namaSasaran(b)) + "</div>" +
            "<div class='nb-cell-sub'>" + NBUi.esc(d ? d.name : "") + " &middot; " +
              NBUi.esc(b.effective_month ? NBFormat.bulanPendek(b.effective_month) : "-") + "</div></td>" +
          "<td class='nb-num'><b>" + x.setujuQty + "</b>" +
            (x.setujuQty !== x.usulanQty
              ? "<div class='nb-cell-sub'>" + NBUi.esc(T("mgmt.dariUsulan", { n: x.usulanQty })) + "</div>"
              : "") + "</td>" +
          "<td class='nb-num nb-mono'>" +
            NBFormat.rupiahRingkas(x.biayaSetuju ? x.biayaSetuju.annualized_cost : 0) +
            (x.biayaUsulan && x.biayaSetuju && x.biayaUsulan.annualized_cost !== x.biayaSetuju.annualized_cost
              ? "<div class='nb-cell-sub'>" + NBUi.esc(T("mgmt.dariBiaya",
                  { n: NBFormat.rupiahRingkas(x.biayaUsulan.annualized_cost) })) + "</div>"
              : "") + "</td>" +
          "<td>" + (k ? NBUi.badge(T(k.i18n), k.badge) : NBUi.badge(T("mgmt.stBELUM"), "is-plain")) +
            (b.decision_reason ? "<div class='nb-cell-sub'>" + NBUi.esc(b.decision_reason) + "</div>" : "") + "</td>" +
          (bolehPutus
            ? "<td class='nb-num' style='white-space:nowrap'>" +
              "<button class='nb-btn nb-btn-outline' data-setuju='" + b.line_item_id + "'>" +
                NBUi.esc(T("mgmt.setuju")) + "</button> " +
              "<button class='nb-btn nb-btn-outline' data-kurangi='" + b.line_item_id + "'>" +
                NBUi.esc(T("mgmt.kurangi")) + "</button> " +
              "<button class='nb-btn nb-btn-ghost-danger' data-tolak='" + b.line_item_id + "'>" +
                NBUi.esc(T("mgmt.tolak")) + "</button></td>"
            : "") + "</tr>";
      }).join("") + "</tbody></table></div>";
  }

  function tabelRevisi(c) {
    var rev = NBStore.revisiSiklus(c.cycle_id);
    if (!rev.length) return NBUi.kosong(T("mgmt.revKosong"), T("mgmt.revKosongSub"));
    return "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>" + NBUi.esc(T("audit.waktu")) + "</th>" +
      "<th>" + NBUi.esc(T("mgmt.thObjek")) + "</th>" +
      "<th>" + NBUi.esc(T("snap.thField")) + "</th>" +
      "<th>" + NBUi.esc(T("audit.nilai")) + "</th>" +
      "<th>" + NBUi.esc(T("review.alasanLabel")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("kons.thVersi")) + "</th>" +
      "</tr></thead><tbody>" + rev.map(function (r) {
        var oleh = (NBStore.pengguna(r.actor_id) || {}).name || r.actor_id;
        return "<tr><td class='nb-ts'>" + NBFormat.tanggalPendek(r.timestamp) +
            "<small>" + NBFormat.jam(r.timestamp) + "</small>" +
            "<small>" + NBUi.esc(r.revision_id) + "</small></td>" +
          "<td><span class='nb-code'>" + NBUi.esc(r.object_id) + "</span>" +
            "<div class='nb-cell-sub'>" + NBUi.esc(oleh) + "</div></td>" +
          "<td class='nb-mono'>" + NBUi.esc(r.field) + "</td>" +
          "<td><span class='nb-mono'>" + NBUi.esc(String(r.old_value)) + "</span> " +
            "<span class='nb-muted'>" + NBUi.esc(T("audit.ke")) + "</span> " +
            "<span class='nb-mono'>" + NBUi.esc(String(r.new_value)) + "</span></td>" +
          "<td class='nb-cell-sub'>" + NBUi.esc(r.reason || "-") + "</td>" +
          "<td class='nb-num'>v" + r.version + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function render() {
    var u = NBStore.user();
    var c = NBStore.siklusAktif();
    if (!c) return "<div class='nb-card'>" + NBUi.kosong(T("dash.siklusKosong"), T("dash.siklusKosongSub")) + "</div>";

    var r = NBStore.ringkasKeputusan(c.cycle_id);
    var approval = NBStore.approvalSiklus(c.cycle_id);
    var bolehPutus = NBRbac.can(u, "review.decide") && r.baris.length > 0 &&
      NBStore.barisReview(c.cycle_id).length > 0 && !approval.length;
    var semuaDiputuskan = r.baris.length > 0 && r.diputuskan === r.baris.length;

    var hemat = r.usulanBiaya - r.disetujuiBiaya;
    var tabs = [["baris", "mgmt.tabBaris"], ["revisi", "mgmt.tabRevisi"]];

    var aksi = "";
    if (bolehPutus) {
      aksi = "<div style='display:flex;gap:8px'>" +
        "<button class='nb-btn nb-btn-soft-danger' id='mKembali'>" + NBUi.esc(T("mgmt.kembalikan")) + "</button>" +
        "<button class='nb-btn nb-btn-primary' id='mSetujui'" + (semuaDiputuskan ? "" : " disabled") + ">" +
          NBUi.esc(T("mgmt.setujuiMpp")) + "</button></div>";
    } else if (approval.length) {
      aksi = NBUi.badge(T("mgmt.sudahDisetujui", { id: approval[0].approval_id }), "is-emerald");
    } else {
      aksi = NBUi.badge(T("mgmt.belumSiap"), "is-amber");
    }

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("mgmt.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("mgmt.sub", { name: c.name })) + "</p></div>" + aksi + "</div>" +

    "<div class='nb-kpigrid'>" +
      NBUi.kpi(T("mgmt.kpiHcUsulan"), NBFormat.delta(r.usulanHc), "chart", "is-blue",
               T("mgmt.kpiHcUsulanKet", { n: r.baris.length })) +
      NBUi.kpi(T("mgmt.kpiHcSetuju"), NBFormat.delta(r.disetujuiHc), "check", "is-emerald",
               T("mgmt.kpiHcSetujuKet", { a: r.diputuskan, b: r.baris.length })) +
      NBUi.kpi(T("mgmt.kpiBiayaSetuju"), NBFormat.rupiahRingkas(r.disetujuiBiaya), "layers", "",
               T("mgmt.kpiBiayaSetujuKet", { n: NBFormat.rupiahRingkas(r.usulanBiaya) }), true) +
      NBUi.kpi(T("mgmt.kpiHemat"), NBFormat.rupiahRingkas(hemat), "shield", "is-amber",
               T("mgmt.kpiHematKet", { a: r.dikurangi, b: r.ditolak }), true) +
    "</div>" +

    "<div class='nb-card nb-card-pad' style='margin-bottom:24px;background:var(--nb-gray-50)'>" +
      "<div class='nb-note'>" + NBUi.svg("shield") +
      "<div><div style='font-weight:600'>" + NBUi.esc(T("mgmt.aturanJudul")) + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("mgmt.aturanIsi")) + "</div></div></div></div>" +

    "<div class='nb-card'>" +
      "<div class='nb-toolbar'><div class='nb-tabs'>" + tabs.map(function (t) {
        return "<button class='nb-tab" + (state.tab === t[0] ? " is-active" : "") +
               "' data-tab='" + t[0] + "'>" + NBUi.esc(T(t[1])) + "</button>";
      }).join("") + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("mgmt.dasar")) + "</div></div>" +
      (state.tab === "revisi" ? tabelRevisi(c) : tabelBaris(r, bolehPutus)) +
    "</div>";
  }

  function mount() {
    document.querySelectorAll("button[data-tab]").forEach(function (b) {
      b.onclick = function () { state.tab = b.dataset.tab; NBApp.ulang(); };
    });

    function jalankan(res) {
      NBUi.toast(res.ok ? T("mgmt.tercatat") : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
      if (res.ok) NBApp.ulang();
    }

    document.querySelectorAll("button[data-setuju]").forEach(function (b) {
      b.onclick = function () { jalankan(NBStore.putuskanBaris(b.dataset.setuju, "APPROVE", null, null)); };
    });

    document.querySelectorAll("button[data-tolak]").forEach(function (b) {
      b.onclick = function () {
        NBUi.konfirmasi({
          judul: T("mgmt.tolakJudul"), pesan: T("mgmt.tolakPesan"),
          perluAlasan: true, labelAlasan: T("review.alasanLabel"),
          pesanAlasan: T("review.errAlasan"), ok: T("mgmt.tolak"),
          batal: T("umum.batal"), gaya: "nb-btn-soft-danger"
        }, function (alasan) { jalankan(NBStore.putuskanBaris(b.dataset.tolak, "REJECT", 0, alasan)); });
      };
    });

    // Menurunkan angka memakai dialog tersendiri karena butuh angka baru sekaligus alasan.
    document.querySelectorAll("button[data-kurangi]").forEach(function (b) {
      b.onclick = function () {
        var id = b.dataset.kurangi;
        var baris = NBStore.barisReview(NBStore.siklusAktif().cycle_id)
          .filter(function (x) { return x.line_item_id === id; })[0];
        var usulan = NBStore.kuantitasUsulan(baris);
        var host = document.createElement("div");
        host.innerHTML =
          "<div class='nb-overlay' id='mKurangi'><div class='nb-modal' style='max-width:520px'>" +
          "<div class='nb-modal-head'><div><div class='nb-modal-title'><h2>" +
            NBUi.esc(T("mgmt.kurangiJudul")) + "</h2></div>" +
            "<div class='nb-metachips'><span class='nb-metachip is-code'>" + NBUi.esc(id) + "</span>" +
            "<span class='nb-metachip'>" + NBUi.esc(T("mgmt.diusulkan", { n: usulan })) + "</span></div></div>" +
            "<button class='nb-iconbtn' data-batal='1'>&times;</button></div>" +
          "<div class='nb-modal-body'><div class='nb-section' style='margin-bottom:0'>" +
            "<div class='nb-field-label'>" + NBUi.esc(T("mgmt.jumlahBaru")) + "</div>" +
            "<input class='nb-input' id='kQty' type='number' min='0' max='" + usulan + "' value='" +
              Math.max(0, usulan - 1) + "'>" +
            "<div style='margin-top:14px'><div class='nb-field-label'>" +
              NBUi.esc(T("review.alasanLabel")) + "</div>" +
            "<textarea class='nb-input' id='kAlasan' rows='3' style='resize:vertical' placeholder='" +
              NBUi.esc(T("mgmt.alasanPlaceholder")) + "'></textarea></div>" +
            "<div id='kGalat' class='nb-cell-sub' style='color:var(--nb-red-700);margin-top:8px'></div>" +
            "<p class='nb-cell-sub' style='margin-top:10px'>" + NBUi.esc(T("mgmt.aturanIsi")) + "</p>" +
          "</div></div>" +
          "<div class='nb-modal-foot'><button class='nb-btn nb-btn-quiet' data-batal='1'>" +
            NBUi.esc(T("umum.batal")) + "</button>" +
          "<div class='nb-group'><button class='nb-btn nb-btn-primary' id='kOk'>" +
            NBUi.esc(T("mgmt.kurangi")) + "</button></div></div></div></div>";
        document.body.appendChild(host.firstChild);
        var modal = document.getElementById("mKurangi");
        modal.querySelectorAll("[data-batal]").forEach(function (x) { x.onclick = function () { modal.remove(); }; });
        modal.onclick = function (e) { if (e.target === modal) modal.remove(); };
        document.getElementById("kOk").onclick = function () {
          var res = NBStore.putuskanBaris(id, "REDUCE",
            document.getElementById("kQty").value,
            document.getElementById("kAlasan").value.trim());
          if (!res.ok) {
            document.getElementById("kGalat").textContent = T(res.kunci, res.vars || {});
            return;
          }
          modal.remove();
          jalankan(res);
        };
      };
    });

    var setujui = document.getElementById("mSetujui");
    if (setujui) setujui.onclick = function () {
      var c = NBStore.siklusAktif();
      NBUi.konfirmasi({
        judul: T("mgmt.setujuiJudul"), pesan: T("mgmt.setujuiPesan"),
        perluAlasan: true, labelAlasan: T("mgmt.catatanLabel"),
        placeholder: T("mgmt.catatanPlaceholder"), pesanAlasan: T("review.errAlasan"),
        ok: T("mgmt.setujuiMpp"), batal: T("umum.batal")
      }, function (catatan) {
        var res = NBStore.setujuiMpp(c.cycle_id, catatan);
        NBUi.toast(res.ok ? T("mgmt.disetujui", { id: res.approval.approval_id })
                          : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
        if (res.ok) NBApp.ulang();
      });
    };

    var kembali = document.getElementById("mKembali");
    if (kembali) kembali.onclick = function () {
      var c = NBStore.siklusAktif();
      NBUi.konfirmasi({
        judul: T("mgmt.kembalikanJudul"), pesan: T("mgmt.kembalikanPesan"),
        perluAlasan: true, labelAlasan: T("review.alasanLabel"),
        pesanAlasan: T("review.errAlasan"), ok: T("mgmt.kembalikan"),
        batal: T("umum.batal"), gaya: "nb-btn-soft-danger"
      }, function (alasan) {
        var res = NBStore.kembalikanKeDepartemen(c.cycle_id, alasan);
        NBUi.toast(res.ok ? T("mgmt.dikembalikan", { n: res.jumlah })
                          : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
        if (res.ok) NBApp.ulang();
      });
    };
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.review = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/approved.js */
// Layar Approved MPP (bab 20 dan 21).
// Menampilkan baseline kendali: Requested, Approved, Variance per departemen, dan daftar
// alokasi yang bisa dikurangi sepanjang tahun. Kolom biaya mengikuti hak akses kolom.
(function (global) {
  "use strict";

  var T = function (k, v) { return NBi18n.t(k, v); };
  var state = { tab: "varians" };

  function tabelVarians(r, bolehBiaya) {
    if (!r.perDept.length) {
      return NBUi.kosong(T("alok.kosong"), T("alok.kosongSub"), NBUi.svg("layers"));
    }
    return "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>" + NBUi.esc(T("umum.departemen")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("alok.thRequested")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("alok.thApproved")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("alok.thVariance")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("alok.thKuota")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("alok.thSisa")) + "</th>" +
      (bolehBiaya ? "<th class='nb-num'>" + NBUi.esc(T("biaya.thTahunan")) + "</th>" : "") +
      "</tr></thead><tbody>" + r.perDept.map(function (d) {
        var v = d.variance;
        return "<tr><td><div class='nb-cell-title'>" + NBUi.esc(d.name) + "</div>" +
          "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(d.cost_center_id) + "</div></td>" +
          "<td class='nb-num'>" + NBFormat.delta(d.requested) + "</td>" +
          "<td class='nb-num'><b>" + NBFormat.delta(d.approved) + "</b></td>" +
          "<td class='nb-num'>" + (v === 0
            ? "<span class='nb-muted'>0</span>"
            : NBUi.badge(NBFormat.delta(v), v < 0 ? "is-amber" : "is-emerald")) + "</td>" +
          "<td class='nb-num'>" + NBFormat.angka(d.approvedQty) + "</td>" +
          "<td class='nb-num'><b>" + NBFormat.angka(d.sisa) + "</b></td>" +
          (bolehBiaya ? "<td class='nb-num nb-mono'>" + NBFormat.rupiahRingkas(d.biaya) + "</td>" : "") +
        "</tr>";
      }).join("") +
      "<tr><td><b>" + NBUi.esc(T("kons.totalPerusahaan")) + "</b></td>" +
        "<td class='nb-num'><b>" + NBFormat.delta(r.total.requested) + "</b></td>" +
        "<td class='nb-num'><b>" + NBFormat.delta(r.total.approved) + "</b></td>" +
        "<td class='nb-num'><b>" + NBFormat.delta(r.total.variance) + "</b></td>" +
        "<td class='nb-num'><b>" + NBFormat.angka(r.total.approvedQty) + "</b></td>" +
        "<td class='nb-num'><b>" + NBFormat.angka(r.total.sisa) + "</b></td>" +
        (bolehBiaya ? "<td class='nb-num'><b>" + NBFormat.rupiahRingkas(r.total.biaya) + "</b></td>" : "") +
      "</tr></tbody></table></div>";
  }

  function namaSasaran(a) {
    if (a.employee_id) return (NBStore.karyawan(a.employee_id) || {}).name || a.employee_id;
    if (a.new_position_title) return a.new_position_title;
    if (a.position_id) return (NBStore.posisi(a.position_id) || {}).title || a.position_id;
    if (a.vacancy_id) return a.vacancy_id;
    return "-";
  }

  function tabelAlokasi(r, bolehBiaya) {
    if (!r.alokasi.length) {
      return NBUi.kosong(T("alok.kosong"), T("alok.kosongSub"), NBUi.svg("layers"));
    }
    return "<div class='nb-tablewrap'><table class='nb-table' style='min-width:980px'><thead><tr>" +
      "<th>" + NBUi.esc(T("alok.thId")) + "</th>" +
      "<th>" + NBUi.esc(T("plan.thAction")) + "</th>" +
      "<th>" + NBUi.esc(T("plan.thSasaran")) + "</th>" +
      "<th>" + NBUi.esc(T("plan.thBulan")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("alok.thKuota")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("alok.thTerpakai")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("alok.thSisa")) + "</th>" +
      (bolehBiaya ? "<th class='nb-num'>" + NBUi.esc(T("biaya.thTahunan")) + "</th>" : "") +
      "</tr></thead><tbody>" + r.alokasi.map(function (a) {
        var d = NBStore.departemen(a.department_id);
        return "<tr><td><span class='nb-code'>" + NBUi.esc(a.allocation_id) + "</span>" +
            "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(a.line_item_id) + "</div></td>" +
          "<td>" + NBUi.badge(T("act." + a.action_type), (NBActions.def(a.action_type) || {}).badge) + "</td>" +
          "<td><div class='nb-cell-title' style='white-space:nowrap'>" + NBUi.esc(namaSasaran(a)) + "</div>" +
            "<div class='nb-cell-sub'>" + NBUi.esc(d ? d.name : a.department_id) +
            " &middot; " + NBUi.esc(a.grade_id || "-") + "</div></td>" +
          "<td>" + NBUi.esc(a.effective_month ? NBFormat.bulanPendek(a.effective_month) : "-") + "</td>" +
          "<td class='nb-num'>" + a.approved_qty + "</td>" +
          "<td class='nb-num'>" + a.consumed_qty + "</td>" +
          "<td class='nb-num'><b>" + a.remaining_qty + "</b></td>" +
          (bolehBiaya ? "<td class='nb-num nb-mono'>" + NBFormat.rupiahRingkas(a.annualized_cost) + "</td>" : "") +
        "</tr>";
      }).join("") + "</tbody></table></div>";
  }

  function render() {
    var u = NBStore.user();
    var c = NBStore.siklusAktif();
    if (!c) return "<div class='nb-card'>" + NBUi.kosong(T("dash.siklusKosong"), T("dash.siklusKosongSub")) + "</div>";

    var r = NBStore.ringkasAlokasi(c.cycle_id);
    var apr = NBStore.approvalSiklus(c.cycle_id);
    var deps = NBStore.departemenTerlihat();
    // Kolom biaya hanya tampil kalau seluruh departemen dalam lingkup boleh dilihat biayanya.
    var bolehBiaya = deps.every(function (d) { return NBRbac.canSeeCost(u, d.department_id); });
    var bolehDistribusi = NBRbac.can(u, "approved.distribute") && apr.length && !r.terdistribusi;

    var aksi = bolehDistribusi
      ? "<button class='nb-btn nb-btn-primary' id='aDistribusi'>" + NBUi.esc(T("alok.distribusi")) + "</button>"
      : (r.terdistribusi
          ? NBUi.badge(T("alok.sudah", { n: r.alokasi.length }), "is-emerald")
          : NBUi.badge(T("alok.belum"), "is-amber"));

    var tabs = [["varians", "alok.tabVarians"], ["alokasi", "alok.tabAlokasi"]];

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("alok.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("alok.sub", { name: c.name })) + "</p></div>" + aksi + "</div>" +

    "<div class='nb-kpigrid'>" +
      NBUi.kpi(T("alok.kpiApproved"), NBFormat.delta(r.total.approved), "check", "is-emerald",
               apr.length ? T("alok.kpiApprovedKet", { id: apr[0].approval_id }) : T("alok.belum")) +
      NBUi.kpi(T("alok.kpiVariance"), NBFormat.delta(r.total.variance), "shield",
               r.total.variance < 0 ? "is-amber" : "", T("alok.kpiVarianceKet")) +
      NBUi.kpi(T("alok.kpiKuota"), NBFormat.angka(r.total.approvedQty), "layers", "is-blue",
               T("alok.kpiKuotaKet", { n: r.alokasi.length })) +
      NBUi.kpi(T("alok.kpiSisa"), NBFormat.angka(r.total.sisa), "chart", "",
               T("alok.kpiSisaKet")) +
    "</div>" +

    "<div class='nb-card nb-card-pad' style='margin-bottom:24px;background:var(--nb-gray-50)'>" +
      "<div class='nb-note'>" + NBUi.svg("shield") + "<div>" +
      "<div style='font-weight:600'>" + NBUi.esc(T("alok.aturanJudul")) + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("alok.aturanIsi")) + "</div></div></div></div>" +

    "<div class='nb-card'>" +
      "<div class='nb-toolbar'><div class='nb-tabs'>" + tabs.map(function (t) {
        return "<button class='nb-tab" + (state.tab === t[0] ? " is-active" : "") +
               "' data-tab='" + t[0] + "'>" + NBUi.esc(T(t[1])) + "</button>";
      }).join("") + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("alok.dasar")) + "</div></div>" +
      (state.tab === "alokasi" ? tabelAlokasi(r, bolehBiaya) : tabelVarians(r, bolehBiaya)) +
    "</div>";
  }

  function mount() {
    document.querySelectorAll("button[data-tab]").forEach(function (b) {
      b.onclick = function () { state.tab = b.dataset.tab; NBApp.ulang(); };
    });

    var dist = document.getElementById("aDistribusi");
    if (dist) dist.onclick = function () {
      var c = NBStore.siklusAktif();
      NBUi.konfirmasi({
        judul: T("alok.distribusiJudul"), pesan: T("alok.distribusiPesan"),
        ok: T("alok.distribusi"), batal: T("umum.batal")
      }, function () {
        var res = NBStore.distribusikanAlokasi(c.cycle_id);
        NBUi.toast(res.ok ? T("alok.terdistribusi", { n: res.jumlah })
                          : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
        if (res.ok) NBApp.ulang();
      });
    };
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.approved = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/monitoring.js */
// Layar Monitoring (FR-08, bab 21 dan 22).
// Realisasi selalu dibandingkan terhadap Approved, bukan terhadap Proposed.
// Aturan yang dipakai: penambahan headcount diblokir bila melebihi alokasi, jenis lain
// tetap dicatat tetapi memunculkan exception yang harus diputuskan OD.
(function (global) {
  "use strict";

  var T = function (k, v) { return NBi18n.t(k, v); };
  var state = { tab: "ringkas" };

  var ST_ALOK = {
    OPEN:      { i18n: "mon.stOPEN",      badge: "is-plain" },
    PARTIAL:   { i18n: "mon.stPARTIAL",   badge: "is-blue" },
    FULFILLED: { i18n: "mon.stFULFILLED", badge: "is-emerald" },
    OVER:      { i18n: "mon.stOVER",      badge: "is-red" }
  };

  function namaSasaran(a) {
    if (a.employee_id) return (NBStore.karyawan(a.employee_id) || {}).name || a.employee_id;
    if (a.new_position_title) return a.new_position_title;
    if (a.position_id) return (NBStore.posisi(a.position_id) || {}).title || a.position_id;
    if (a.vacancy_id) return a.vacancy_id;
    return "-";
  }

  function bar(persen) {
    var p = Math.min(100, persen);
    var warna = persen > 100 ? "var(--nb-red-200)"
      : (persen === 100 ? "var(--nb-emerald-bd)" : "var(--nb-blue-bd)");
    return "<div style='height:6px;border-radius:999px;background:var(--nb-gray-100);margin-top:6px'>" +
      "<div style='height:6px;width:" + p + "%;border-radius:999px;background:" + warna + "'></div></div>";
  }

  function tabelRingkas(r, bolehBiaya) {
    if (!r.perDept.length) return NBUi.kosong(T("mon.kosong"), T("mon.kosongSub"), NBUi.svg("layers"));
    return "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>" + NBUi.esc(T("umum.departemen")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("alok.thKuota")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("mon.thRealisasi")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("alok.thSisa")) + "</th>" +
      "<th>" + NBUi.esc(T("mon.thUtilisasi")) + "</th>" +
      (bolehBiaya ? "<th class='nb-num'>" + NBUi.esc(T("mon.thBiayaAlokasi")) + "</th>" +
                    "<th class='nb-num'>" + NBUi.esc(T("mon.thBiayaActual")) + "</th>" : "") +
      "</tr></thead><tbody>" + r.perDept.map(function (d) {
        return "<tr><td><div class='nb-cell-title'>" + NBUi.esc(d.name) + "</div>" +
          "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(d.cost_center_id) + "</div></td>" +
          "<td class='nb-num'>" + NBFormat.angka(d.kuota) + "</td>" +

      "<th class='nb-num'>" + NBUi.esc(T("alok.thSisa")) + "</th>" +
      "<th>" + NBUi.esc(T("umum.status")) + "</th>" +

      "</tr></thead><tbody>" + semua.map(function (a) {

  function tabelException(r, bolehPutus) {
    if (!r.exceptions.length) return NBUi.kosong(T("mon.excKosong"), T("mon.excKosongSub"));
    return "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>" + NBUi.esc(T("mon.thException")) + "</th>" +
      "<th>" + NBUi.esc(T("umum.departemen")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("mon.thKelebihan")) + "</th>" +
      "<th>" + NBUi.esc(T("umum.status")) + "</th>" +
      (bolehPutus ? "<th class='nb-num'>" + NBUi.esc(T("umum.aksi")) + "</th>" : "") +
      "</tr></thead><tbody>" + r.exceptions.map(function (e) {
        var d = NBStore.departemen(e.department_id);
        var badge = e.status === "PENDING" ? "is-amber"
          : (e.status === "ACCEPTED" ? "is-emerald" : "is-red");
        return "<tr><td><span class='nb-code'>" + NBUi.esc(e.exception_id) + "</span>" +
            "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(e.allocation_id) + "</div></td>" +
          "<td>" + NBUi.esc(d ? d.name : e.department_id) + "</td>" +
          "<td class='nb-num'><b>" + e.kelebihan + "</b></td>" +
          "<td>" + NBUi.badge(T("mon.exc" + e.status), badge) +
            (e.reason ? "<div class='nb-cell-sub'>" + NBUi.esc(e.reason) + "</div>" : "") + "</td>" +
          (bolehPutus
            ? "<td class='nb-num' style='white-space:nowrap'>" + (e.status === "PENDING"
                ? "<button class='nb-btn nb-btn-outline' data-exc-ok='" + e.exception_id + "'>" +

                  "<button class='nb-btn nb-btn-ghost-danger' data-exc-no='" + e.exception_id + "'>" +

                : "<span class='nb-muted'>-</span>") + "</td>"
            : "") + "</tr>";
      }).join("") + "</tbody></table></div>";

  // Persetujuan HC (F5-1): daftar realisasi yang menunggu, dengan tombol setujui atau tolak.

      "<th>" + NBUi.esc(T("mon.thId")) + "</th>" +
      "<th>" + NBUi.esc(T("plan.thAction")) + "</th>" +

      "<th>" + NBUi.esc(T("mon.thTanggal")) + "</th>" +
      "<th>" + NBUi.esc(T("mon.thDampakMaster")) + "</th>" +
      (bolehSetuju ? "<th class='nb-num'>" + NBUi.esc(T("umum.aksi")) + "</th>" : "") +
      "</tr></thead><tbody>" + daftar.map(function (a) {
        return "<tr><td><span class='nb-code'>" + NBUi.esc(a.actual_id) + "</span>" +
            "<div class='nb-cell-sub'>" + NBUi.esc((NBStore.departemen(a.department_id) || {}).name || "") + "</div></td>" +
          "<td>" + NBUi.badge(T("act." + a.action_type), (NBActions.def(a.action_type) || {}).badge) + "</td>" +
          "<td>" + NBUi.esc(a.employee_name || "-") + (a.employee_id ? "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(a.employee_id) + "</div>" : "") + "</td>" +
          "<td>" + NBUi.esc(NBFormat.tanggal(a.actual_date)) + "</td>" +

              "<button class='nb-btn nb-btn-outline' data-hc-ok='" + a.actual_id + "'>" + NBUi.esc(T("mon.hcSetuju")) + "</button> " +
              "<button class='nb-btn nb-btn-ghost-danger' data-hc-no='" + a.actual_id + "'>" + NBUi.esc(T("mon.hcTolak")) + "</button></td>"
