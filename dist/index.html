  function kurvaBulan(r) {
    var maks = r.perBulan.reduce(function (m, b) { return Math.max(m, b.rencana, b.realisasi); }, 1);
    return "<div style='padding:4px 20px 20px;display:grid;grid-template-columns:repeat(12,1fr);" +
      "gap:6px;align-items:end'>" + r.perBulan.map(function (b) {
        var t1 = Math.round(b.rencana / maks * 70), t2 = Math.round(b.realisasi / maks * 70);
        return "<div style='text-align:center'>" +
          "<div style='height:76px;display:flex;align-items:flex-end;gap:3px;justify-content:center'>" +
            "<div style='width:40%;height:" + Math.max(2, t1) + "px;background:var(--nb-gray-200);" +
              "border-radius:4px 4px 0 0'></div>" +
            "<div style='width:40%;height:" + Math.max(2, t2) + "px;background:var(--nb-blue-bd);" +
              "border-radius:4px 4px 0 0'></div>" +
          "</div><div class='nb-kpi-label' style='margin:6px 0 2px'>" +
          NBUi.esc(NBFormat.bulanPendek(b.bulan)) + "</div>" +
          "<div class='nb-cell-sub'>" + b.rencana + " / " + b.realisasi + "</div></div>";
      }).join("") + "</div>" +
      "<p class='nb-cell-sub' style='padding:0 20px 20px;margin:0'>" + NBUi.esc(T("mon.kurvaKet")) + "</p>";
  }

  function render() {
    var u = NBStore.user();
    var c = NBStore.siklusAktif();
    if (!c) return "<div class='nb-card'>" + NBUi.kosong(T("dash.siklusKosong"), T("dash.siklusKosongSub")) + "</div>";

    var r = NBStore.ringkasMonitoring(c.cycle_id);
    var deps = NBStore.departemenTerlihat();
    var bolehBiaya = deps.every(function (d) { return NBRbac.canSeeCost(u, d.department_id); });
    var bolehCatat = NBRbac.can(u, "actual.record") && c.status !== "CLOSED";
    var bolehPutus = NBRbac.can(u, "consolidate") && NBRbac.can(u, "monitor.all");

    var bolehSetuju = NBRbac.can(u, "actual.approve") && c.status !== "CLOSED";
    var menungguHc = NBStore.realisasiMenunggu(c.cycle_id).length;
    var tabs = [["ringkas", "mon.tabRingkas"], ["alokasi", "mon.tabAlokasi"],
                ["realisasi", "mon.tabRealisasi"], ["persetujuan", "mon.tabPersetujuan"],
                ["bulan", "mon.tabBulan"], ["exception", "mon.tabException"]];
    var isi = state.tab === "alokasi" ? tabelAlokasi(r, bolehCatat)
            : state.tab === "persetujuan" ? tabelPersetujuan(bolehSetuju)
            : (state.tab === "realisasi" ? tabelRealisasi(r, bolehCatat)
            : (state.tab === "bulan" ? kurvaBulan(r)
            : (state.tab === "exception" ? tabelException(r, bolehPutus) : tabelRingkas(r, bolehBiaya))));

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("mon.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("mon.sub", { name: c.name })) + "</p></div>" +
      (r.menunggu ? NBUi.badge(T("mon.menunggu", { n: r.menunggu }), "is-red") : NBUi.badge(c.name, "is-plain")) +
    "</div>" +

    "<div class='nb-kpigrid'>" +
      NBUi.kpi(T("alok.thKuota"), NBFormat.angka(r.total.kuota), "layers", "is-blue", T("mon.kpiKuotaKet")) +
      NBUi.kpi(T("mon.thRealisasi"), NBFormat.angka(r.total.terpakai), "check", "is-emerald",
               T("mon.kpiRealisasiKet", { h: NBFormat.delta(r.total.hcRealisasi) })) +
      NBUi.kpi(T("mon.thUtilisasi"), r.total.utilisasi + " persen", "chart", "",
               T("mon.kpiUtilisasiKet", { n: r.total.sisa })) +
      (bolehBiaya
        ? NBUi.kpi(T("mon.thBiayaActual"), NBFormat.rupiahRingkas(r.total.biayaActual), "shield", "is-amber",
                   T("mon.kpiBiayaKet", { n: NBFormat.rupiahRingkas(r.total.biayaAlokasi) }), true)
        : NBUi.kpi(T("mon.kpiException"), NBFormat.angka(r.exceptions.length), "shield", "is-amber",
                   T("mon.kpiExceptionKet", { n: r.menunggu }))) +
    "</div>" +

    "<div class='nb-card nb-card-pad' style='margin-bottom:24px;background:var(--nb-gray-50)'>" +
      "<div class='nb-note'>" + NBUi.svg("shield") + "<div>" +
      "<div style='font-weight:600'>" + NBUi.esc(T("mon.aturanJudul")) + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("mon.aturanIsi")) + "</div></div></div></div>" +

    "<div class='nb-card'>" +
      "<div class='nb-toolbar'><div class='nb-tabs'>" + tabs.map(function (t) {
        return "<button class='nb-tab" + (state.tab === t[0] ? " is-active" : "") +
               "' data-tab='" + t[0] + "'>" + NBUi.esc(T(t[1])) +
               (t[0] === "persetujuan" && menungguHc ? " " + NBUi.badge(String(menungguHc), "is-amber") : "") + "</button>";
      }).join("") + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("mon.dasar")) + "</div></div>" + isi +
    "</div>";
  }

  function dialogCatat(allocationId) {
    var c = NBStore.siklusAktif();
    var a = NBStore.alokasiTerlihat(c.cycle_id).filter(function (x) {
      return x.allocation_id === allocationId;
    })[0];
    if (!a) return;
    var host = document.createElement("div");
    host.innerHTML =
      "<div class='nb-overlay' id='mCatat'><div class='nb-modal' style='max-width:560px'>" +
      "<div class='nb-modal-head'><div><div class='nb-modal-title'><h2>" +
        NBUi.esc(T("mon.catatJudul")) + "</h2></div>" +
        "<div class='nb-metachips'><span class='nb-metachip is-code'>" + NBUi.esc(allocationId) + "</span>" +
        "<span class='nb-metachip'>" + NBUi.esc(T("mon.sisaKuota", { n: a.remaining_qty })) + "</span></div></div>" +
        "<button class='nb-iconbtn' data-batal='1'>&times;</button></div>" +
      "<div class='nb-modal-body'><div class='nb-section' style='margin-bottom:0'>" +
        "<div class='nb-fields'>" +
          "<div><div class='nb-field-label'>" + NBUi.esc(T("mon.fTanggal")) + "</div>" +
          "<input class='nb-input' id='cTanggal' type='date' value='" +
            NBUi.esc(c.year + "-0" + Math.min(9, a.effective_month || 1) + "-01") + "'></div>" +
          "<div><div class='nb-field-label'>" + NBUi.esc(T("plan.thQty")) + "</div>" +
          "<input class='nb-input' id='cQty' type='number' min='1' value='1'></div>" +
        "</div>" +
        "<div style='margin-top:14px'><div class='nb-field-label'>" + NBUi.esc(T("mon.fNama")) + "</div>" +
        "<input class='nb-input' id='cNama' placeholder='" + NBUi.esc(T("mon.fNamaPlaceholder")) + "'></div>" +
        "<div style='margin-top:14px'><div class='nb-field-label'>" + NBUi.esc(T("mon.fNik")) + "</div>" +
        "<input class='nb-input' id='cNik'></div>" +
        "<div id='cGalat' class='nb-cell-sub' style='color:var(--nb-red-700);margin-top:10px'></div>" +
        "<p class='nb-cell-sub' style='margin-top:10px'>" + NBUi.esc(T("mon.fCatatan")) + "</p>" +
      "</div></div>" +
      "<div class='nb-modal-foot'><button class='nb-btn nb-btn-quiet' data-batal='1'>" +
        NBUi.esc(T("umum.batal")) + "</button>" +
      "<div class='nb-group'><button class='nb-btn nb-btn-primary' id='cOk'>" +
        NBUi.esc(T("mon.catat")) + "</button></div></div></div></div>";
    document.body.appendChild(host.firstChild);
    var modal = document.getElementById("mCatat");
    modal.querySelectorAll("[data-batal]").forEach(function (x) { x.onclick = function () { modal.remove(); }; });
    modal.onclick = function (e) { if (e.target === modal) modal.remove(); };
    document.getElementById("cOk").onclick = function () {
      var res = NBStore.catatActual(allocationId, {
        quantity: document.getElementById("cQty").value,
        actual_date: document.getElementById("cTanggal").value,
        employee_name: document.getElementById("cNama").value.trim(),
        employee_id: document.getElementById("cNik").value.trim() || null
      });
      if (!res.ok) {
        document.getElementById("cGalat").textContent = T(res.kunci, res.vars || {});
        return;
      }
      modal.remove();
      NBUi.toast(res.exception ? T("mon.tercatatException") : T("mon.tercatat"), res.exception ? "error" : "ok");
      NBApp.ulang();
    };
  }

  function mount() {
    document.querySelectorAll("button[data-tab]").forEach(function (b) {
      b.onclick = function () { state.tab = b.dataset.tab; NBApp.ulang(); };
    });
    document.querySelectorAll("button[data-catat]").forEach(function (b) {
      b.onclick = function () { dialogCatat(b.dataset.catat); };
    });
    document.querySelectorAll("button[data-batal]").forEach(function (b) {
      if (!b.dataset.batal || b.dataset.batal === "1") return;
      b.onclick = function () {
        NBUi.konfirmasi({
          judul: T("mon.batalJudul"), pesan: T("mon.batalPesan"),
          perluAlasan: true, labelAlasan: T("review.alasanLabel"),
          pesanAlasan: T("review.errAlasan"), ok: T("mon.batalkan"),
          batal: T("umum.batal"), gaya: "nb-btn-soft-danger"
        }, function (alasan) {
          var res = NBStore.batalkanActual(b.dataset.batal, alasan);
          NBUi.toast(res.ok ? T("mon.dibatalkan") : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
          if (res.ok) NBApp.ulang();
        });
      };
    });
    document.querySelectorAll("button[data-hc-ok], button[data-hc-no]").forEach(function (b) {
      var setuju = !!b.dataset.hcOk;
      var id = setuju ? b.dataset.hcOk : b.dataset.hcNo;
      b.onclick = function () {
        NBUi.konfirmasi({
          judul: T(setuju ? "mon.hcSetujuJudul" : "mon.hcTolakJudul"),
          pesan: T(setuju ? "mon.hcSetujuPesan" : "mon.hcTolakPesan"),
          perluAlasan: !setuju, labelAlasan: T("review.alasanLabel"), pesanAlasan: T("review.errAlasan"),
          ok: T(setuju ? "mon.hcSetuju" : "mon.hcTolak"), batal: T("umum.batal"),
          gaya: setuju ? "nb-btn-primary" : "nb-btn-soft-danger"
        }, function (alasan) {
          var res = NBStore.setujuiRealisasi(id, setuju ? "SETUJU" : "TOLAK", alasan);
          NBUi.toast(res.ok ? T("mon.hcDiputus") : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
          if (res.ok) NBApp.ulang();
        });
      };
    });
    document.querySelectorAll("button[data-exc-ok], button[data-exc-no]").forEach(function (b) {
      var terima = !!b.dataset.excOk;
      var id = terima ? b.dataset.excOk : b.dataset.excNo;
      b.onclick = function () {
        NBUi.konfirmasi({
          judul: T(terima ? "mon.excTerimaJudul" : "mon.excTolakJudul"),
          pesan: T(terima ? "mon.excTerimaPesan" : "mon.excTolakPesan"),
          perluAlasan: true, labelAlasan: T("review.alasanLabel"),
          pesanAlasan: T("review.errAlasan"), ok: T(terima ? "mon.excTerima" : "mon.excTolak"),
          batal: T("umum.batal"), gaya: terima ? "nb-btn-primary" : "nb-btn-soft-danger"
        }, function (alasan) {
          var res = NBStore.putuskanException(id, terima ? "ACCEPT" : "REJECT", alasan);
          NBUi.toast(res.ok ? T("mon.excDiputus") : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
          if (res.ok) NBApp.ulang();
        });
      };
    });
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.monitoring = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/matriks.js */
// Layar Matriks Jan sampai Des. Bentuk baku lembar MPP bulanan.
//
// Tiga pita baris per unit: Budget, Actual, Selisih, dikali dua belas kolom bulan.
// Angka bulanan adalah posisi akhir bulan, bukan penambahan pada bulan itu, sehingga
// bisa dibandingkan langsung dengan headcount payroll bulan berjalan.
(function (global) {
  "use strict";

  var T = function (k, v) { return NBi18n.t(k, v); };
  var state = { mode: "HC", level: "DEPT" };

  function nilai(v, mode) {
    if (mode === "RP") return NBFormat.rupiahRingkas(v);
    return NBFormat.angka(v);
  }

  function selSelisih(v, mode) {
    if (v === 0) return "<span class='nb-muted'>0</span>";
    var warna = v < 0 ? "var(--nb-red-700)" : "var(--nb-emerald-fg)";
    return "<span style='color:" + warna + ";font-weight:600'>" +
           (v > 0 ? "+" : "") + nilai(v, mode) + "</span>";
  }

  function pita(b, kunciPita, label, mode, gaya) {
    var sel = "";
    for (var m = 0; m < 12; m++) {
      sel += "<td class='nb-num nb-mono'>" +
        (kunciPita === "selisih" ? selSelisih(b.selisih[m], mode) : nilai(b[kunciPita][m], mode)) +
        "</td>";
    }
    return "<tr" + (gaya || "") + ">" +
      "<td class='nb-matriks-label'>" + NBUi.esc(label) + "</td>" + sel +
      "<td class='nb-num nb-mono'><b>" +
        (kunciPita === "selisih" ? selSelisih(b.selisih[11], mode) : nilai(b[kunciPita][11], mode)) +
      "</b></td></tr>";
  }

  function tabel(mx) {
    if (!mx.baris.length) {
      return NBUi.kosong(T("mx.kosong"), T("mx.kosongSub"), NBUi.svg("layers"));
    }
    var kepala = "<tr><th class='nb-matriks-label'>" + NBUi.esc(T("mx.thUnit")) + "</th>";
    for (var m = 1; m <= 12; m++) {
      kepala += "<th class='nb-num'>" + NBUi.esc(NBFormat.bulanPendek(m)) + "</th>";
    }
    kepala += "<th class='nb-num'>" + NBUi.esc(T("mx.thDesember")) + "</th></tr>";

    var isi = mx.baris.map(function (b) {
      var judul = "<tr class='is-active'><td class='nb-matriks-label' colspan='14'>" +
        "<div class='nb-cell-title'>" + NBUi.esc(b.jabatan || b.departemen) + "</div>" +
        "<div class='nb-cell-sub'>" + NBUi.esc(
          (b.jabatan ? b.departemen + " &middot; " : "") + b.divisi + " &middot; " +
          b.entitas + " &middot; " + b.negara + " &middot; " + b.cost_center_id
        ).replace(/&amp;middot;/g, "&middot;") + "</div></td></tr>";
      return judul +
        pita(b, "budget", T("mx.budget"), mx.mode) +
        pita(b, "actual", T("mx.actual"), mx.mode) +
        pita(b, "selisih", T("mx.selisih"), mx.mode);
    }).join("");

    var total = "<tr class='is-active'><td class='nb-matriks-label' colspan='14'>" +
      "<div class='nb-cell-title'>" + NBUi.esc(T("kons.totalPerusahaan")) + "</div></td></tr>" +
      pita(mx.total, "budget", T("mx.budget"), mx.mode, " style='font-weight:600'") +
      pita(mx.total, "actual", T("mx.actual"), mx.mode, " style='font-weight:600'") +
      pita(mx.total, "selisih", T("mx.selisih"), mx.mode, " style='font-weight:600'");

    return "<div class='nb-tablewrap'><table class='nb-table nb-matriks'>" +
      "<thead>" + kepala + "</thead><tbody>" + isi + total + "</tbody></table></div>";
  }

  function render() {
    var u = NBStore.user();
    var c = NBStore.siklusAktif();
    if (!c) return "<div class='nb-card'>" + NBUi.kosong(T("dash.siklusKosong"), T("dash.siklusKosongSub")) + "</div>";

    var deps = NBStore.departemenTerlihat();
    var bolehBiaya = deps.every(function (d) { return NBRbac.canSeeCost(u, d.department_id); });
    if (!bolehBiaya && state.mode === "RP") state.mode = "HC";

    var mx = NBStore.matriksBulanan(c.cycle_id, state);

    var tombolMode = bolehBiaya
      ? "<div class='nb-tabs'>" +
        [["HC", "mx.modeHc"], ["RP", "mx.modeRp"]].map(function (t) {
          return "<button class='nb-tab" + (state.mode === t[0] ? " is-active" : "") +
                 "' data-mode='" + t[0] + "'>" + NBUi.esc(T(t[1])) + "</button>";
        }).join("") + "</div>"
      : NBUi.badge(T("mx.modeHc"), "is-plain");

    var tombolLevel = "<div class='nb-tabs'>" +
      [["DEPT", "mx.levelDept"], ["POSISI", "mx.levelPosisi"]].map(function (t) {
        return "<button class='nb-tab" + (state.level === t[0] ? " is-active" : "") +
               "' data-level='" + t[0] + "'>" + NBUi.esc(T(t[1])) + "</button>";
      }).join("") + "</div>";

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("mx.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("mx.sub", { name: c.name })) + "</p></div>" +
      "<button class='nb-btn nb-btn-primary' id='mxEkspor'>" + NBUi.esc(T("lap.ekspor")) + "</button>" +
    "</div>" +

    "<div class='nb-card nb-card-pad' style='margin-bottom:24px;background:var(--nb-gray-50)'>" +
      "<div class='nb-note'>" + NBUi.svg("shield") + "<div>" +
      "<div style='font-weight:600'>" + NBUi.esc(T("mx.aturanJudul")) + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("mx.aturanIsi")) + "</div></div></div></div>" +

    (mx.lintasMataUang && mx.mode === "RP"
      ? "<div class='nb-card nb-card-pad' style='margin-bottom:24px;background:var(--nb-gray-50)'>" +
        NBUi.esc(T("mx.lintasMataUang")) + "</div>" : "") +
    (mx.punyaSnapshot ? "" :
      "<div class='nb-card nb-card-pad' style='margin-bottom:24px;border-color:var(--nb-amber-bd);" +
      "background:var(--nb-amber-bg)'><b>" + NBUi.esc(T("mx.tanpaSnapshot")) + "</b> " +
      NBUi.esc(T("mx.tanpaSnapshotSub")) + "</div>") +

    "<div class='nb-card'>" +
      "<div class='nb-toolbar'>" +
        "<div style='display:flex;gap:16px;align-items:center;flex-wrap:wrap'>" +
          tombolMode + tombolLevel + "</div>" +
        "<div class='nb-cell-sub'>" + NBUi.esc(T("mx.dasar")) + "</div>" +
      "</div>" + tabel(mx) +
    "</div>";
  }

  function mount() {
    document.querySelectorAll("button[data-mode]").forEach(function (b) {
      b.onclick = function () { state.mode = b.dataset.mode; NBApp.ulang(); };
    });
    document.querySelectorAll("button[data-level]").forEach(function (b) {
      b.onclick = function () { state.level = b.dataset.level; NBApp.ulang(); };
    });
    var ek = document.getElementById("mxEkspor");
    if (ek) ek.onclick = function () {
      var c = NBStore.siklusAktif();
      var data = NBStore.dataLaporan("R10", c.cycle_id);
      var nama = "matriks-bulanan-" + c.cycle_id + ".csv";
      var ok = NBReport.unduh(nama, NBReport.keCsv(data.kolom, data.baris));
      NBUi.toast(ok ? T("lap.terunduh", { n: nama }) : T("lap.gagalUnduh"), ok ? "ok" : "error");
      NBAudit.tulis(NBStore.user(), "REPORT_EXPORT", "Report", "R10",
        { key: "audit.d.ekspor", vars: { id: "R10", n: data.baris.length } });
    };
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.matriks = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/bagan.js */
// Layar Bagan Organisasi (masukan Dzuhri nomor 3).
// Digambar dari kolom atasan langsung, bukan dari hierarki departemen. Satu kotak satu orang.
// Vacancy terbuka dan alokasi yang disetujui tetapi belum terisi digambar garis putus.
(function (global) {
  "use strict";

  var T = function (k, v) { return NBi18n.t(k, v); };
  var state = { akar: null, dibuka: {}, tampilkanMpp: true };

  // Akar awal mengikuti persona: manajer dan HOD mulai dari dirinya, peran lain memilih.
  function akarAwal(u, pohon) {
    // Lingkup pohon selalu mulai dari dirinya; pilihan akar dari sesi lain tidak boleh terbawa.
    if (u.scope && u.scope.type === "TREE") return u.scope.employee_id;
    if (state.akar && pohon.peta[state.akar]) return state.akar;
    return pohon.puncak[0] || null;
  }

  // Kotak tambahan per atasan: vacancy terbuka di posisi bawahannya, dan alokasi yang belum terisi.
  function tambahanMpp(pohon, c) {
    var peta = {};
    if (!state.tampilkanMpp) return peta;
    var karyawan = NBStore.karyawanTerlihat();
    // Atasan sebuah posisi: atasan dari orang yang sedang memegang posisi itu, atau HOD-nya.
    function atasanPosisi(positionId, departmentId) {
      var pemegang = karyawan.filter(function (e) { return e.position_id === positionId && e.direct_report_id; })[0];
      if (pemegang) return pemegang.direct_report_id;
      var hod = NBStore.hodDari(departmentId);
      return hod ? hod.employee_id : null;
    }
    NBStore.vacancyTerlihat().filter(function (v) { return v.status === "Open"; }).forEach(function (v) {
      var atas = atasanPosisi(v.position_id, v.department_id);
      if (!atas) return;
      (peta[atas] = peta[atas] || []).push({ jenis: "vacancy", judul: T("bagan.vacancy"),
        sub: v.position_title || v.position_id, grade: v.grade_id || "" });
    });
    if (c) {
      NBStore.alokasiTerlihat(c.cycle_id).forEach(function (a) {
        if (a.hc_impact <= 0 || a.remaining_qty <= 0) return;
        var atas = a.position_id ? atasanPosisi(a.position_id, a.department_id)
          : (NBStore.hodDari(a.department_id) || {}).employee_id;
        if (!atas) return;
        var judul = a.new_position_title || (NBStore.posisi(a.position_id) || {}).title || a.action_type;
        for (var i = 0; i < a.remaining_qty; i++) {
          (peta[atas] = peta[atas] || []).push({ jenis: "alokasi", judul: T("bagan.alokasi"),
            sub: judul, grade: a.grade_id || "" });
        }
      });
    }
    return peta;
  }

  function render() {
    var u = NBStore.user();
    var pohon = NBStore.pohonOrganisasi();
    var c = NBStore.siklusAktif();
    if (!pohon.puncak.length) {
      return "<div class='nb-pagehead'><div><h1>" + NBUi.esc(T("bagan.judul")) + "</h1></div></div>" +
        "<div class='nb-card'>" + NBUi.kosong(T("kosong.karyawan"), "", NBUi.svg("users")) + "</div>";
    }
    var akar = akarAwal(u, pohon);
    state.akar = akar;
    var batasDept = u.scope.type === "TREE" ? u.scope.department_id : null;

    var hasil = NBBagan.susun(akar, pohon, state.dibuka, {
      batasDept: batasDept,
      tambahan: tambahanMpp(pohon, c),
      bolehDilipat: function (e) { return NBOrganisasi.bolehDilipat(e, NBStore.levelGrade); },
      kedalamanAwal: 2,
      label: function (e) {
        var p = NBStore.posisi(e.position_id);
        return { judul: e.name, sub: p ? p.title : e.position_id, grade: e.grade_id + " \u00b7 " +
                 ((NBStore.departemen(e.department_id) || {}).name || "") };
      }
    });

    // Pemilih akar untuk peran berlingkup penuh: puncak tiap departemen.
    var pilihAkar = u.scope.type === "ALL"
      ? "<select class='nb-select' id='bgAkar' style='width:300px'>" + pohon.puncak.map(function (id) {
          var e = pohon.peta[id];
          return "<option value='" + id + "'" + (id === akar ? " selected" : "") + ">" +
            NBUi.esc(e.name + " \u00b7 " + ((NBStore.departemen(e.department_id) || {}).name || "")) + "</option>";
        }).join("") + "</select>"
      : NBUi.badge(T("bagan.pohonAnda"), "is-plain");

    var jumlahOrang = hasil.simpul.filter(function (n) { return n.jenis === "orang"; }).length;
    var jumlahVac = hasil.simpul.filter(function (n) { return n.jenis === "vacancy"; }).length;
    var jumlahAlok = hasil.simpul.filter(function (n) { return n.jenis === "alokasi"; }).length;

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("bagan.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("bagan.sub")) + "</p></div>" +
      "<div style='display:flex;gap:8px'>" +
        "<button class='nb-btn nb-btn-outline' id='bgLipat'>" + NBUi.esc(T("bagan.lipatSemua")) + "</button>" +
        "<button class='nb-btn nb-btn-primary' id='bgEkspor'>" + NBUi.esc(T("bagan.ekspor")) + "</button>" +
      "</div></div>" +

    "<div class='nb-card nb-card-pad' style='margin-bottom:24px;background:var(--nb-gray-50)'>" +
      "<div class='nb-note'>" + NBUi.svg("shield") + "<div>" +
      "<div style='font-weight:600'>" + NBUi.esc(T("bagan.aturanJudul")) + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("bagan.aturanIsi")) + "</div></div></div></div>" +

    "<div class='nb-card'>" +
      "<div class='nb-toolbar'><div style='display:flex;gap:12px;align-items:center;flex-wrap:wrap'>" +
        pilihAkar +
        "<label class='nb-cell-sub' style='display:flex;gap:6px;align-items:center;cursor:pointer'>" +
          "<input type='checkbox' id='bgMpp'" + (state.tampilkanMpp ? " checked" : "") + "> " +
          NBUi.esc(T("bagan.tampilkanMpp")) + "</label>" +
      "</div><div class='nb-cell-sub'>" +
        NBUi.esc(T("bagan.ringkas", { o: jumlahOrang, v: jumlahVac, a: jumlahAlok })) +
        (hasil.terpotong ? " " + NBUi.badge(T("bagan.terpotong", { n: NBBagan.BATAS_KOTAK }), "is-amber") : "") +
      "</div></div>" +
      "<div class='nb-legenda' style='padding:0 20px 12px;display:flex;gap:16px;flex-wrap:wrap'>" +
        "<span class='nb-cell-sub'><span class='nb-legenda-kotak' style='border:1.5px solid #E8E9ED'></span>" + NBUi.esc(T("bagan.legOrang")) + "</span>" +
        "<span class='nb-cell-sub'><span class='nb-legenda-kotak' style='border:1.5px dashed #9EA3AE'></span>" + NBUi.esc(T("bagan.legVacancy")) + "</span>" +
        "<span class='nb-cell-sub'><span class='nb-legenda-kotak' style='border:1.5px dashed #3273F6;background:#F1F6FE'></span>" + NBUi.esc(T("bagan.legAlokasi")) + "</span>" +
        "<span class='nb-cell-sub'>" + NBUi.esc(T("bagan.legKlik")) + "</span>" +
      "</div>" +
      "<div class='nb-tablewrap' style='padding:8px 20px 20px;background:var(--nb-white)'>" + hasil.svg + "</div>" +
    "</div>";
  }

  function mount() {
    var akar = document.getElementById("bgAkar");
    if (akar) akar.onchange = function () { state.akar = this.value; state.dibuka = {}; NBApp.ulang(); };
    var mpp = document.getElementById("bgMpp");
    if (mpp) mpp.onchange = function () { state.tampilkanMpp = this.checked; NBApp.ulang(); };
    var lipat = document.getElementById("bgLipat");
    if (lipat) lipat.onclick = function () { state.dibuka = {}; NBApp.ulang(); };
    document.querySelectorAll(".nb-bagan-simpul[data-id]").forEach(function (g) {
      g.addEventListener("click", function () {
        var id = g.getAttribute("data-id");
        if (id.indexOf("|") !== -1) return;   // kotak vacancy atau alokasi tidak bisa dibuka
        state.dibuka[id] = !state.dibuka[id];
        NBApp.ulang();
      });
    });
    var ekspor = document.getElementById("bgEkspor");
    if (ekspor) ekspor.onclick = function () {
      var svg = document.querySelector("svg.nb-bagan");
      if (!svg) return;
      var nama = "bagan-organisasi-" + (state.akar || "semua") + ".svg";
      var ok = NBReport.unduh(nama, svg.outerHTML, "image/svg+xml");
      NBUi.toast(ok ? T("lap.terunduh", { n: nama }) : T("lap.gagalUnduh"), ok ? "ok" : "error");
    };
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.bagan = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/laporan.js */
// Layar Laporan (bab 30). Sembilan laporan, semuanya memakai fungsi yang sama dengan
// yang dipakai layar lain, sehingga angka di laporan tidak mungkin berbeda dari angka
// di aplikasi. Lingkup baris dan hak kolom biaya tetap berlaku.
(function (global) {
  "use strict";

  var T = function (k, v) { return NBi18n.t(k, v); };
  var state = { laporan: "R3" };

  // cap: kapabilitas minimal. biaya: laporan memuat nominal.
  var DAFTAR = [
    { kode: "R1", i18n: "lap.R1", biaya: false },
    { kode: "R2", i18n: "lap.R2", biaya: false },
    { kode: "R3", i18n: "lap.R3", biaya: false },
    { kode: "R4", i18n: "lap.R4", biaya: true },
    { kode: "R5", i18n: "lap.R5", biaya: true },
    { kode: "R6", i18n: "lap.R6", biaya: false },
    { kode: "R7", i18n: "lap.R7", biaya: false },
    { kode: "R8", i18n: "lap.R8", biaya: false },
    { kode: "R9", i18n: "lap.R9", biaya: false },
    { kode: "R10", i18n: "lap.R10", biaya: false }
  ];

  function bolehBiaya(u) {
    return NBStore.departemenTerlihat().every(function (d) { return NBRbac.canSeeCost(u, d.department_id); });
  }

  function tersedia(u) {
    return DAFTAR.filter(function (l) { return !l.biaya || bolehBiaya(u); });
  }

  // Daftar kunci uang ditulis eksplisit. Pencocokan pola sempat membuat kolom
  // cost_center_id ikut diformat sebagai rupiah, dan isinya hilang jadi tanda hubung.
  var KUNCI_UANG = ["biaya", "monthly", "annualized", "monthly_cost", "annualized_cost",
                    "biayaAlokasi", "biayaActual"];

  function nilaiSel(kunci, v) {
    if (v === null || v === undefined || v === "") return "<span class='nb-muted'>-</span>";
    if (KUNCI_UANG.indexOf(kunci) !== -1) return "<span class='nb-mono'>" + NBFormat.rupiah(v) + "</span>";
    if (kunci === "action_type") return NBUi.badge(NBi18n.t("act." + v), (NBActions.def(v) || {}).badge);
    if (kunci === "timestamp") return NBUi.esc(NBFormat.tanggalPendek(v) + " " + NBFormat.jam(v));
    if (typeof v === "number") return NBFormat.angka(v);
    return NBUi.esc(String(v));
  }

  // Kolom dianggap angka bila kuncinya memang berisi angka, bukan karena labelnya
  // kebetulan mengandung kata tertentu.
  var KUNCI_ANGKA = ["quantity", "effective_month", "hc", "requested", "approved", "variance",
                     "b1", "b2", "b3", "b4", "b5", "b6", "b7", "b8", "b9", "b10", "b11", "b12", "total",
                     "approved_qty", "consumed_qty", "remaining_qty", "kuota", "terpakai", "sisa",
                     "utilisasi", "hcRealisasi", "kelebihan", "bulan", "baris"];
  function angka(k) {
    return KUNCI_ANGKA.indexOf(k.kunci) !== -1 || KUNCI_UANG.indexOf(k.kunci) !== -1;
  }

  function render() {
    var u = NBStore.user();
    var c = NBStore.siklusAktif();
    if (!c) return "<div class='nb-card'>" + NBUi.kosong(T("dash.siklusKosong"), T("dash.siklusKosongSub")) + "</div>";

    var daftar = tersedia(u);
    if (!daftar.some(function (l) { return l.kode === state.laporan; })) state.laporan = daftar[0].kode;
    var data = NBStore.dataLaporan(state.laporan, c.cycle_id);

    var isi = data.baris.length
      ? "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
        data.kolom.map(function (k) {
          return "<th" + (angka(k) ? " class='nb-num'" : "") + ">" + NBUi.esc(k.label) + "</th>";
        }).join("") + "</tr></thead><tbody>" +
        data.baris.slice(0, 100).map(function (b) {
          return "<tr>" + data.kolom.map(function (k) {
            return "<td" + (angka(k) ? " class='nb-num'" : "") + ">" +
                   nilaiSel(k.kunci, b[k.kunci]) + "</td>";
          }).join("") + "</tr>";
        }).join("") + "</tbody></table></div>" +
        (data.baris.length > 100
          ? "<p class='nb-cell-sub' style='padding:12px 20px;margin:0'>" +
            NBUi.esc(T("lap.potong", { n: data.baris.length })) + "</p>"
          : "")
      : NBUi.kosong(T("lap.kosong"), T("lap.kosongSub"), NBUi.svg("layers"));

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("lap.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("lap.sub", { name: c.name })) + "</p></div>" +
      (data.baris.length
        ? "<button class='nb-btn nb-btn-primary' id='lEkspor'>" + NBUi.esc(T("lap.ekspor")) + "</button>"
        : "") +
    "</div>" +

    "<div class='nb-card nb-card-pad' style='margin-bottom:24px;background:var(--nb-gray-50)'>" +
      "<div class='nb-note'>" + NBUi.svg("shield") + "<div>" +
      "<div style='font-weight:600'>" + NBUi.esc(T("lap.aturanJudul")) + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("lap.aturanIsi")) + "</div></div></div></div>" +

    "<div class='nb-card'>" +
      "<div class='nb-toolbar'>" +
        "<select class='nb-select' id='lPilih' style='width:340px'>" + daftar.map(function (l) {
          return "<option value='" + l.kode + "'" + (l.kode === state.laporan ? " selected" : "") + ">" +
                 NBUi.esc(l.kode + ". " + T(l.i18n)) + "</option>";
        }).join("") + "</select>" +
        "<div class='nb-cell-sub'>" + NBUi.esc(T("lap.jumlah", { n: data.baris.length })) + "</div>" +
      "</div>" + isi +
    "</div>";
  }

  function mount() {
    var pilih = document.getElementById("lPilih");
    if (pilih) pilih.onchange = function () { state.laporan = this.value; NBApp.ulang(); };

    var ekspor = document.getElementById("lEkspor");
    if (ekspor) ekspor.onclick = function () {
      var c = NBStore.siklusAktif();
      var data = NBStore.dataLaporan(state.laporan, c.cycle_id);
      var nama = state.laporan + "-" + c.cycle_id + ".csv";
      var berhasil = NBReport.unduh(nama, NBReport.keCsv(data.kolom, data.baris));
      NBUi.toast(berhasil ? T("lap.terunduh", { n: nama }) : T("lap.gagalUnduh"),
                 berhasil ? "ok" : "error");
      NBAudit.tulis(NBStore.user(), "REPORT_EXPORT", "Report", state.laporan,
        { key: "audit.d.ekspor", vars: { id: state.laporan, n: data.baris.length } });
    };
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.laporan = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/data.js */
// Layar Impor dan Ekspor Data.
// Alur yang dijaga: unduh templat, isi di Excel, unggah, lihat pratinjau, baru terapkan.
// Tidak ada jalur yang melewati validasi, dan tidak ada berkas yang langsung masuk
// tanpa pengguna melihat dulu berapa baris yang lolos dan berapa yang gagal.
(function (global) {
  "use strict";

  var T = function (k, v) { return NBi18n.t(k, v); };
  var state = { berkas: "USULAN", pratinjau: null, namaBerkas: null };

  function daftarBerkas() {
    return NBImpor.daftar().filter(function (k) { return NBStore.bolehImpor(k).ok; });
  }

  function kartuBerkas(kode) {
    var b = NBImpor.def(kode);
    var wajib = b.kolom.filter(function (k) { return k.w; }).length;
    return "<div class='nb-setting' style='margin-bottom:8px'>" +
      NBUi.badge(T("imp.f" + kode), "is-blue") +
      "<div style='flex:1'>" +
        "<div class='nb-setting-label'>" + NBUi.esc(T("imp.d" + kode)) + "</div>" +
        "<div class='nb-setting-desc'>" + NBUi.esc(T("imp.kolomInfo",
          { n: b.kolom.length, w: wajib })) + "</div>" +
      "</div>" +
      "<button class='nb-btn nb-btn-outline' data-templat='" + kode + "'>" +
        NBUi.esc(T("imp.templat")) + "</button>" +
      "<button class='nb-btn nb-btn-outline' data-ekspor='" + kode + "'>" +
        NBUi.esc(T("imp.eksporIsi")) + "</button>" +
    "</div>";
  }

  function tabelPratinjau() {
    var p = state.pratinjau;
    if (!p) return "";
    var kolomTampil = NBImpor.def(state.berkas).kolom.slice(0, 5).map(function (k) { return k.k; });

    return "<div class='nb-card' style='margin-top:24px'>" +
      "<div class='nb-toolbar'><div>" +
        "<div style='font-weight:600'>" + NBUi.esc(T("imp.pratinjauJudul", { n: state.namaBerkas })) + "</div>" +
        "<div class='nb-cell-sub'>" + NBUi.esc(T("imp.pratinjauSub",
          { v: p.valid, g: p.galat })) + "</div>" +
      "</div><div style='display:flex;gap:8px'>" +
        (p.galat ? "<button class='nb-btn nb-btn-outline' id='iUnduhGalat'>" +
          NBUi.esc(T("imp.unduhGalat")) + "</button>" : "") +
        "<button class='nb-btn nb-btn-quiet' id='iBatal'>" + NBUi.esc(T("umum.batal")) + "</button>" +
        (p.valid ? "<button class='nb-btn nb-btn-primary' id='iTerapkan'>" +
          NBUi.esc(T("imp.terapkan", { n: p.valid })) + "</button>" : "") +
      "</div></div>" +
      "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
        "<th class='nb-num'>" + NBUi.esc(T("imp.thBaris")) + "</th>" +
        kolomTampil.map(function (k) { return "<th>" + NBUi.esc(k) + "</th>"; }).join("") +
        "<th>" + NBUi.esc(T("imp.thHasil")) + "</th>" +
      "</tr></thead><tbody>" + p.hasil.slice(0, 60).map(function (h) {
        return "<tr" + (h.ok ? "" : " style='background:var(--nb-red-50)'") + ">" +
          "<td class='nb-num nb-mono'>" + (h.baris._baris || "-") + "</td>" +
          kolomTampil.map(function (k) {
            return "<td class='nb-cell-sub'>" + NBUi.esc(h.baris[k] || "-") + "</td>";
          }).join("") +
          "<td>" + (h.ok
            ? NBUi.badge(T("imp.a" + (h.aksi || "TAMBAH")), "is-emerald")
            : NBUi.badge((h.kodeGalat ? h.kodeGalat + " " : "") + T(h.kunci, h.vars), "is-red")) +
          "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      (p.hasil.length > 60
        ? "<p class='nb-cell-sub' style='padding:12px 20px;margin:0'>" +
          NBUi.esc(T("lap.potong", { n: p.hasil.length })) + "</p>"
        : "") +
    "</div>";
  }

  function render() {
    var u = NBStore.user();
    var c = NBStore.siklusAktif();
    if (!c) return "<div class='nb-card'>" + NBUi.kosong(T("dash.siklusKosong"), T("dash.siklusKosongSub")) + "</div>";
    var daftar = daftarBerkas();
    if (!daftar.length) {
      return "<div class='nb-pagehead'><div><h1>" + NBUi.esc(T("imp.judul")) + "</h1>" +
        "<p>" + NBUi.esc(T("imp.sub")) + "</p></div></div>" +
        "<div class='nb-card'>" + NBUi.kosong(T("imp.tidakAda"), T("imp.tidakAdaSub")) + "</div>";
    }
    if (daftar.indexOf(state.berkas) === -1) state.berkas = daftar[0];

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("imp.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("imp.sub")) + "</p></div>" +
      (NBRbac.can(u, "admin")
        ? "<div style='display:flex;gap:8px'>" +
          "<button class='nb-btn nb-btn-outline' id='iCadangan'>" + NBUi.esc(T("imp.cadangan")) + "</button>" +
          "<label class='nb-btn nb-btn-outline' style='cursor:pointer'>" + NBUi.esc(T("imp.pulihkan")) +
          "<input type='file' id='iPulih' accept='.json' style='display:none'></label></div>"
        : "") +
    "</div>" +

    "<div class='nb-card nb-card-pad' style='margin-bottom:24px;background:var(--nb-gray-50)'>" +
      "<div class='nb-note'>" + NBUi.svg("shield") + "<div>" +
      "<div style='font-weight:600'>" + NBUi.esc(T("imp.aturanJudul")) + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("imp.aturanIsi")) + "</div></div></div></div>" +

    "<div class='nb-card nb-card-pad' style='margin-bottom:24px'>" +
      "<div class='nb-card-head'>" + NBUi.svg("layers") + "<div>" +
      "<h3>" + NBUi.esc(T("imp.unduhJudul")) + "</h3>" +
      "<p>" + NBUi.esc(T("imp.unduhSub")) + "</p></div></div>" +
      daftar.map(kartuBerkas).join("") +
    "</div>" +

    "<div class='nb-card nb-card-pad'>" +
      "<div class='nb-card-head'>" + NBUi.svg("save") + "<div>" +
      "<h3>" + NBUi.esc(T("imp.unggahJudul")) + "</h3>" +
      "<p>" + NBUi.esc(T("imp.unggahSub")) + "</p></div></div>" +
      "<div class='nb-setting'>" +
        "<div style='flex:1'>" +
          "<div class='nb-setting-label'>" + NBUi.esc(T("imp.pilihBerkas")) + "</div>" +
          "<select class='nb-select' id='iJenis' style='margin-top:8px;width:100%'>" +
            daftar.map(function (k) {
              return "<option value='" + k + "'" + (k === state.berkas ? " selected" : "") + ">" +
                     NBUi.esc(T("imp.d" + k)) + "</option>";
            }).join("") + "</select>" +
        "</div>" +
        "<label class='nb-btn nb-btn-primary' style='cursor:pointer'>" + NBUi.esc(T("imp.pilihCsv")) +
        "<input type='file' id='iFile' accept='.csv,text/csv' style='display:none'></label>" +
      "</div>" +
      "<div id='iPesan' class='nb-cell-sub' style='color:var(--nb-red-700);margin-top:10px'></div>" +
    "</div>" +

    tabelPratinjau();
  }

  function bacaBerkas(file, selesai) {
    var fr = new FileReader();
    fr.onload = function () { selesai(String(fr.result)); };
    fr.onerror = function () { NBUi.toast(T("imp.errBaca"), "error"); };
    fr.readAsText(file, "utf-8");
  }

  function mount() {
    var c = NBStore.siklusAktif();

    document.querySelectorAll("button[data-templat]").forEach(function (b) {
      b.onclick = function () {
        var kode = b.dataset.templat;
        NBReport.unduh("templat-" + kode.toLowerCase() + ".csv", NBImpor.templat(kode));
        NBUi.toast(T("imp.templatTerunduh", { n: T("imp.d" + kode) }));
      };
    });

    document.querySelectorAll("button[data-ekspor]").forEach(function (b) {
      b.onclick = function () {
        var kode = b.dataset.ekspor;
        var data = NBStore.eksporData(kode, c.cycle_id);
        NBReport.unduh(kode.toLowerCase() + "-" + c.cycle_id + ".csv",
          NBReport.keCsv(data.kolom, data.baris));
        NBUi.toast(T("lap.terunduh", { n: kode.toLowerCase() + ".csv" }));
      };
    });

    var jenis = document.getElementById("iJenis");
    if (jenis) jenis.onchange = function () {
      state.berkas = this.value; state.pratinjau = null; NBApp.ulang();
    };

    var file = document.getElementById("iFile");
    if (file) file.onchange = function () {
      var f = this.files && this.files[0];
      if (!f) return;
      bacaBerkas(f, function (teks) {
        var urai = NBImpor.urai(teks);
        var cek = NBImpor.periksaKepala(state.berkas, urai.kolom);
        if (!cek.ok) {
          document.getElementById("iPesan").textContent = T(cek.kunci, cek.vars || {});
          return;
        }
        var p = NBStore.pratinjauImpor(state.berkas, urai.baris, c.cycle_id);
        if (!p.ok) {
          document.getElementById("iPesan").textContent = T(p.kunci, p.vars || {});
          return;
        }
        state.pratinjau = p;
        state.namaBerkas = f.name;
        NBApp.ulang();
      });
    };

    var batal = document.getElementById("iBatal");
    if (batal) batal.onclick = function () { state.pratinjau = null; NBApp.ulang(); };

    var terapkan = document.getElementById("iTerapkan");
    if (terapkan) terapkan.onclick = function () {
      var p = state.pratinjau;
      NBUi.konfirmasi({
        judul: T("imp.terapkanJudul"), pesan: T("imp.terapkanPesan", { n: p.valid, g: p.galat }),
        ok: T("imp.terapkan", { n: p.valid }), batal: T("umum.batal")
      }, function () {
        var res = NBStore.terapkanImpor(state.berkas,
          p.hasil.map(function (h) { return h.baris; }), c.cycle_id);
        state.pratinjau = null;
        NBUi.toast(res.ok ? T("imp.berhasil", { n: res.masuk, g: res.galat.length })
                          : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
        NBApp.ulang();
      });
    };

    var unduhGalat = document.getElementById("iUnduhGalat");
    if (unduhGalat) unduhGalat.onclick = function () {
      var gagal = state.pratinjau.hasil.filter(function (h) { return !h.ok; });
      var kolom = NBImpor.def(state.berkas).kolom.map(function (k) { return { kunci: k.k, label: k.k }; });
      kolom.push({ kunci: "_alasan", label: "alasan_gagal" });
      var baris = gagal.map(function (h) {
        return Object.assign({}, h.baris, { _alasan: T(h.kunci, h.vars) });
      });
      NBReport.unduh("gagal-" + state.berkas.toLowerCase() + ".csv", NBReport.keCsv(kolom, baris));
    };

    var cadangan = document.getElementById("iCadangan");
    if (cadangan) cadangan.onclick = function () {
      var nama = "cadangan-mpp-" + new Date().toISOString().slice(0, 10) + ".json";
      var ok = NBReport.unduh(nama, NBStore.cadangan(), "application/json");
      NBUi.toast(ok ? T("lap.terunduh", { n: nama }) : T("lap.gagalUnduh"), ok ? "ok" : "error");
    };

    var pulih = document.getElementById("iPulih");
    if (pulih) pulih.onchange = function () {
      var f = this.files && this.files[0];
      if (!f) return;
      bacaBerkas(f, function (teks) {
        NBUi.konfirmasi({
          judul: T("imp.pulihkan"), pesan: T("imp.pulihkanPesan"),
          ok: T("imp.pulihkan"), batal: T("umum.batal"), gaya: "nb-btn-soft-danger"
        }, function () {
          var res = NBStore.pulihkanCadangan(teks);
          NBUi.toast(res.ok ? T("imp.pulihBerhasil") : T(res.kunci), res.ok ? "ok" : "error");
          if (res.ok) { state.pratinjau = null; NBApp.ulang(); }
        });
      });
    };
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.data = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/admin.js */
// Layar Administrasi (bab 64 dan 65). Milik OD.
// Isinya sengaja hanya membaca dan satu aksi berat, yaitu penutupan siklus, karena
// perubahan master data yang sesungguhnya seharusnya berasal dari HRIS, bukan diketik di sini.
(function (global) {
  "use strict";

  var T = function (k, v) { return NBi18n.t(k, v); };
  var state = { tab: "pengguna" };

  function tabelPengguna() {
    return "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>" + NBUi.esc(T("adm.thPengguna")) + "</th>" +
      "<th>" + NBUi.esc(T("umum.peranLabel")) + "</th>" +
      "<th>" + NBUi.esc(T("adm.thLingkup")) + "</th>" +
      "<th>" + NBUi.esc(T("adm.thBiaya")) + "</th>" +
      "</tr></thead><tbody>" + NBStore.semuaPengguna().map(function (u) {
        var deps = NBRbac.scopeDepartments(u, NBStore.semuaDepartemen());
        var lihatBiaya = deps.some(function (id) { return NBRbac.canSeeCost(u, id); });
        return "<tr><td><div class='nb-cell-person'>" +
            "<span class='nb-avatar nb-avatar-sm nb-avatar-soft'>" + NBUi.esc(u.name.charAt(0)) + "</span>" +
            "<div><div class='nb-cell-title'>" + NBUi.esc(u.name) + "</div>" +
            "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(u.email) + "</div></div></div></td>" +
          "<td>" + NBUi.badge(NBRbac.roleLabel(u.role), "is-plain") +
            "<div class='nb-cell-sub'>" + NBUi.esc(u.title) + "</div></td>" +
          "<td>" + NBUi.esc(u.scope.type === "ALL"
              ? T("umum.nDept", { n: deps.length })
              : deps.map(function (id) { return (NBStore.departemen(id) || {}).name; }).join(", ")) + "</td>" +
          "<td>" + (lihatBiaya ? NBUi.badge(T("adm.biayaYa"), "is-emerald")
                               : NBUi.badge(T("adm.biayaTidak"), "is-plain")) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function tabelParameter(c) {
    var ctx = NBStore.konteksBiaya(c.cycle_id);
    var paket = NBStore.semuaAsumsi();
    if (!paket.length) return NBUi.kosong(T("biaya.tanpaAsumsi"), T("kosong.asumsi"), NBUi.svg("layers"));
    return "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>" + NBUi.esc(T("adm.thParameter")) + "</th><th>" + NBUi.esc(T("snap.thDirilis")) + "</th>" +
      "<th class='nb-num'>" + NBUi.esc(T("umum.status")) + "</th></tr></thead><tbody>" +
      paket.map(function (a) {
        return "<tr><td><span class='nb-code'>" + NBUi.esc(a.assumption_id) + "</span>" +
          "<div class='nb-cell-sub'>" + NBUi.esc(a.note || "") + "</div></td>" +
          "<td>" + NBUi.esc(NBFormat.tanggal(a.effective_date)) + "</td>" +
          "<td class='nb-num'>" + (a.assumption_id === ctx.assumption_id
            ? NBUi.badge(T("adm.berlaku"), "is-emerald") : "<span class='nb-muted'>-</span>") + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      "<p class='nb-cell-sub' style='padding:16px 20px;margin:0'>" + NBUi.esc(T("adm.paramKet")) + "</p>";
  }

  function tabelPenutupan(c) {
    var j = NBStore.periksaPenutupan(c.cycle_id);
    var m = NBStore.ringkasMonitoring(c.cycle_id);
    var sudahTutup = c.status === "CLOSED";

    var daftar = j.masalah.length
      ? j.masalah.map(function (x) {
          return "<div class='nb-setting' style='margin-bottom:8px'>" +
            NBUi.badge(T(x.blokir ? "adm.blokir" : "adm.catatan"), x.blokir ? "is-red" : "is-amber") +
            "<div style='flex:1'>" + NBUi.esc(T(x.kunci, x.vars)) + "</div></div>";
        }).join("")
      : "<div class='nb-setting'>" + NBUi.badge(T("adm.siap"), "is-emerald") +
        "<div style='flex:1'>" + NBUi.esc(T("adm.siapKet")) + "</div></div>";

    var ringkas = sudahTutup && c.closure_summary
      ? "<div class='nb-kpigrid' style='margin-top:20px'>" +
        NBUi.kpi(T("alok.thKuota"), NBFormat.angka(c.closure_summary.kuota), "layers", "", "") +
        NBUi.kpi(T("mon.thRealisasi"), NBFormat.angka(c.closure_summary.realisasi), "check", "is-emerald", "") +
        NBUi.kpi(T("mon.thUtilisasi"), c.closure_summary.utilisasi + " persen", "chart", "", "") +
        NBUi.kpi(T("mon.thBiayaActual"), NBFormat.rupiahRingkas(c.closure_summary.biaya_actual),
                 "shield", "is-amber", "", true) +
        "</div>"
      : "";

    return "<div style='padding:20px'>" +
      "<div style='font-weight:600;margin-bottom:4px'>" + NBUi.esc(T("adm.tutupJudul", { name: c.name })) + "</div>" +
      "<div class='nb-cell-sub' style='margin-bottom:14px'>" + NBUi.esc(T("adm.tutupSub")) + "</div>" +
      daftar + ringkas +
      (sudahTutup
        ? "<div style='margin-top:16px'>" + NBUi.badge(T("adm.sudahTutup",
            { t: NBFormat.tanggal(c.closed_at) }), "is-emerald") + "</div>"
        : "<div class='nb-formfoot'><button class='nb-btn nb-btn-soft-danger' id='aTutup'" +
          (j.bolehTutup ? "" : " disabled") + ">" + NBUi.esc(T("siklus.aksiTutup")) + "</button></div>") +
    "</div>";
  }

  // Reorganisasi terkendali (F7-3): pindahkan departemen ke divisi lain di entitas yang sama.
  function tabelReorganisasi() {
    var deps = NBStore.semuaDepartemen();
    var divs = NBStore.semuaDivisi();
    var riwayat = NBStore.riwayatReorganisasi();
    return "<div style='padding:20px'>" +
      "<div class='nb-fields'>" +
        "<div><div class='nb-field-label'>" + NBUi.esc(T("umum.departemen")) + "</div>" +
        "<select class='nb-select' id='rgDept'>" + deps.map(function (d) {
          var div = divs.filter(function (x) { return x.division_id === d.division_id; })[0] || {};
          return "<option value='" + d.department_id + "'>" + NBUi.esc(d.name + " (" + (div.name || "-") + ")") + "</option>";
        }).join("") + "</select></div>" +
        "<div><div class='nb-field-label'>" + NBUi.esc(T("reorg.divisiBaru")) + "</div>" +
        "<select class='nb-select' id='rgDiv'>" + divs.map(function (v) {
          var dir = NBStore.direktorat(v.directorate_id) || {};
          return "<option value='" + v.division_id + "'>" + NBUi.esc(v.name + (dir.name ? " \u00b7 " + dir.name : "")) + "</option>";
        }).join("") + "</select></div>" +
      "</div>" +
      "<div class='nb-formfoot'><button class='nb-btn nb-btn-soft-danger' id='rgPindah'>" + NBUi.esc(T("reorg.pindahkan")) + "</button></div>" +
      "<p class='nb-cell-sub'>" + NBUi.esc(T("reorg.ket")) + "</p>" +
      (riwayat.length
        ? "<div class='nb-field-label' style='margin-top:16px'>" + NBUi.esc(T("reorg.riwayat")) + "</div>" +
          riwayat.map(function (r) {
            return "<div class='nb-setting' style='margin-top:8px'>" + NBUi.badge(NBFormat.tanggalPendek(r.timestamp), "is-plain") +
              "<div style='flex:1'>" + NBUi.esc((NBStore.departemen(r.object_id) || {}).name || r.object_id) + ": " +
              NBUi.esc(String(r.old_value)) + " \u2192 " + NBUi.esc(String(r.new_value)) +
              "<div class='nb-cell-sub'>" + NBUi.esc(r.reason || "") + "</div></div></div>";
          }).join("")
        : "") +
    "</div>";
  }

  function tabelPrototipe() {
    return "<div style='padding:20px'>" +
      "<div class='nb-note' style='margin-bottom:16px'>" + NBUi.svg("shield") + "<div>" +
      "<div style='font-weight:600'>" + NBUi.esc(T("adm.protoJudul")) + "</div>" +
      "<div class='nb-cell-sub'>" + NBUi.esc(T("adm.protoIsi")) + "</div></div></div>" +
      "<button class='nb-btn nb-btn-quiet' id='aReset'>" + NBUi.esc(T("siklus.aksiReset")) + "</button>" +
    "</div>";
  }

  function render() {
    var c = NBStore.siklusAktif();
    if (!c) return "<div class='nb-card'>" + NBUi.kosong(T("dash.siklusKosong"), T("dash.siklusKosongSub")) + "</div>";

    var tabs = [["pengguna", "adm.tabPengguna"], ["parameter", "adm.tabParameter"],
                ["reorg", "adm.tabReorg"],
                ["penutupan", "adm.tabPenutupan"], ["prototipe", "adm.tabPrototipe"]];
    var isi = state.tab === "parameter" ? tabelParameter(c)
            : (state.tab === "reorg" ? tabelReorganisasi()
            : (state.tab === "penutupan" ? tabelPenutupan(c)
            : (state.tab === "prototipe" ? tabelPrototipe() : tabelPengguna())));

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("adm.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("adm.sub")) + "</p></div>" +
      "<div style='display:flex;gap:8px'>" +
      NBUi.badge(T("login.build", { b: (global.NB_BUILD || {}).build || 0, t: (global.NB_BUILD || {}).tanggal || "-" }), "is-plain") +
      NBUi.badge(c.name + " " + T({ DRAFT: "siklus.stDraft", OPEN: "siklus.stOpen",
        LOCKED: "siklus.stLocked", CLOSED: "siklus.stClosed" }[c.status] || c.status), "is-plain") + "</div>" +
    "</div>" +

    "<div class='nb-card'>" +
      "<div class='nb-toolbar'><div class='nb-tabs'>" + tabs.map(function (t) {
        return "<button class='nb-tab" + (state.tab === t[0] ? " is-active" : "") +
               "' data-tab='" + t[0] + "'>" + NBUi.esc(T(t[1])) + "</button>";
      }).join("") + "</div></div>" + isi +
    "</div>";
  }

  function mount() {
    document.querySelectorAll("button[data-tab]").forEach(function (b) {
      b.onclick = function () { state.tab = b.dataset.tab; NBApp.ulang(); };
    });

    var tutup = document.getElementById("aTutup");
    if (tutup) tutup.onclick = function () {
      var c = NBStore.siklusAktif();
      NBUi.konfirmasi({
        judul: T("siklus.aksiTutup"), pesan: T("siklus.tutupTanya", { name: c.name }),
        ok: T("siklus.aksiTutup"), batal: T("umum.batal"), gaya: "nb-btn-soft-danger"
      }, function () {
        var res = NBStore.ubahStatusSiklus(c.cycle_id, "CLOSED", null);
        NBUi.toast(res.ok ? T("siklus.statusBerhasil")
                          : (res.kunci ? T(res.kunci, res.vars || {}) : res.alasan), res.ok ? "ok" : "error");
        if (res.ok) NBApp.ulang();
      });
    };

    var pindah = document.getElementById("rgPindah");
    if (pindah) pindah.onclick = function () {
      var dept = document.getElementById("rgDept").value, div = document.getElementById("rgDiv").value;
      NBUi.konfirmasi({
        judul: T("reorg.pindahkan"), pesan: T("reorg.tanya"),
        perluAlasan: true, labelAlasan: T("review.alasanLabel"), pesanAlasan: T("review.errAlasan"),
        ok: T("reorg.pindahkan"), batal: T("umum.batal"), gaya: "nb-btn-soft-danger"
      }, function (alasan) {
        var res = NBStore.pindahkanDepartemen(dept, div, alasan);
        NBUi.toast(res.ok ? T("reorg.berhasil") : T(res.kunci, res.vars || {}), res.ok ? "ok" : "error");
        if (res.ok) NBApp.ulang();
      });
    };
    var reset = document.getElementById("aReset");
    if (reset) reset.onclick = function () {
      NBUi.konfirmasi({
        judul: T("siklus.aksiReset"), pesan: T("siklus.resetTanya"),
        ok: T("siklus.aksiReset"), batal: T("umum.batal"), gaya: "nb-btn-soft-danger"
      }, function () {
        var res = NBStore.reset();
        NBUi.toast(res.ok ? T("siklus.resetBerhasil") : T(res.kunci || "mgmt.errPeran"), res.ok ? "ok" : "error");
        if (res.ok) NBApp.ulang();
      });
    };
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.admin = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/audit.js */
// Layar 11 dari inventaris bab 25. Audit log (BR-08) dan pembeda dengan Revision History (bab 47).
(function (global) {
  "use strict";

  var T = function (k, v) { return NBi18n.t(k, v); };

  function nilai(v) {
    if (v === null || v === undefined) return "<span class='nb-muted'>-</span>";
    if (v === "") return "<span class='nb-muted'>" + NBUi.esc(T("audit.nilaiKosong")) + "</span>";
    return "<span class='nb-mono'>" + NBUi.esc(String(v).slice(0, 60)) + "</span>";
  }

  function render() {
    var u = NBStore.user();
    var data = NBAudit.untuk(u, NBStore.departemenDariAudit);

    var baris = data.map(function (e) {
      var tipe = NBAudit.TIPE[e.event_type] || { label: e.event_type, badge: "" };
      var perubahan = (e.before === null && e.after === null)
        ? "<span class='nb-muted'>-</span>"
        : nilai(e.before) + " <span class='nb-muted'>" + NBUi.esc(T("audit.ke")) + "</span> " + nilai(e.after);

      return "<tr>" +
        "<td class='nb-ts'>" + NBFormat.tanggalPendek(e.timestamp) +
          "<small>" + NBFormat.jam(e.timestamp) + "</small></td>" +
        "<td><span class='nb-actor'>" + NBUi.esc(e.actor_email) + "</span>" +
          "<span class='nb-role'>" + NBUi.esc(T("audit.peran", { r: e.actor_role })) + "</span></td>" +
        "<td>" + NBUi.badge(tipe.label, tipe.badge) + "</td>" +
        "<td>" + NBUi.esc(e.detail_key ? T(e.detail_key, e.detail_vars || {}) : e.detail) +
          (e.reason ? "<div class='nb-cell-sub'>" + NBUi.esc(T("audit.alasan", { r: e.reason })) + "</div>" : "") +
          "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(e.object_type + " " + e.object_id) + "</div></td>" +
        "<td>" + perubahan + "</td>" +
      "</tr>";
    }).join("");

    var isi = data.length
      ? "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
        "<th>" + NBUi.esc(T("audit.waktu")) + "</th>" +
        "<th>" + NBUi.esc(T("audit.aktor")) + "</th>" +
        "<th>" + NBUi.esc(T("audit.aksi")) + "</th>" +
        "<th>" + NBUi.esc(T("audit.rincian")) + "</th>" +
        "<th>" + NBUi.esc(T("audit.nilai")) + "</th>" +
        "</tr></thead><tbody>" + baris + "</tbody></table></div>"
      : NBUi.kosong(T("audit.kosong"), T("audit.kosongSub"));

    return "" +
    "<div class='nb-pagehead'><div>" +
      "<h1>" + NBUi.esc(T("audit.judul")) + "</h1>" +
      "<p>" + NBUi.esc(T("audit.sub")) + "</p>" +
    "</div>" +
      NBUi.badge(T("audit.event", { n: NBFormat.angka(data.length) }), "is-plain") +
    "</div>" +
    "<div class='nb-card'>" + isi + "</div>" +
    "<p class='nb-cell-sub' style='margin-top:12px'>" + NBUi.esc(T("audit.catatan")) + "</p>";
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.audit = { render: render };
})(window);

</script>

<script>
/* js/app.js */
// Shell dan router. Satu halaman, navigasi berbasis hash, tanpa build step.
// Navigasi dirakit dari kapabilitas peran, bukan disembunyikan dengan CSS.
(function (global) {
  "use strict";

  // Layar mengikuti inventaris bab 25. cap null berarti terbuka untuk semua peran yang login.
  var RUTE = [
    { id: "dashboard",   i18n: "nav.dashboard",   cap: null },
    { id: "eksekutif",   i18n: "nav.eksekutif",   cap: "exec.view" },
    { id: "organisasi",  i18n: "nav.organisasi",  cap: null },
    { id: "bagan",       i18n: "nav.bagan",       cap: null },
    { id: "siklus",      i18n: "nav.siklus",      cap: null },
    { id: "planning",    i18n: "nav.planning",    cap: "plan.create" },
    { id: "usulan",      i18n: "nav.usulan",      cap: "plan.review" },
    { id: "konsolidasi", i18n: "nav.konsolidasi", cap: "consolidate" },
    { id: "biaya",       i18n: "nav.biaya",       cap: "cost.view" },
    { id: "review",      i18n: "nav.review",      cap: "review.decide", capAlt: "review.support" },
    { id: "approved",    i18n: "nav.approved",    cap: null },
    { id: "monitoring",  i18n: "nav.monitoring",  cap: null },
    { id: "matriks",     i18n: "nav.matriks",     cap: null },
    { id: "laporan",     i18n: "nav.laporan",     cap: null },
    { id: "audit",       i18n: "nav.audit",       cap: null },
    { id: "data",        i18n: "nav.data",        cap: null },
    { id: "admin",       i18n: "nav.admin",       cap: "admin" }
  ];

  function bolehLihat(u, r) {
    if (!r.cap) return true;
    return NBRbac.can(u, r.cap) || (r.capAlt && NBRbac.can(u, r.capAlt)) ||
           (r.cap === "cost.view" && NBRbac.can(u, "cost.view.own"));
  }

  function rutuSaatIni() {
    var h = (location.hash || "#dashboard").replace("#", "");
    return RUTE.filter(function (r) { return r.id === h; })[0] || RUTE[0];
  }

  function gambarNav() {
    var u = NBStore.user();
    var nav = document.getElementById("nbNav");
    var aktif = rutuSaatIni().id;
    nav.innerHTML = RUTE.filter(function (r) { return bolehLihat(u, r); }).map(function (r) {
      return "<a class='nb-nav-item" + (r.id === aktif ? " is-active" : "") + "' href='#" + r.id + "'>" +
             "<span data-i18n='" + r.i18n + "'>" + NBi18n.t(r.i18n) + "</span></a>";
    }).join("");
  }

  // Penanda siklus aktif di app bar. Semua modul berikutnya bergantung pada siklus ini,
  // jadi statusnya harus terlihat di setiap layar.
  function gambarSiklus() {
    var el = document.getElementById("nbCycle");
    if (!el) return;
    var c = NBStore.siklusAktif();
    if (!c) { el.style.display = "none"; return; }
    var peta = { DRAFT: "is-plain", OPEN: "is-blue", LOCKED: "is-amber", CLOSED: "is-emerald" };
    var kunci = { DRAFT: "siklus.stDraft", OPEN: "siklus.stOpen",
                  LOCKED: "siklus.stLocked", CLOSED: "siklus.stClosed" };
    el.className = "nb-badge " + (peta[c.status] || "");
    el.textContent = c.name + " \u00b7 " + (kunci[c.status] ? NBi18n.t(kunci[c.status]) : c.status);
    el.style.display = "inline-flex";
  }

  // Peringatan sekali jalan kalau penyimpanan sesi menolak menampung data.
  // Diam-diam kehilangan data jauh lebih buruk daripada memberi tahu apa adanya.
  var peringatanTampil = false;
  function gambarPeringatanSimpan() {
    if (peringatanTampil || !global.NBSimpanan || !NBSimpanan.statusSimpan) return;
    var g = NBSimpanan.statusSimpan();
    if (!g) return;
    peringatanTampil = true;
    NBUi.toast(NBi18n.t("umum.simpanGagal",
      { n: Math.round(g.ukuran / 1048576 * 10) / 10 }), "error");
  }

  // Nama entitas di app bar berasal dari berkas struktur, bukan teks tetap.
  function gambarEntitas() {
    var el = document.getElementById("nbEntity");
    if (!el) return;
    var ent = NBStore.semuaEntitas ? NBStore.semuaEntitas() : [];
    if (ent.length === 1) { el.textContent = ent[0].name; el.removeAttribute("data-i18n"); }
    else if (ent.length > 1) { el.textContent = NBi18n.t("umum.nEntitas", { n: ent.length }); el.removeAttribute("data-i18n"); }
  }

  function gambarIdentitas() {
    gambarEntitas();
    var u = NBStore.user();
    var deps = NBStore.departemenTerlihat();
    var lingkup = u.scope.type === "ALL"
      ? NBi18n.t("umum.semua")
      : deps.map(function (d) { return d.name; }).join(", ");
    document.getElementById("nbUser").innerHTML =
      "<div style='text-align:right' title='" + NBUi.esc(u.name + ", " + NBRbac.roleLabel(u.role) + ", " + lingkup) + "'>" +
        "<div style='font-weight:600;font-size:13px'>" + NBUi.esc(u.name) + "</div>" +
        "<div class='nb-cell-sub'>" + NBUi.esc(NBRbac.roleLabel(u.role)) + " &middot; " + NBUi.esc(lingkup) + "</div>" +
      "</div><span class='nb-avatar'>" + NBUi.esc(u.name.charAt(0)) + "</span>";
  }

  function ulang() {
    var u = NBStore.user();
    var chrome = document.getElementById("nbChrome");

    // Belum masuk: shell tetap dipakai, isinya pemilih persona.
    if (!u) {
      if (chrome) chrome.style.display = "none";
      document.getElementById("nbNav").innerHTML = "";
      var hostLogin = document.getElementById("nbPage");
      hostLogin.innerHTML = NBPages.login.render();
      NBPages.login.mount();
      NBi18n.apply(hostLogin);
      return;
    }
    if (chrome) chrome.style.display = "flex";
    var r = rutuSaatIni();

    // Penjagaan rute. Peran yang tidak berhak tidak bisa masuk lewat URL.
    if (!bolehLihat(u, r)) {
      NBAudit.tulis(u, "SCOPE_DENIED", "Screen", r.id, { key: "audit.d.denyScreen" });
      location.hash = "#dashboard";
      NBUi.toast(NBi18n.t("umum.aksesDitolak"), "error");
      ulang();
      return;
    }

    // Aplikasi kosong harus jujur (prinsip 4 fase 3). Selama struktur belum diunggah,
    // layar data menampilkan keadaan kosong yang menyebut berkas apa yang harus diunggah,
    // bukan tabel kosong tanpa keterangan. Impor, administrasi, dan audit tetap terbuka.
    var BEBAS = ["data", "admin", "audit"];
    if (BEBAS.indexOf(r.id) === -1 && NBStore.jumlahData().departemen === 0) {
      gambarNav(); gambarSiklus(); gambarIdentitas();
      document.getElementById("nbPage").innerHTML =
        "<div class='nb-pagehead'><div><h1>" + NBUi.esc(NBi18n.t("kosong.judul")) + "</h1>" +
        "<p>" + NBUi.esc(NBi18n.t("kosong.isi")) + "</p></div>" +
        (NBRbac.can(u, "admin")
          ? "<a class='nb-btn nb-btn-primary' href='#data'>" + NBUi.esc(NBi18n.t("nav.data")) + "</a>"
          : "") + "</div>" +
        "<div class='nb-card nb-card-pad'>" + [1, 2, 3, 4, 5, 6].map(function (n) {
          return "<div class='nb-setting' style='margin-bottom:8px'>" +
            NBUi.badge(String(n), "is-plain") + "<div style='flex:1'>" +
            NBUi.esc(NBi18n.t("kosong.langkah" + n)) + "</div></div>";
        }).join("") + "</div>";
      NBi18n.apply(document.getElementById("nbPage"));
      return;
    }

    // Mata uang mengikuti entitas dalam lingkup. Lebih dari satu entitas: tetap Rupiah,
    // dan kolom nominal per entitas lain menjadi pekerjaan lanjutan yang tercatat di batas.
    var entLingkup = {};
    NBStore.departemenTerlihat().forEach(function (d) {
      var e = NBStore.entitasDepartemen(d.department_id); if (e) entLingkup[e] = true;
    });
    var kodeEnt = Object.keys(entLingkup);
    var ent1 = kodeEnt.length === 1 ? NBStore.semuaEntitas().filter(function (e) { return e.entity_id === kodeEnt[0]; })[0] : null;
    NBFormat.setMataUang(ent1 ? ent1.currency : "IDR");

    var page = (global.NBPages || {})[r.id];
    var host = document.getElementById("nbPage");
    host.innerHTML = page ? page.render() : NBUi.kosong(NBi18n.t("umum.layarTidakAda"), "");
    if (page && page.mount) page.mount();
    NBi18n.apply(host);
    gambarNav();
    gambarSiklus();
    gambarIdentitas();
    gambarPeringatanSimpan();
    window.scrollTo(0, 0);
  }

  function mulai() {
    NBStore.pulihkanSesi();

    document.getElementById("nbLogout").onclick = function () {
      NBStore.keluar();
      location.hash = "#dashboard";
      ulang();
    };
    document.querySelectorAll(".nb-lang button").forEach(function (b) {
      b.onclick = function () {
        document.querySelectorAll(".nb-lang button").forEach(function (x) {
          x.classList.toggle("is-active", x === b);
        });
        NBi18n.set(b.dataset.lang);
        ulang();
      };
    });

    window.addEventListener("hashchange", ulang);
    if (!location.hash) location.hash = "#dashboard";
    NBi18n.apply(document);
    ulang();
  }

  global.NBApp = { mulai: mulai, ulang: ulang };
})(window);

</script>
<script>NBApp.mulai();</script>
</body>
</html>
