<style>
/* assets/nabati-ds.css */
/* ==========================================================================
   NABATI FLK DESIGN SYSTEM v1.0
   Diekstrak langsung dari screenshot aplikasi Pipeline Rekrutmen FLK Online.
   Seluruh nilai warna di bawah adalah hasil sampling piksel, bukan perkiraan.
   Pasangkan dengan nabati-fonts.css (Schibsted Grotesk, Geist, Geist Mono).
   ========================================================================== */

:root {
  /* --- Brand ------------------------------------------------------------ */
  --nb-red-50:   #FDF2F2;   /* isian tombol destruktif lembut */
  --nb-red-100:  #FCEBEA;   /* isian badge nomor seksi, ikon tile merah */
  --nb-red-200:  #F6DAD8;   /* garis tepi elemen aktif bernuansa merah */
  --nb-red-500:  #E1231B;   /* merah identitas Nabati */
  --nb-red-600:  #CF392B;   /* merah solid yang dipakai tombol dan avatar */
  --nb-red-700:  #B12C20;   /* teks aktif, hover tombol solid */
  --nb-rose-600: #CF364C;   /* ikon avatar baris varian rose */

  /* --- Netral ----------------------------------------------------------- */
  --nb-white:    #FFFFFF;
  --nb-gray-25:  #FEFEFF;   /* permukaan tabel */
  --nb-gray-50:  #F9FAFB;   /* panel baris pengaturan */
  --nb-gray-100: #F3F4F6;   /* pemisah baris, ikon tile netral, badge abu */
  --nb-gray-150: #F5F5F7;   /* wadah navigasi pil */
  --nb-gray-200: #E8E9ED;   /* garis tepi kartu */
  --nb-gray-300: #D2D5DB;   /* garis tepi input dan select */
  --nb-gray-400: #9EA3AE;   /* ikon pasif, placeholder */
  --nb-gray-500: #6D727F;   /* teks sekunder, label tabel */
  --nb-gray-700: #394150;   /* teks kuat, timestamp */
  --nb-gray-800: #212936;   /* kode mono, label badge netral */
  --nb-gray-900: #121826;   /* judul dan angka utama */

  /* --- Warna status (badge, chip, tile ikon) ---------------------------- */
  --nb-blue-fg:     #273FA9;  --nb-blue-bg:     #F1F6FE;  --nb-blue-bd:   #C5DAFB;
  --nb-emerald-fg:  #295E48;  --nb-emerald-bg:  #EFFDF6;  --nb-emerald-bd:#B8F1D2;
  --nb-emerald-500: #43946C;  /* titik status aktif */
  --nb-amber-fg:    #88451D;  --nb-amber-bg:    #FFFBED;  --nb-amber-bd:  #F9E796;
  --nb-teal-fg:     #2B5D59;  --nb-teal-bg:     #F3FDFA;  --nb-teal-bd:   #AFF4E5;
  --nb-indigo-fg:   #4139C3;  --nb-indigo-bg:   #F4F4FE;  --nb-indigo-bd: #C9D2FB;
  --nb-violet-bg:   #F9F5FE;  --nb-violet-fg:   #6D3FC4;  --nb-violet-bd: #E4D5FA;
  --nb-slate-fg:    #394150;  --nb-slate-bg:    #F3F4F6;  --nb-slate-bd:  #E6E7EB;
  --nb-checkbox:    #3273F6;  /* accent-color kotak centang */
  --nb-avatar-blue: #3762E3;

  /* --- Latar halaman ---------------------------------------------------- */
  --nb-bg: linear-gradient(147deg,
              #F6E9EB 0%,      /* sudut kiri atas bernuansa mawar */
              #F7F8FA 26%,
              #FEFAFA 52%,     /* kabut merah tipis di sekitar konten */
              #F4F5F7 78%,
              #E8EAEF 100%);   /* sudut bawah lebih dingin */

  /* --- Tipografi -------------------------------------------------------- */
  --nb-font-head: 'Schibsted Grotesk', system-ui, sans-serif;
  --nb-font-body: 'Geist', system-ui, -apple-system, sans-serif;
  --nb-font-mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace;

  --nb-fs-display: 26px;  /* judul halaman */
  --nb-fs-metric:  26px;  /* angka KPI */
  --nb-fs-title:   17px;  /* judul kartu dan modal */
  --nb-fs-body:    14px;  /* teks utama, sel tabel, tombol */
  --nb-fs-sub:     13px;  /* baris kedua, deskripsi */
  --nb-fs-label:   12px;  /* header tabel, badge */
  --nb-fs-micro:   11px;  /* label KPI, peran pada log */

  /* --- Radius ----------------------------------------------------------- */
  --nb-r-sm:   8px;
  --nb-r-md:  10px;   /* tombol, input, select */
  --nb-r-lg:  12px;   /* tile ikon, panel dalam */
  --nb-r-xl:  16px;   /* kartu KPI, kartu tabel */
  --nb-r-2xl: 20px;   /* modal */
  --nb-r-pill: 999px;

  /* --- Elevasi ---------------------------------------------------------- */
  --nb-sh-card:  0 1px 2px rgba(16, 24, 40, .04);
  --nb-sh-raise: 0 1px 3px rgba(16, 24, 40, .08);
  --nb-sh-btn:   0 1px 2px rgba(176, 40, 30, .24);
  --nb-sh-modal: 0 24px 64px rgba(16, 24, 40, .18);

  /* --- Spasi ------------------------------------------------------------ */
  --nb-sp-1: 4px;  --nb-sp-2: 8px;  --nb-sp-3: 12px; --nb-sp-4: 16px;
  --nb-sp-5: 20px; --nb-sp-6: 24px; --nb-sp-8: 32px; --nb-sp-10: 40px;

  --nb-maxw: 1360px;
}

/* ==========================================================================
   DASAR
   ========================================================================== */

* { box-sizing: border-box; }

body.nb-app {
  margin: 0;
  min-height: 100vh;
  background: var(--nb-bg);
  background-attachment: fixed;
  font-family: var(--nb-font-body);
  font-size: var(--nb-fs-body);
  color: var(--nb-gray-900);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, .nb-head { font-family: var(--nb-font-head); letter-spacing: -.02em; }

/* Ikon sebaris selalu punya ukuran dasar. SVG tanpa atribut lebar akan memenuhi lebar
   induknya, dan itu sudah dua kali lolos ke layar. Aturan komponen di bawah menimpanya
   karena letaknya lebih akhir dengan bobot yang sama. */
.nb-app svg { width: 16px; height: 16px; flex: none; }

.nb-container { max-width: var(--nb-maxw); margin: 0 auto; padding: 0 var(--nb-sp-6); }
.nb-mono { font-family: var(--nb-font-mono); font-size: var(--nb-fs-sub); color: var(--nb-gray-800); }
.nb-muted { color: var(--nb-gray-500); }

/* ==========================================================================
   APP BAR
   ========================================================================== */

.nb-appbar {
  display: flex; align-items: center; justify-content: space-between; gap: var(--nb-sp-6);
  padding: 14px var(--nb-sp-6);
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--nb-gray-200);
  position: sticky; top: 0; z-index: 40;
}
.nb-brand { display: flex; align-items: center; gap: var(--nb-sp-3); min-width: 0; }
.nb-brand > div { min-width: 0; }
.nb-brand-name, .nb-brand-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nb-brand img { height: 30px; width: auto; display: block; }
.nb-brand-name { font-family: var(--nb-font-head); font-weight: 700; font-size: 17px; line-height: 1.2; }
.nb-brand-sub  { font-size: var(--nb-fs-sub); color: var(--nb-gray-500); line-height: 1.3; }

/* Varian dua baris. Dipakai saat menu lebih dari enam, karena satu baris memaksa
   nama brand terpotong dan blok identitas terlipat. Varian satu baris tetap ada. */
.nb-appbar.is-stacked { display: block; padding: 12px var(--nb-sp-6); }
.nb-appbar.is-stacked .nb-appbar-row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--nb-sp-4);
}
.nb-appbar.is-stacked .nb-nav {
  margin-top: 10px; width: max-content; max-width: 100%;
  overflow-x: auto; scrollbar-width: none;
}
.nb-appbar.is-stacked .nb-nav::-webkit-scrollbar { display: none; }
.nb-appbar.is-stacked .nb-nav-item { padding: 8px 13px; font-size: var(--nb-fs-sub); }

/* Navigasi pil */
.nb-nav { display: flex; gap: var(--nb-sp-1); padding: 5px; background: var(--nb-gray-150);
          border: 1px solid var(--nb-gray-200); border-radius: var(--nb-r-pill); min-width: 0; }
.nb-nav:empty { display: none; }
.nb-nav-item {
  display: inline-flex; align-items: center; gap: var(--nb-sp-2);
  padding: 8px 16px; border-radius: var(--nb-r-pill);
  font-size: var(--nb-fs-body); font-weight: 500; color: var(--nb-gray-500);
  background: transparent; border: 1px solid transparent; cursor: pointer;
  text-decoration: none; white-space: nowrap; transition: background .15s, color .15s;
}
.nb-nav-item:hover { color: var(--nb-gray-800); background: rgba(255, 255, 255, .6); }
.nb-nav-item.is-active {
  background: var(--nb-white); color: var(--nb-red-700); font-weight: 600;
  border-color: var(--nb-red-200); box-shadow: var(--nb-sh-raise);
}
.nb-nav-item svg { width: 16px; height: 16px; }

/* Chip status koneksi */
.nb-chip {

<script>
/* js/core/simpanan.js */
// Pembungkus penyimpanan sesi. Dipakai hanya untuk simulasi sesi, draft, dan audit prototipe.
// Kalau sessionStorage diblokir (mode privat, iframe terkunci), otomatis jatuh ke memori
// sehingga aplikasi tetap jalan, hanya kehilangan jejak saat berpindah halaman.
//
// Data HR sungguhan tidak boleh disimpan di sini. Lihat peringatan di store.js.
(function (global) {
  "use strict";
  var memo = {};
  var kunciDipakai = ["nb_mpp_user", "nb_mpp_audit"];

  function get(k) {
    try { var v = sessionStorage.getItem(k); return v === null ? (memo[k] || null) : v; }
    catch (e) { return memo[k] || null; }
  }
  var gagalTerakhir = null;

  // Kegagalan penyimpanan tidak boleh ditelan diam-diam. Pada data besar, kuota
  // sessionStorage sekitar 5 MB akan terlampaui, dan tanpa penanda ini pengguna
  // baru sadar datanya hilang setelah berpindah layar.
  function set(k, v) {
    memo[k] = v;

<script>
/* js/core/format.js */
// Format lokal Indonesia. Satu-satunya tempat angka dan tanggal diformat.
// Aturan tetap: Rupiah tanpa desimal, pemisah ribuan titik, bulan bahasa Indonesia.
(function (global) {
  "use strict";

  var BULAN_ID = ["Januari","Februari","Maret","April","Mei","Juni",
                  "Juli","Agustus","September","Oktober","November","Desember"];
  var BULAN_PENDEK_ID = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  var BULAN_EN = ["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];
  var BULAN_PENDEK_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function en() { return global.NBi18n && NBi18n.get() === "en"; }
  function bulanPanjangSet() { return en() ? BULAN_EN : BULAN_ID; }
  function bulanPendekSet() { return en() ? BULAN_PENDEK_EN : BULAN_PENDEK_ID; }

  function angka(n) {
    if (n === null || n === undefined || isNaN(n)) return "-";
    return Math.round(n).toLocaleString("id-ID");
  }

  // Rupiah penuh: Rp27.000.000
  // Mata uang mengikuti entitas yang sedang dilihat (F4-6). Bawaannya Rupiah; layar yang
  // menampilkan entitas lain memanggil setMataUang lebih dulu, lalu mengembalikannya.
  var mataUang = "Rp";
  var LAMBANG = { IDR: "Rp", MYR: "RM", SGD: "S$", PHP: "\u20b1", VND: "\u20ab", THB: "\u0e3f",
                  CNY: "\u00a5", INR: "\u20b9", MMK: "K", KHR: "\u17db", USD: "US$" };
  function setMataUang(kode) { mataUang = LAMBANG[kode] || (kode ? kode + " " : "Rp"); }
  function lambangMataUang(kode) { return LAMBANG[kode] || kode || "Rp"; }

  // Nominal dengan mata uang eksplisit, untuk baris yang mata uangnya berbeda dari lingkup.
  function uang(n, kode) {
    if (n === null || n === undefined || isNaN(n)) return "-";
    var l = lambangMataUang(kode || "IDR");
    return (n < 0 ? "-" + l : l) + angka(Math.abs(n));
  }

  function rupiah(n) {
    if (n === null || n === undefined || isNaN(n)) return "-";
    return (n < 0 ? "-" + mataUang : mataUang) + angka(Math.abs(n));
  }

  // Rupiah ringkas untuk kartu KPI: Rp27,0 jt / Rp1,2 M
  function rupiahRingkas(n) {
    if (n === null || n === undefined || isNaN(n)) return "-";
    var abs = Math.abs(n), tanda = n < 0 ? "-" + mataUang : mataUang;
    if (abs >= 1e9) return tanda + (abs / 1e9).toFixed(1).replace(".", ",") + " M";
    if (abs >= 1e6) return tanda + (abs / 1e6).toFixed(1).replace(".", ",") + " jt";
    return rupiah(n);
  }

  function delta(n) {
    if (!n) return "0";
    return (n > 0 ? "+" : "") + angka(n);
  }

  // "2026-08-30" menjadi "30 Agustus 2026"
  function tanggal(iso) {
    if (!iso) return "-";
    var d = new Date(iso);
    if (isNaN(d)) return "-";
    return d.getDate() + " " + bulanPanjangSet()[d.getMonth()] + " " + d.getFullYear();
  }

  // "2026-08-30" menjadi "30 Agu 2026"
  function tanggalPendek(iso) {
    if (!iso) return "-";
    var d = new Date(iso);
    if (isNaN(d)) return "-";
    return d.getDate() + " " + bulanPendekSet()[d.getMonth()] + " " + d.getFullYear();
  }

  // Jam gaya log aplikasi: 13.35.37 WIB
  function jam(iso) {
    var d = iso ? new Date(iso) : new Date();
    var p = function (x) { return String(x).padStart(2, "0"); };
    return p(d.getHours()) + "." + p(d.getMinutes()) + "." + p(d.getSeconds()) + " WIB";
  }

  // Bulan efektif 1 sampai 12 (BR-01). Bulan 6 berarti berlaku Juni.
  function bulanNama(n) { return bulanPanjangSet()[n - 1] || "-"; }
  function bulanPendek(n) { return bulanPendekSet()[n - 1] || "-"; }

  // Jumlah bulan biaya yang berlaku dalam satu tahun siklus (BR-E).
  // Efektif Juni berarti 7 bulan, bukan 12. Dipakai penuh di Modul 5.
  function bulanBerlaku(bulanEfektif) {
    var m = Number(bulanEfektif);
    if (!m || m < 1 || m > 12) return 0;
    return 13 - m;
  }

  global.NBFormat = {
    setMataUang: setMataUang, lambangMataUang: lambangMataUang, uang: uang,
    angka: angka, rupiah: rupiah, rupiahRingkas: rupiahRingkas, delta: delta,
    tanggal: tanggal, tanggalPendek: tanggalPendek, jam: jam,
    bulanNama: bulanNama, bulanPendek: bulanPendek, bulanBerlaku: bulanBerlaku,
    bulanPanjangSet: bulanPanjangSet, bulanPendekSet: bulanPendekSet
  };
})(window);

</script>

  var lang = "id";

  function t(key, vars) {
    var pack = DICT[lang] || DICT.id;
    var teks = pack[key] !== undefined ? pack[key] : key;
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        teks = teks.split("{" + k + "}").join(String(vars[k]));
      });
    }
    return teks;
  }

  function set(next) {
    if (!DICT[next]) return;
    lang = next;
    document.documentElement.lang = next;
    apply(document);
    document.dispatchEvent(new CustomEvent("nb:lang", { detail: { lang: lang } }));
  }

  function get() { return lang; }

  function apply(root) {
    (root || document).querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    (root || document).querySelectorAll("[data-i18n-ph]").forEach(function (el) {
      el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph")));
    });
    (root || document).querySelectorAll("[data-i18n-title]").forEach(function (el) {
      el.setAttribute("title", t(el.getAttribute("data-i18n-title")));
    });
  }

  // Daftar kunci yang hilang, dipakai saat pemeriksaan mutu.
  function periksa() {
    var kurang = { id: [], en: [] };
    var semua = {};
    Object.keys(DICT).forEach(function (l) {
      Object.keys(DICT[l]).forEach(function (k) { semua[k] = 1; });
    });
    Object.keys(semua).forEach(function (k) {
      Object.keys(DICT).forEach(function (l) {
        if (DICT[l][k] === undefined) kurang[l].push(k);
      });
    });
    return kurang;
  }

  global.NBi18n = { t: t, set: set, get: get, apply: apply, periksa: periksa };
})(window);

</script>
<script>
/* js/core/ui.js */
// Helper tampilan kecil. Komponen visual mengikuti Nabati FLK Design System (assets/nabati-ds.css).
// Tidak ada warna atau ukuran yang ditulis ulang di sini.
(function (global) {
  "use strict";

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

    return '<span class="nb-badge ' + (varian || "") + '">' + esc(teks) + "</span>";
  }

  // Keadaan kosong yang jujur. Tidak pernah menampilkan angka tebakan (prinsip 5).
  function kosong(judul, pesan, ikon) {
    return '<div class="nb-empty"><span class="nb-tile">' + (ikon || svg("info")) + "</span>" +
           "<h4>" + esc(judul) + "</h4><p>" + esc(pesan) + "</p></div>";
  }

  var IKON = {
    users: '<circle cx="9" cy="7" r="4"/><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M19 8v6M22 11h-6"/>',
    building: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M9 16h6"/>',

    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
    save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    lock: '<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
    logout: '<path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/>'
  };

  function svg(nama, kelas) {
    return '<svg class="' + (kelas || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
           'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (IKON[nama] || IKON.info) + "</svg>";
  }

  function kpi(label, nilai, ikon, varianTile, catatan, uang) {
    return '<div class="nb-kpi"><div><div class="nb-kpi-label">' + esc(label) + "</div>" +
           '<div class="nb-kpi-value' + (uang ? " is-money" : "") + '">' + nilai + "</div>" +
           (catatan ? '<div class="nb-cell-sub">' + esc(catatan) + "</div>" : "") +
           '</div><span class="nb-tile ' + (varianTile || "") + '">' + svg(ikon) + "</span></div>";
  }

  var toastTimer = null;
  function toast(pesan, jenis) {
    var box = document.getElementById("nbToast");
    if (!box) return;
    box.className = "nb-badge " + (jenis === "error" ? "is-red" : "is-emerald");
    box.textContent = pesan;
    box.style.display = "inline-flex";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.style.display = "none"; }, 3200);
  }

  // Dialog konfirmasi mengikuti design system. Menggantikan confirm dan prompt bawaan
  // browser, yang tidak bisa didesain, tidak bilingual, dan diblokir di sebagian konteks.
  // Memanggil balik lewat callback, bukan Promise, supaya tetap jalan tanpa build step.
  function konfirmasi(opsi, selesai) {
    var o = opsi || {};
    var host = document.createElement("div");
    host.innerHTML =
      '<div class="nb-overlay" id="nbConfirm"><div class="nb-modal" style="max-width:520px">' +
        '<div class="nb-modal-head"><div><div class="nb-modal-title">' +
          "<h2>" + esc(o.judul || "") + "</h2></div></div>" +
          '<button class="nb-iconbtn" data-batal="1">&times;</button></div>' +
        '<div class="nb-modal-body"><div class="nb-section" style="margin-bottom:0">' +
          "<p style='margin:0 0 " + (o.perluAlasan ? "14px" : "0") + "'>" + esc(o.pesan || "") + "</p>" +
          (o.perluAlasan
            ? "<div class='nb-field-label'>" + esc(o.labelAlasan || "") + "</div>" +
              "<textarea class='nb-input' id='nbConfirmAlasan' rows='3' style='resize:vertical' " +
              "placeholder='" + esc(o.placeholder || "") + "'></textarea>" +
              "<div id='nbConfirmGalat' class='nb-cell-sub' style='color:var(--nb-red-700);margin-top:6px'></div>"
            : "") +
        "</div></div>" +
        '<div class="nb-modal-foot"><button class="nb-btn nb-btn-quiet" data-batal="1">' +
          esc(o.batal || "Batal") + "</button>" +
        '<div class="nb-group"><button class="nb-btn ' + (o.gaya || "nb-btn-primary") + '" id="nbConfirmOk">' +
          esc(o.ok || "Lanjut") + "</button></div></div>" +
      "</div></div>";
    document.body.appendChild(host.firstChild);

    var modal = document.getElementById("nbConfirm");
    function tutup() { modal.remove(); }
    modal.querySelectorAll("[data-batal]").forEach(function (b) { b.onclick = tutup; });
    modal.onclick = function (e) { if (e.target === modal) tutup(); };

    document.getElementById("nbConfirmOk").onclick = function () {
      var alasan = null;
      if (o.perluAlasan) {
        var el = document.getElementById("nbConfirmAlasan");
        alasan = (el.value || "").trim();
        if (alasan.length < (o.minAlasan || 10)) {
          document.getElementById("nbConfirmGalat").textContent = o.pesanAlasan || "";
          return;
        }
      }
      tutup();
      if (selesai) selesai(alasan);
    };
  }

  global.NBUi = { esc: esc, badge: badge, kosong: kosong, svg: svg, kpi: kpi,
                  toast: toast, konfirmasi: konfirmasi };
})(window);

</script>
<script>
/* js/core/rbac.js */
// Kendali akses tiga sumbu: kapabilitas (RBAC), baris (row level), kolom biaya (column level).
// Referensi: bab 23. Prinsip yang tidak boleh dilanggar nomor 2 dan 3.
// Sumbu kolom biaya tidak tertulis di dokumen. Saya tambahkan karena tanpa itu,
// MPP Monitor dan HOD lintas departemen akan melihat nominal yang bukan haknya.
(function (global) {
  "use strict";

  // Kapabilitas diturunkan langsung dari matriks bab 23.
  var CAPS = {
    OD: ["exec.view", "cycle.create", "snapshot.upload", "view.own", "view.all", "plan.create", "plan.submit",
         "plan.review", "consolidate", "cost.view", "approved.distribute", "monitor.all",
         "audit.all", "admin", "dept.note.edit", "master.employee.edit", "actual.record", "actual.approve",
         "cycle.manage", "snapshot.view"],
    HOD: ["view.own", "plan.create", "plan.submit", "plan.review.own", "cost.view.own",
          "monitor.own", "audit.own", "dept.note.edit"],
    CB: ["exec.view", "view.all", "cost.assumption", "cost.import", "cost.calculate", "cost.view", "review.support",
         "monitor.cost", "audit.relevant"],
    MANAGEMENT: ["exec.view", "view.all", "cost.view", "review.decide", "approve", "adjust.approved",
                 "monitor.company", "audit.relevant"],
    MONITOR: ["view.all", "monitor.all", "audit.all", "actual.record"],
    // Manajer 5A ke atas menyusun baris untuk timnya, tetapi tidak mengirim dan tidak
    // melihat nominal (K4 nomor 3 dan 5). Diturunkan otomatis dari pohon, bukan dari berkas.
    MANAGER: ["view.own", "plan.create", "audit.own"],
    // HC Business Partner per entitas: seperti OD tetapi dibatasi entitasnya, tanpa admin.
    HCBP: ["exec.view", "view.own", "plan.create", "plan.submit", "plan.review", "cost.view",
           "monitor.all", "audit.own", "actual.record", "actual.approve", "master.employee.edit", "snapshot.view"],
    // Akun bawaan satu-satunya di aplikasi kosong. Hanya boleh mengunggah struktur dan
    // pengguna, supaya ada jalan masuk pertama tanpa membuka segalanya (K7).
    ADMIN: ["view.all", "admin", "audit.all", "master.employee.edit"]
  };

  var ROLE_LABEL = {
    OD: "Organization Development", HOD: "Head of Department",
    CB: "Compensation & Benefit", MANAGEMENT: "Management", MONITOR: "MPP Monitor",
    MANAGER: "Manager", ADMIN: "Administrator", HCBP: "HC Business Partner"
  };

  function can(user, cap) {
    if (!user) return false;
    return (CAPS[user.role] || []).indexOf(cap) !== -1;
  }

  // Daftar department_id yang boleh dilihat pengguna. Ini satu-satunya sumber
  // kebenaran untuk penyaringan baris. Layar tidak boleh menyaring sendiri.
  function scopeDepartments(user, allDepartments) {
    if (!user) return [];
    if (user.scope.type === "ALL") return allDepartments.map(function (d) { return d.department_id; });
    if (user.scope.type === "DEPARTMENT") return user.scope.ids.slice();
    // Lingkup pohon: departemen tempat karyawan yang dijadikan jangkar berada (K4 nomor 1).
    if (user.scope.type === "TREE") return user.scope.department_id ? [user.scope.department_id] : [];
    // Lingkup entitas: seluruh departemen di bawah entitas yang disebut (HC Business Partner per negara).
    if (user.scope.type === "ENTITY") {
      var ids = user.scope.ids || [];
      return allDepartments.filter(function (d) { return ids.indexOf(d.entity_id) !== -1; })
                           .map(function (d) { return d.department_id; });
    }
    if (user.scope.type === "DIVISION") {
      return allDepartments.filter(function (d) { return user.scope.ids.indexOf(d.division_id) !== -1; })
                           .map(function (d) { return d.department_id; });
    }
    return [];
  }

  function inScope(user, allDepartments, departmentId) {
    return scopeDepartments(user, allDepartments).indexOf(departmentId) !== -1;
  }

  // Penyaring baris generik. Dipakai setiap kali data menyentuh layar.
  function filterRows(user, allDepartments, rows, key) {
    var izin = scopeDepartments(user, allDepartments);
    var k = key || "department_id";
    return rows.filter(function (r) { return izin.indexOf(r[k]) !== -1; });
  }

  // Penyaring tingkat orang. Untuk lingkup pohon, hanya diri sendiri dan bawahan berjenjang
  // di dalam departemen yang terlihat (K4 nomor 1 dan 2). Lingkup lain memakai departemen.
  function filterEmployees(user, allDepartments, employees, pohon) {
    var rows = filterRows(user, allDepartments, employees, "department_id");
    if (!user || user.scope.type !== "TREE" || !pohon) return rows;
    var izin = {};
    izin[user.scope.employee_id] = true;
    NBOrganisasi.bawahan(user.scope.employee_id, pohon, user.scope.department_id)
      .forEach(function (id) { izin[id] = true; });
    return rows.filter(function (e) { return izin[e.employee_id]; });
  }

  function employeeInScope(user, allDepartments, employeeId, pohon) {
    if (!user) return false;
    if (user.scope.type !== "TREE") return true;
    if (employeeId === user.scope.employee_id) return true;
    return NBOrganisasi.bawahan(user.scope.employee_id, pohon, user.scope.department_id)
      .indexOf(employeeId) !== -1;
  }

  // Kolom biaya. MPP Monitor tidak pernah melihat nominal.
  // HOD hanya melihat nominal departemennya sendiri.
  function canSeeCost(user, departmentId) {
    if (!user) return false;
    if (user.role === "MONITOR") return false;
    if (user.role === "MANAGER") return false;
    // HC Business Partner berlingkup entitas melihat nominal entitasnya sendiri.
    if (user.role === "HCBP") {
      if (!departmentId) return true;
      var semuaDept = global.NBRbac && global.NBRbac.daftarDepartemen ? global.NBRbac.daftarDepartemen() : [];
      return inScope(user, semuaDept, departmentId);
    }
    if (user.role === "HOD") {
      if (!departmentId) return false;
      if (user.scope.type === "TREE") return user.scope.department_id === departmentId;
      return user.scope.ids.indexOf(departmentId) !== -1;
    }
    return can(user, "cost.view");
  }

  global.NBRbac = {
    can: can, scopeDepartments: scopeDepartments, inScope: inScope,
    filterRows: filterRows, canSeeCost: canSeeCost,
    filterEmployees: filterEmployees, employeeInScope: employeeInScope,
    roleLabel: function (r) { return ROLE_LABEL[r] || r; },
    caps: CAPS
  };
})(window);

</script>
<script>

// Audit log. Append only, tidak pernah diubah dan tidak pernah dihapus (BR-08).
// Perbedaan dengan Revision History (bab 47): audit mencatat siapa melakukan apa,
// revision mencatat data bergerak dari nilai apa ke nilai apa. Revision History
// dibangun di Modul 6 saat versioning masuk. Modul 0 sudah menyiapkan kolom before/after
// supaya tidak ada jalur perubahan data yang lolos tanpa jejak.
(function (global) {

      if (mentah) { log = JSON.parse(mentah); seq = log.length; }

  })();

  function simpan() {
    if (!global.NBSimpanan) return;

  var TIPE = {

    "MGMT_RETURN":    { label: "Mgmt Return",   badge: "is-amber" },
    "CONSOLIDATE":    { label: "Consolidate",   badge: "is-teal" },
    "PLAN_SUBMIT":    { label: "Plan Submit",   badge: "is-blue" },
    "PLAN_ACCEPT":    { label: "Plan Accept",   badge: "is-emerald" },
    "PLAN_RETURN":    { label: "Plan Return",   badge: "is-amber" },
    "ALLOC_DISTRIBUTE": { label: "Allocation",  badge: "is-violet" },
    "ACTUAL_RECORD":    { label: "Actual",      badge: "is-emerald" },
    "ACTUAL_CANCEL":    { label: "Actual Cancel", badge: "is-plain" },
    "ACTUAL_BLOCKED":   { label: "Actual Blocked", badge: "is-red" },
    "ACTUAL_EXCEPTION": { label: "Exception",   badge: "is-amber" },
    "EXCEPTION_DECISION": { label: "Exc Decision", badge: "is-indigo" },
    "REPORT_EXPORT":  { label: "Report Export", badge: "is-teal" },
    "ACTUAL_APPROVE": { label: "Actual Approved", badge: "is-emerald" },
    "REORG":          { label: "Reorganisasi", badge: "is-violet" },
    "ACTUAL_REJECT":  { label: "Actual Rejected", badge: "is-red" },
    "DATA_IMPORT":    { label: "Data Import", badge: "is-violet" },
    "DATA_RESTORE":   { label: "Data Restore", badge: "is-red" }
  };

  // detail boleh berupa string, atau objek { key, vars, reason } supaya pesan log
  // bisa ditampilkan dalam bahasa apa pun tanpa menerjemahkan ulang isi log lama.
  function tulis(actor, tipe, objectType, objectId, detail, before, after) {
    var key = null, vars = null, reason = null, teks = detail;
    if (detail && typeof detail === "object") {
      key = detail.key; vars = detail.vars || null; reason = detail.reason || null;
      teks = detail.key;
    }
    seq += 1;
    var entri = {
      audit_id: "AUD-" + String(seq).padStart(5, "0"),
      timestamp: new Date().toISOString(),
      actor_id: actor ? actor.user_id : "-",
      actor_email: actor ? actor.email : "-",
      actor_role: actor ? actor.role : "-",
      event_type: tipe,
      object_type: objectType || "-",
      object_id: objectId || "-",
      detail: teks || "",
      detail_key: key,
      detail_vars: vars,
      reason: reason,
      before: before === undefined ? null : before,
      after: after === undefined ? null : after,
      // Prototipe tidak punya IP nyata. Ditandai jelas supaya tidak dikira data riil.
      source: "prototipe-lokal"
    };
    log.push(entri);
    simpan();
    document.dispatchEvent(new CustomEvent("nb:audit", { detail: entri }));
    return entri;
  }

  // Temuan uji keamanan: slice hanya menyalin daftarnya, entrinya tetap objek yang sama,
  // sehingga isi audit bisa diubah lewat hasil pembacaan. Audit bersifat append only,
  // jadi yang keluar harus salinan dalam.
  function semua() {
    try { return JSON.parse(JSON.stringify(log)).reverse(); }
    catch (e) { return log.slice().reverse(); }
  }

  // Penyaringan audit mengikuti lingkup pengguna (bab 23: HOD hanya "own relevant").
  function untuk(user, departmentResolver) {
    if (!user) return [];
    if (user.role === "HOD" || user.role === "MANAGER") {
      // Lingkup pohon menyimpan satu departemen, lingkup lama menyimpan daftar.
      var izin = user.scope.type === "TREE"
        ? [user.scope.department_id] : (user.scope.ids || []);
      return semua().filter(function (e) {
        if (e.actor_id === user.user_id) return true;
        var dep = departmentResolver ? departmentResolver(e) : null;
        return dep && izin.indexOf(dep) !== -1;
      });
    }
    return semua();
  }

  function reset() {
    log = []; seq = 0;
    if (global.NBSimpanan) NBSimpanan.hapus(KUNCI);
  }

  global.NBAudit = { tulis: tulis, semua: semua, untuk: untuk, reset: reset, TIPE: TIPE };
})(window);

</script>
<script>
/* js/domain/organisasi.js */
// Pohon organisasi dari kolom atasan langsung. Murni, tanpa DOM, tanpa penyimpanan.
//
// Keputusan yang dipegang di sini:
// 1. Lingkup manajer adalah pohon atasan langsung di dalam departemennya sendiri (K4 nomor 1).
// 2. Manajer diturunkan otomatis: grade 5A ke atas yang punya bawahan (nomor 6).
// 3. HOD diturunkan otomatis: orang di departemen itu yang atasannya berada di luar
//    departemen, atau tidak punya atasan sama sekali.
// 4. Pelaporan melingkar ditolak sebelum masuk data, karena pohon tidak bisa digambar dan
//    lingkup tidak bisa dihitung dari data yang berputar (K8).
(function (global) {
  "use strict";

  var LEVEL_MANAJER = 13;   // grade 5A

  function petaKaryawan(employees) {
    var peta = {};
    employees.forEach(function (e) { peta[e.employee_id] = e; });
    return peta;
  }

  // Peta anak per atasan. Karyawan tanpa atasan yang sah masuk ke daftar puncak.
  function bangunPohon(employees) {
    var anak = {}, puncak = [];
    var peta = petaKaryawan(employees);
    employees.forEach(function (e) {
      var atas = e.direct_report_id;
      if (atas && peta[atas] && atas !== e.employee_id) {
        (anak[atas] = anak[atas] || []).push(e.employee_id);
      } else {
        puncak.push(e.employee_id);
      }
    });
    return { anak: anak, puncak: puncak, peta: peta };
  }

  // Seluruh bawahan berjenjang. batasDept membatasi pohon di dalam satu departemen.
  function bawahan(employeeId, pohon, batasDept) {
    var hasil = [], antre = (pohon.anak[employeeId] || []).slice(), sudah = {};
    while (antre.length) {
      var id = antre.shift();
      if (sudah[id]) continue;
      sudah[id] = true;
      var e = pohon.peta[id];
      if (!e) continue;
      if (batasDept && e.department_id !== batasDept) continue;
      hasil.push(id);
      (pohon.anak[id] || []).forEach(function (c) { antre.push(c); });
    }
    return hasil;
  }

  // Mendeteksi lingkaran pelaporan. Mengembalikan daftar lingkaran, tiap lingkaran daftar id.
  function deteksiSiklus(employees) {
    var peta = petaKaryawan(employees);
    var warna = {}, lingkaran = [];
    employees.forEach(function (mulai) {
      if (warna[mulai.employee_id]) return;
      var jejak = [], id = mulai.employee_id;
      while (id && peta[id] && !warna[id]) {
        warna[id] = "abu";
        jejak.push(id);
        id = peta[id].direct_report_id;
      }
      if (id && warna[id] === "abu") {
        lingkaran.push(jejak.slice(jejak.indexOf(id)));
      }
      jejak.forEach(function (j) { warna[j] = "hitam"; });
    });
    return lingkaran;
  }

  // Atasan yang ditunjuk tetapi tidak ada di data.
  function atasanHilang(employees) {
    var peta = petaKaryawan(employees);
    return employees.filter(function (e) {
      return e.direct_report_id && !peta[e.direct_report_id];
    }).map(function (e) { return { employee_id: e.employee_id, direct_report_id: e.direct_report_id }; });
  }

  // HOD sebuah departemen: orang di dalamnya yang atasannya di luar departemen atau kosong.
  // Bila lebih dari satu, dipilih yang gradenya tertinggi.
  function hodDepartemen(departmentId, employees, levelGrade) {
    var peta = petaKaryawan(employees);
    var calon = employees.filter(function (e) {
      if (e.department_id !== departmentId) return false;
      var atas = e.direct_report_id ? peta[e.direct_report_id] : null;
      return !atas || atas.department_id !== departmentId;
    });
    calon.sort(function (a, b) { return levelGrade(b.grade_id) - levelGrade(a.grade_id); });
    return calon[0] || null;
  }

  // Manajer otomatis: grade 5A ke atas yang punya bawahan langsung.
  function manajerOtomatis(employees, levelGrade) {
    var pohon = bangunPohon(employees);
    return employees.filter(function (e) {
      return levelGrade(e.grade_id) >= LEVEL_MANAJER && (pohon.anak[e.employee_id] || []).length > 0;
    });
  }

  // Tingkat awal yang ditampilkan di bagan: dilipat sampai manajer 5A (K4 nomor 2).
  function bolehDilipat(e, levelGrade) {
    return levelGrade(e.grade_id) >= LEVEL_MANAJER;
  }

  global.NBOrganisasi = {
    LEVEL_MANAJER: LEVEL_MANAJER,
    bangunPohon: bangunPohon, bawahan: bawahan, deteksiSiklus: deteksiSiklus,
    atasanHilang: atasanHilang, hodDepartemen: hodDepartemen,
    manajerOtomatis: manajerOtomatis, bolehDilipat: bolehDilipat
  };
})(window);

</script>
<script>
/* js/domain/bagan.js */
// Bagan organisasi. Fungsi murni: menyusun pohon menjadi koordinat, lalu menggambar SVG
// sebagai string. Tidak menyentuh DOM, jadi bisa diuji tanpa peramban.
//
// Keputusan yang dipegang (masukan Dzuhri nomor 3, dan K5, K6):
// 1. Satu kotak satu orang. Posisi yang diisi banyak orang digambar sebanyak orangnya.
// 2. Tampilan awal dilipat di tingkat manajer 5A; simpul dibuka per klik.
// 3. Vacancy terbuka dan alokasi yang disetujui tetapi belum terisi digambar garis putus,
//    supaya bagan berguna untuk MPP dan bukan sekadar direktori.
// 4. Batas keras 400 kotak per tampilan; lebihnya dilipat otomatis dengan hitungan.
(function (global) {
  "use strict";

  var LEBAR = 172, TINGGI = 64, JARAK_X = 16, JARAK_Y = 56, BATAS_KOTAK = 400;

  // Menyusun daftar simpul yang tampak, mengikuti simpul yang dibuka.
  // dibuka: peta employee_id -> true. bolehDilipat: fungsi(karyawan) -> boolean.
  function simpulTampak(akarId, pohon, dibuka, opsi) {
    var o = opsi || {};
    var hasil = [], jumlah = 0;
    var akar = pohon.peta[akarId];
    if (!akar) return { simpul: [], terpotong: false };

    function jelajah(id, kedalaman, induk) {
      var e = pohon.peta[id];
      if (!e) return;
      var anak = (pohon.anak[id] || []).slice();
      if (o.batasDept) anak = anak.filter(function (c) { return pohon.peta[c] && pohon.peta[c].department_id === o.batasDept; });
      var tambahan = o.tambahan ? (o.tambahan[id] || []) : [];
      var totalBawah = anak.length + tambahan.length;
      // Simpul manajer 5A ke atas dilipat sampai dibuka, kecuali akarnya sendiri.
      var lipat = kedalaman > 0 && o.bolehDilipat && o.bolehDilipat(e) && !dibuka[id];
      // Kedalaman awal: dua tingkat di bawah akar dibuka, selebihnya menunggu klik.
      if (kedalaman >= (o.kedalamanAwal || 2) && !dibuka[id]) lipat = totalBawah > 0;
      var simpul = { id: id, e: e, induk: induk, kedalaman: kedalaman, anak: [],
                     jumlahBawahan: totalBawah, terlipat: lipat && totalBawah > 0, jenis: "orang" };
      hasil.push(simpul); jumlah += 1;
      if (jumlah > BATAS_KOTAK) { simpul.terlipat = totalBawah > 0; return simpul; }
      if (!simpul.terlipat) {
        anak.forEach(function (c) {
          // Batas keras: anak yang tidak muat dilipat ke induknya dengan hitungan.
          if (jumlah >= BATAS_KOTAK) { simpul.terlipat = true; simpul.terpotong = true; return; }
          var s = jelajah(c, kedalaman + 1, simpul); if (s) simpul.anak.push(s);
        });
        tambahan.forEach(function (t, i) {
          var st = { id: id + "|" + t.jenis + "|" + i, e: null, tambahan: t, induk: simpul,
                     kedalaman: kedalaman + 1, anak: [], jumlahBawahan: 0, terlipat: false, jenis: t.jenis };
          hasil.push(st); jumlah += 1; simpul.anak.push(st);
        });
      }
      return simpul;
    }
    var akarSimpul = jelajah(akarId, 0, null);
    return { simpul: hasil, akar: akarSimpul, terpotong: hasil.some(function (n) { return n.terpotong; }) || jumlah > BATAS_KOTAK };
  }

  // Tata letak pohon sederhana: lebar subtree dihitung dari bawah, anak diratakan di
  // bawah induknya. Cukup untuk dua sampai tiga tingkat yang ditampilkan sekaligus.
  function tataLetak(akar) {
    function lebarSub(n) {
      if (!n.anak.length) { n.lebarSub = LEBAR; return n.lebarSub; }
      var total = 0;
      n.anak.forEach(function (c) { total += lebarSub(c); });
      total += JARAK_X * (n.anak.length - 1);
      n.lebarSub = Math.max(LEBAR, total);
      return n.lebarSub;
    }
    function tempatkan(n, x, y) {
      n.x = x + (n.lebarSub - LEBAR) / 2; n.y = y;
      var kursor = x;
      // Bila anak lebih sempit dari induk, geser supaya rata tengah.
      var lebarAnak = n.anak.reduce(function (t, c) { return t + c.lebarSub; }, 0) + JARAK_X * Math.max(0, n.anak.length - 1);
      kursor += (n.lebarSub - lebarAnak) / 2;
      n.anak.forEach(function (c) { tempatkan(c, kursor, y + TINGGI + JARAK_Y); kursor += c.lebarSub + JARAK_X; });
    }
    lebarSub(akar); tempatkan(akar, 0, 0);
    var maxY = 0, maxX = 0;
    (function jalan(n) { maxY = Math.max(maxY, n.y + TINGGI); maxX = Math.max(maxX, n.x + LEBAR); n.anak.forEach(jalan); })(akar);
    return { lebar: maxX, tinggi: maxY };
  }

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function potong(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "\u2026" : s; }

  // Menggambar SVG. label: fungsi(karyawan) -> {judul, sub, grade}.
  function gambar(tata, opsi) {
    var o = opsi || {};
    var pad = 24;
    var w = tata.ukuran.lebar + pad * 2, h = tata.ukuran.tinggi + pad * 2;
    var out = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h +
               '" width="' + w + '" height="' + h + '" class="nb-bagan" font-family="Geist, system-ui, sans-serif">'];
    // Garis penghubung dulu, supaya berada di bawah kotak.
    tata.simpul.forEach(function (n) {
      if (!n.induk) return;
      var x1 = n.induk.x + LEBAR / 2 + pad, y1 = n.induk.y + TINGGI + pad;
      var x2 = n.x + LEBAR / 2 + pad, y2 = n.y + pad;
      var ym = y1 + JARAK_Y / 2;
      out.push('<path d="M' + x1 + ' ' + y1 + ' V' + ym + ' H' + x2 + ' V' + y2 +
               '" fill="none" stroke="#D2D5DB" stroke-width="1.5"/>');
    });
    tata.simpul.forEach(function (n) {
      var x = n.x + pad, y = n.y + pad;
      if (n.jenis === "orang") {
        var l = o.label(n.e);
        out.push('<g class="nb-bagan-simpul" data-id="' + esc(n.id) + '" style="cursor:' +
                 (n.jumlahBawahan ? 'pointer' : 'default') + '">');
        out.push('<rect x="' + x + '" y="' + y + '" width="' + LEBAR + '" height="' + TINGGI +
                 '" rx="10" fill="#FFFFFF" stroke="' + (n.kedalaman === 0 ? '#CF392B' : '#E8E9ED') + '" stroke-width="1.5"/>');
        out.push('<text x="' + (x + 12) + '" y="' + (y + 22) + '" font-size="12" font-weight="600" fill="#121826">' + esc(potong(l.judul, 22)) + '</text>');
        out.push('<text x="' + (x + 12) + '" y="' + (y + 38) + '" font-size="10.5" fill="#6D727F">' + esc(potong(l.sub, 26)) + '</text>');
        out.push('<text x="' + (x + 12) + '" y="' + (y + 53) + '" font-size="10" fill="#9EA3AE">' + esc(l.grade) + '</text>');
        if (n.jumlahBawahan) {
          var cx = x + LEBAR - 18, cy = y + TINGGI - 14;
          out.push('<circle cx="' + cx + '" cy="' + cy + '" r="10" fill="' + (n.terlipat ? '#F1F6FE' : '#F3F4F6') + '" stroke="' + (n.terlipat ? '#C5DAFB' : '#E6E7EB') + '"/>');
          out.push('<text x="' + cx + '" y="' + (cy + 3.5) + '" font-size="9.5" text-anchor="middle" fill="' + (n.terlipat ? '#273FA9' : '#394150') + '">' +
                   (n.terlipat ? ('+' + n.jumlahBawahan) : n.jumlahBawahan) + '</text>');
        }
        out.push('</g>');
      } else {
        // Vacancy atau alokasi belum terisi: garis putus.
        var t = n.tambahan;
        var warna = t.jenis === "vacancy" ? "#9EA3AE" : "#3273F6";
        out.push('<g class="nb-bagan-simpul" data-id="' + esc(n.id) + '">');
        out.push('<rect x="' + x + '" y="' + y + '" width="' + LEBAR + '" height="' + TINGGI +
                 '" rx="10" fill="' + (t.jenis === "vacancy" ? "#F9FAFB" : "#F1F6FE") + '" stroke="' + warna + '" stroke-width="1.5" stroke-dasharray="5 4"/>');
        out.push('<text x="' + (x + 12) + '" y="' + (y + 22) + '" font-size="12" font-weight="600" fill="' + warna + '">' + esc(potong(t.judul, 22)) + '</text>');
        out.push('<text x="' + (x + 12) + '" y="' + (y + 38) + '" font-size="10.5" fill="#6D727F">' + esc(potong(t.sub, 26)) + '</text>');
        out.push('<text x="' + (x + 12) + '" y="' + (y + 53) + '" font-size="10" fill="#9EA3AE">' + esc(t.grade || "") + '</text>');
        out.push('</g>');
      }
    });
    out.push('</svg>');
    return out.join("");
  }

  // Satu pintu: dari pohon dan pilihan, langsung ke SVG dan ringkasannya.
  function susun(akarId, pohon, dibuka, opsi) {
    var tampak = simpulTampak(akarId, pohon, dibuka || {}, opsi);
    if (!tampak.akar) return { svg: "", jumlah: 0, terpotong: false, simpul: [] };
    var ukuran = tataLetak(tampak.akar);
    var svg = gambar({ simpul: tampak.simpul, ukuran: ukuran }, opsi);
    return { svg: svg, jumlah: tampak.simpul.length, terpotong: tampak.terpotong, simpul: tampak.simpul,
             ukuran: ukuran };
  }

  global.NBBagan = { simpulTampak: simpulTampak, tataLetak: tataLetak, gambar: gambar, susun: susun,
                     BATAS_KOTAK: BATAS_KOTAK, LEBAR: LEBAR, TINGGI: TINGGI };
})(window);

</script>
<script>
/* js/domain/actions.js */
// Mesin action MPP. Sumber kebenaran tunggal untuk apa saja yang boleh direncanakan
// dan bagaimana masing-masing memengaruhi headcount.
//
// Dokumen menyebut tujuh action type (bab 11). Saya menambahkan satu, PLANNED_REDUCTION,
// karena tanpa itu tidak ada satu pun jalan untuk merencanakan pengurangan headcount,
// sehingga Proposed selalu naik dan tidak akan pernah cocok dengan Actual. Ini disetujui
// sebagai jawaban default pertanyaan nomor 4 pada fase perencanaan.
//
// Aturan penting yang tidak tertulis di dokumen: hanya tiga action yang menambah
// headcount perusahaan, yaitu External Hiring, Vacancy Fill, dan Position Creation yang
// langsung diisi. Promotion, Grade Adjustment, dan Transfer tidak mengubah total headcount
// perusahaan sama sekali. Transfer hanya memindahkan satu orang antar departemen.
(function (global) {
  "use strict";

  // basis: apa yang menjadi sasaran baris. employee, position, vacancy, atau baru.
  // hc: dampak ke headcount perusahaan per satu kuantitas.
  // biaya: none, delta (selisih grade), penuh, hemat.
  var ACTIONS = {
    NO_CHANGE: {
      kode: "NO_CHANGE", basis: "employee", hc: 0, biaya: "none",
      badge: "is-plain", perluBulan: false, perluAlasan: false
    },
    PROMOTION: {
      kode: "PROMOTION", basis: "employee", hc: 0, biaya: "delta",
      badge: "is-blue", perluBulan: true, perluAlasan: true, perluGrade: true, gradeNaik: true
    },
    GRADE_ADJUSTMENT: {
      kode: "GRADE_ADJUSTMENT", basis: "employee", hc: 0, biaya: "delta",
      badge: "is-indigo", perluBulan: true, perluAlasan: true, perluGrade: true
    },
    TRANSFER: {
      kode: "TRANSFER", basis: "employee", hc: 0, biaya: "none",
      badge: "is-violet", perluBulan: true, perluAlasan: true, perluDeptTujuan: true
    },
    // Mutasi antar tim di dalam satu departemen (K4 nomor 7). Headcount dan biaya departemen
    // tidak berubah, yang berpindah hanya atasan langsungnya, dan HOD yang mengonfirmasi.
    INTERNAL_TRANSFER: {
      kode: "INTERNAL_TRANSFER", basis: "employee", hc: 0, biaya: "none",
      badge: "is-violet", perluBulan: true, perluAlasan: true, perluAtasanTujuan: true
    },
    EXTERNAL_HIRING: {
      kode: "EXTERNAL_HIRING", basis: "position", hc: 1, biaya: "penuh",
      badge: "is-emerald", perluBulan: true, perluAlasan: true,
      perluKuantitas: true, perluReplacement: true
    },
    VACANCY_ACTION: {
      kode: "VACANCY_ACTION", basis: "vacancy", hc: 0, biaya: "none",
      badge: "is-teal", perluBulan: true, perluAlasan: true, perluSubtipe: true
    },
    POSITION_CREATION: {
      kode: "POSITION_CREATION", basis: "baru", hc: 0, biaya: "none",
      badge: "is-amber", perluBulan: true, perluAlasan: true,
      perluKuantitas: true, perluGrade: true, perluJudulPosisi: true, bisaIsiLangsung: true
    },
    PLANNED_REDUCTION: {
      kode: "PLANNED_REDUCTION", basis: "employee", hc: -1, biaya: "hemat",
      badge: "is-red", perluBulan: true, perluAlasan: true, perluSebabKurang: true
    }
  };

  // Sub tipe Vacancy Action (bab 12).
  var VACANCY_SUB = {
    FILL:   { kode: "FILL",   hc: 1,  perluReplacement: true },
    RETAIN: { kode: "RETAIN", hc: 0 },
    CANCEL: { kode: "CANCEL", hc: 0, hapusSlot: true }
  };

  var SEBAB_KURANG = ["Resign", "Pensiun", "Berakhir kontrak", "Restrukturisasi", "Pindah entitas"];

  function daftar() { return Object.keys(ACTIONS); }
  function def(kode) { return ACTIONS[kode] || null; }

  // Dampak headcount satu baris. Selalu dihitung dari definisi, tidak pernah
  // dari angka yang diketik pengguna, supaya tidak bisa dimanipulasi lewat layar.
  function dampakHc(baris) {
    var a = ACTIONS[baris.action_type];
    if (!a) return { perusahaan: 0, asal: 0, tujuan: 0 };
    var qty = a.perluKuantitas ? Number(baris.quantity || 0) : 1;

    // Catatan koreksi, ditemukan saat QA Modul 4.
    // Semula baris turunan Position Creation saya nolkan seluruhnya. Itu keliru, karena
    // posisi baru yang tidak langsung diisi memang berdampak nol, sehingga menolkan baris
    // rekrutmen turunannya membuat penambahan headcount hilang sama sekali.
    // Pembagian yang benar: Position Creation membuat slot dan hanya menambah headcount
    // bila ditandai diisi langsung, sedangkan rekrutmen turunannya adalah yang mengisi slot
    // dan tetap dihitung. Double counting dicegah aturan V09c, yang melarang satu posisi
    // ditandai diisi langsung sekaligus punya baris rekrutmen turunan.

    if (baris.action_type === "VACANCY_ACTION") {
      var sub = VACANCY_SUB[baris.vacancy_subtype] || VACANCY_SUB.RETAIN;
      return { perusahaan: sub.hc, asal: sub.hc, tujuan: 0 };
    }
    if (baris.action_type === "POSITION_CREATION") {
      var n = baris.fill_immediately ? qty : 0;
      return { perusahaan: n, asal: n, tujuan: 0 };
    }
    if (baris.action_type === "TRANSFER") {
      return { perusahaan: 0, asal: -1, tujuan: 1 };
    }
    return { perusahaan: a.hc * qty, asal: a.hc * qty, tujuan: 0 };
  }

  // Mutasi baru berlaku setelah departemen penerima mengonfirmasi (BR-D).
  // Selama masih draft, transfer_status belum ada, jadi tetap dihitung sebagai pratinjau.
  // Begitu dikirim dan berstatus menunggu atau ditolak, mutasi tidak dihitung di mana pun.
  function mutasiBerlaku(b) {
    if (b.action_type !== "TRANSFER") return true;
    if (!b.transfer_status) return true;
    return b.transfer_status === "CONFIRMED";
  }

  // Ringkasan satu kumpulan baris untuk satu departemen.
  function rekap(barisList, departmentId) {
    var tambah = 0, kurang = 0, masuk = 0, keluar = 0;
    barisList.forEach(function (b) {
      var d = dampakHc(b);
      if (b.action_type === "TRANSFER") {
        if (!mutasiBerlaku(b)) return;
        if (b.department_id === departmentId) keluar += 1;
        if (b.target_department_id === departmentId) masuk += 1;
        return;
      }
      if (d.perusahaan > 0) tambah += d.perusahaan;
      if (d.perusahaan < 0) kurang += Math.abs(d.perusahaan);
    });
    return { tambah: tambah, kurang: kurang, masuk: masuk, keluar: keluar,
             netto: tambah - kurang + masuk - keluar };
  }

  global.NBActions = {
    ACTIONS: ACTIONS, VACANCY_SUB: VACANCY_SUB, SEBAB_KURANG: SEBAB_KURANG,
    daftar: daftar, def: def, dampakHc: dampakHc, rekap: rekap, mutasiBerlaku: mutasiBerlaku
  };
})(window);

</script>
<script>
/* js/domain/validate.js */
// Validasi baris usulan MPP. Dipisah dari layar supaya bisa diuji tanpa membuka browser
// dan supaya aturan yang sama berlaku di mana pun baris dibuat.
//
// Kode aturan mengacu ke business rules dokumen. Yang tidak punya rujukan berarti
// tambahan saya, dan ditandai jelas di komentar.
(function (global) {
  "use strict";

  function galat(kode, kunci, vars) { return { kode: kode, kunci: kunci, vars: vars || {} }; }

  // konteks: { baris, semuaBaris, departemen, karyawan, grade, vacancy, currentHc }
  function periksa(baris, ctx) {
    var errors = [], warnings = [];
    var a = NBActions.def(baris.action_type);
    if (!a) return { errors: [galat("V00", "val.actionTidakDikenal")], warnings: [] };

    // V01, BR-01: bulan efektif wajib untuk setiap action yang perlu implementasi.
    if (a.perluBulan) {
      var m = Number(baris.effective_month);
      if (!m || m < 1 || m > 12) errors.push(galat("V01", "val.bulanWajib"));
    }

    // V02: kuantitas minimal satu untuk action berbasis jumlah.
    if (a.perluKuantitas) {
      var q = Number(baris.quantity);
      if (!q || q < 1) errors.push(galat("V02", "val.kuantitasMin"));
      if (q > 50) warnings.push(galat("W02", "val.kuantitasBesar", { n: q }));
    }

    // V03, BR-A: setiap penambahan headcount wajib diklasifikasi replacement atau additional.
    var perluRep = a.perluReplacement ||
      (baris.action_type === "VACANCY_ACTION" && baris.vacancy_subtype === "FILL");
    if (perluRep && !baris.replacement_flag) errors.push(galat("V03", "val.replacementWajib"));

    // V04, BR-F: grade tujuan wajib dan harus berbeda. Promosi harus naik.
    if (a.perluGrade) {
      if (!baris.target_grade_id) errors.push(galat("V04", "val.gradeWajib"));
      else if (ctx.gradeAsal) {
        var asal = ctx.levelGrade(ctx.gradeAsal), tujuan = ctx.levelGrade(baris.target_grade_id);
        if (baris.action_type !== "POSITION_CREATION" && tujuan === asal) {
          errors.push(galat("V04b", "val.gradeSama"));
        }
        if (a.gradeNaik && tujuan < asal) errors.push(galat("V04c", "val.promosiTurun"));
        if (a.gradeNaik && tujuan - asal > 1) warnings.push(galat("W04", "val.lompatGrade", { n: tujuan - asal }));
      }
    }

    // V07f (keputusan 3b): karyawan dengan NIK sementara belum boleh diusulkan.
    if (baris.employee_id && ctx.karyawanSementara) errors.push(galat("V07f", "val.karyawanSementara"));
    // W05c (keputusan 4c): mutasi antar departemen menunggu OD menetapkan atasan barunya.
    if (a.perluDeptTujuan && !baris.target_manager_id) warnings.push(galat("W05c", "val.mutasiTanpaAtasan"));

    // V05c: mutasi internal wajib menunjuk atasan baru di departemen yang sama, dan atasan
    // itu harus orang yang berbeda dari atasan sekarang. Pemeriksaan keberadaan atasan dan
    // departemennya dilakukan store lewat ctx.atasanTujuan.
    if (a.perluAtasanTujuan) {
      if (!baris.target_manager_id) errors.push(galat("V05c", "val.atasanTujuanWajib"));
      else if (ctx.atasanTujuan === false) errors.push(galat("V05d", "val.atasanTujuanLuar"));
      else if (baris.target_manager_id === ctx.atasanSekarang) errors.push(galat("V05e", "val.atasanTujuanSama"));
      else warnings.push(galat("W05b", "val.mutasiInternalPerluHod"));
    }

    // V05, BR-D: transfer wajib punya departemen tujuan yang berbeda,
    // dan menunggu konfirmasi departemen penerima.
    if (a.perluDeptTujuan) {
      if (!baris.target_department_id) errors.push(galat("V05", "val.deptTujuanWajib"));
      else if (baris.target_department_id === baris.department_id) {
        errors.push(galat("V05b", "val.deptTujuanSama"));
      } else if (ctx.lintasEntitas) {
        // Mutasi lintas legal entity bukan mutasi, melainkan berhenti dan diangkat kembali
        // di entitas lain. Dilarang di sini sampai punya aturannya sendiri (F4-4).
        errors.push(galat("V05f", "val.deptTujuanLintasEntitas"));
      } else {
        warnings.push(galat("W05", "val.transferPerluKonfirmasi"));
      }
    }

    // V06: alasan wajib untuk setiap baris yang menambah headcount atau biaya.
    if (a.perluAlasan && (!baris.justification || baris.justification.trim().length < 10)) {
      errors.push(galat("V06", "val.alasanWajib"));
    }

    // V07: sasaran baris harus ada dan berada dalam lingkup departemen penyusun.
    if (a.basis === "employee" && !baris.employee_id) errors.push(galat("V07", "val.karyawanWajib"));
    if (a.basis === "vacancy" && !baris.vacancy_id) errors.push(galat("V07b", "val.vacancyWajib"));
    if (a.perluJudulPosisi && !baris.new_position_title) errors.push(galat("V07c", "val.judulPosisiWajib"));
    if (a.perluSubtipe && !baris.vacancy_subtype) errors.push(galat("V07d", "val.subtipeWajib"));
    if (a.perluSebabKurang && !baris.reduction_reason) errors.push(galat("V07e", "val.sebabKurangWajib"));
    // V05g (F9-1): pindah entitas wajib menyebut departemen tujuan di legal entity lain.
    if (a.perluSebabKurang && baris.reduction_reason === "Pindah entitas") {
      if (!baris.target_department_id) errors.push(galat("V05g", "val.pindahEntitasTujuan"));
      else if (ctx.lintasEntitas === false) errors.push(galat("V05h", "val.pindahEntitasSama"));
      else if (!baris.linked_line_item_id) warnings.push(galat("W05d", "val.pindahEntitasMenunggu"));
    }

    // V08, BR-I: headcount departemen tidak boleh menjadi negatif.
    if (typeof ctx.currentHc === "number") {
      var rekap = NBActions.rekap(ctx.semuaBaris || [], baris.department_id);
      if (ctx.currentHc + rekap.netto < 0) errors.push(galat("V08", "val.hcNegatif"));
    }

    // V09: pencegah double counting. Baris hiring yang menunjuk induk wajib menunjuk
    // baris Position Creation yang benar, dan induknya tidak boleh sudah diisi langsung.
    // Aturan ini tidak ada di dokumen, saya tambahkan pada fase perencanaan gap nomor 2.
    if (baris.parent_line_item_id) {
      var induk = (ctx.semuaBaris || []).filter(function (x) {
        return x.line_item_id === baris.parent_line_item_id;
      })[0];
      if (!induk) errors.push(galat("V09", "val.indukTidakAda"));
      else if (induk.action_type !== "POSITION_CREATION") errors.push(galat("V09b", "val.indukBukanPosisi"));
      else if (induk.fill_immediately) errors.push(galat("V09c", "val.indukSudahDiisi"));
    }

    // V10: satu karyawan sebaiknya tidak muncul di lebih dari satu baris yang mengubah statusnya.
    if (baris.employee_id && baris.action_type !== "NO_CHANGE") {
      var kembar = (ctx.semuaBaris || []).filter(function (x) {
        return x.employee_id === baris.employee_id && x.line_item_id !== baris.line_item_id &&
               x.action_type !== "NO_CHANGE";
      });
      if (kembar.length) warnings.push(galat("W10", "val.karyawanGanda"));
    }

    // V11: vacancy yang direncanakan harus masih terbuka.
    if (baris.vacancy_id && ctx.vacancyStatus && ctx.vacancyStatus !== "Open") {
      errors.push(galat("V11", "val.vacancyTidakTerbuka", { s: ctx.vacancyStatus }));
    }

    return { errors: errors, warnings: warnings };
  }

  function valid(hasil) { return hasil.errors.length === 0; }

  global.NBValidate = { periksa: periksa, valid: valid };
})(window);

</script>
<script>
/* js/domain/costing.js */
// Mesin biaya people cost. Satu-satunya tempat angka rupiah dihitung.
//
// Komponen mengikuti definisi yang dikunci Kang Rangga:
// gaji pokok, tunjangan grade, tunjangan jabatan, tunjangan komunikasi, tunjangan kehadiran,
// tunjangan makan, tunjangan PPh 21 (gaji net), tunjangan COP/HOP, BPJS Kesehatan bagian
// perusahaan, BPJS Ketenagakerjaan bagian perusahaan (JP, JKK, JKM, JHT, JKP), asuransi
// pihak ketiga, accrual THR, dan accrual bonus.
//
// Catatan satu: dalam daftar semula tertulis JKN di bawah BPJS Ketenagakerjaan. JKN adalah
// program BPJS Kesehatan, sedangkan komponen kematian di BPJS Ketenagakerjaan bernama JKM.
// Di sini dicatat sebagai JKM supaya tidak berbenturan dengan BPJS Kesehatan yang sudah
// berdiri sendiri. Kalau memang JKN yang dimaksud, cukup ganti labelnya.
//
// Catatan dua: tunjangan PPh 21 di sini adalah angka yang diisi C&B, bukan hasil hitungan
// pajak. Menghitung PPh 21 sungguhan memerlukan TER bulanan, PTKP, dan penyetahunan
// Desember, dan itu keputusan tersendiri yang belum diambil.
//
// BR-E: biaya tahunan bukan biaya bulanan dikali dua belas, melainkan dikali jumlah bulan
// yang benar-benar berlaku, yaitu tiga belas dikurangi bulan efektif.
(function (global) {
  "use strict";

  var KOMPONEN = [
    { kunci: "gaji_pokok",            jenis: "tetap",   upah: true },
    { kunci: "tunj_grade",            jenis: "tetap",   upah: true },
    { kunci: "tunj_jabatan",          jenis: "tetap",   upah: true },
    { kunci: "tunj_komunikasi",       jenis: "tunjangan" },
    { kunci: "tunj_kehadiran",        jenis: "tunjangan" },
    { kunci: "tunj_makan",            jenis: "tunjangan" },
    { kunci: "tunj_pph21",            jenis: "tunjangan" },
    { kunci: "tunj_cop_hop",          jenis: "tunjangan" },
    { kunci: "asuransi_pihak_ketiga", jenis: "asuransi" }
  ];

  var IURAN = [
    { kunci: "bpjs_kes", pct: "bpjs_kes_pct", cap: "bpjs_kes_cap" },
    { kunci: "jht",      pct: "jht_pct" },
    { kunci: "jkk",      pct: "jkk_pct" },
    { kunci: "jkm",      pct: "jkm_pct" },
    { kunci: "jp",       pct: "jp_pct", cap: "jp_cap" },
    { kunci: "jkp",      pct: "jkp_pct" }
  ];

  function bulat(n) { return Math.round(n); }

  // Rincian biaya bulanan satu grade. Mengembalikan tiap komponen supaya layar
  // bisa menampilkan rinciannya tanpa menghitung ulang apa pun.
  // Lima kelompok utama diisi langsung oleh C&B (masukan Dzuhri nomor 1). Tiga belas rincian
  // di sebelahnya hanya keterangan dan tidak pernah dijumlahkan oleh sistem, supaya tidak
  // ada dua angka yang bisa saling bertentangan.
  var UTAMA = ["fixed_income", "variable_income", "company_coverage", "accrual_thr", "accrual_bonus"];
  var RINCIAN = ["gaji_pokok", "tunj_grade", "tunj_jabatan", "tunj_komunikasi", "tunj_kehadiran",
                 "tunj_makan", "tunj_pph21", "tunj_cop_hop", "bpjs_kes", "jht", "jkk", "jkm",
                 "jp", "jkp", "asuransi_pihak_ketiga"];

  function bulanan(asumsiGrade, param) {
    if (!asumsiGrade) return null;
    var r = { komponen: {}, utama: {}, rincian: {}, total: 0 };
    UTAMA.forEach(function (k) {
      var v = bulat(Number(asumsiGrade[k] || 0));
      r.utama[k] = v; r.komponen[k] = v; r.total += v;
    });
    RINCIAN.forEach(function (k) {
      var v = bulat(Number(asumsiGrade[k] || 0));
      r.rincian[k] = v; r.komponen[k] = v;
    });
    // Nama lama tetap disediakan untuk layar yang mengelompokkan.
    r.upah = r.utama.fixed_income;
    r.tunjangan = r.utama.variable_income;
    r.iuran = r.utama.company_coverage;
    r.accrual = r.utama.accrual_thr + r.utama.accrual_bonus;
    return r;
  }

  // Biaya satu baris usulan. Mengembalikan biaya bulanan, jumlah bulan berlaku,
  // dan biaya tahunan yang sudah diprorata.
  //
  // ctx: { asumsi(gradeId), param, gradeAsal, gradeTujuan }
  function baris(b, ctx) {
    var a = NBActions.def(b.action_type);
    if (!a) return null;
    var bulanBerlaku = NBFormat.bulanBerlaku(b.effective_month);
    var qty = a.perluKuantitas ? Number(b.quantity || 0) : 1;

    function totalGrade(g) {
      var m = bulanan(ctx.asumsi(g), ctx.param);
      return m ? m.total : 0;
    }

    var jenis = a.biaya, bulananNilai = 0, catatan = jenis;

    if (jenis === "penuh") {
      bulananNilai = totalGrade(ctx.gradeTujuan || ctx.gradeAsal) * qty;
    } else if (jenis === "delta") {
      // Yang diprorata adalah selisihnya, bukan biaya penuh.
      bulananNilai = totalGrade(ctx.gradeTujuan) - totalGrade(ctx.gradeAsal);
    } else if (jenis === "hemat") {
      bulananNilai = -totalGrade(ctx.gradeAsal) * qty;
    } else {
      bulananNilai = 0;
    }

    // Vacancy hanya berbiaya bila diisi. Posisi baru hanya berbiaya bila langsung diisi.
    if (b.action_type === "VACANCY_ACTION") {
      bulananNilai = b.vacancy_subtype === "FILL" ? totalGrade(ctx.gradeTujuan || ctx.gradeAsal) : 0;
      catatan = b.vacancy_subtype === "FILL" ? "penuh" : "none";
    }
    if (b.action_type === "POSITION_CREATION") {
      bulananNilai = b.fill_immediately ? totalGrade(ctx.gradeTujuan) * qty : 0;
      catatan = b.fill_immediately ? "penuh" : "none";
    }

    return {
      line_item_id: b.line_item_id,
      jenis: catatan,
      monthly_cost: bulat(bulananNilai),
      applicable_months: bulananNilai ? bulanBerlaku : 0,
      annualized_cost: bulat(bulananNilai * bulanBerlaku)
    };
  }

  global.NBCosting = {
    KOMPONEN: KOMPONEN, IURAN: IURAN, UTAMA: UTAMA, RINCIAN: RINCIAN,
    bulanan: bulanan, baris: baris
  };
})(window);

</script>
<script>
/* js/domain/report.js */
// Pembangun laporan dan ekspor. Sembilan laporan bab 30, semuanya diturunkan dari data
// yang sudah ada, tanpa satu pun angka yang dihitung ulang di sini dengan cara berbeda.
//
// Ekspor memakai titik koma sebagai pemisah kolom, karena Excel dengan locale Indonesia
// membaca koma sebagai pemisah desimal. Angka diekspor mentah tanpa titik ribuan supaya
// tetap bisa dijumlahkan di spreadsheet.
(function (global) {
  "use strict";

  // Temuan uji keamanan: sel yang diawali sama dengan, tambah, kurang, atau at akan
  // dieksekusi sebagai rumus oleh Excel dan Google Sheets saat berkas dibuka. Nama karyawan
  // atau alasan bisnis yang diketik seseorang bisa berubah menjadi perintah di mesin orang
  // lain. Sel seperti itu diawali tanda kutip tunggal supaya dibaca sebagai teks.
  //
  // Angka tidak pernah ikut dilindungi, karena biaya negatif diawali tanda kurang dan
  // harus tetap bisa dijumlahkan di spreadsheet.
  function angkaMurni(v) {
    if (typeof v === "number") return true;
    var t = String(v).trim();
    return t !== "" && /^-?\d+([.,]\d+)?$/.test(t);
  }

  function sel(v) {
    if (v === null || v === undefined) return "";
    var t = String(v);
    if (!angkaMurni(v) && /^[=+\-@\t\r]/.test(t)) t = "'" + t;
    return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }

  function keCsv(kolom, baris) {
    var isi = [kolom.map(function (k) { return sel(k.label); }).join(";")];
    baris.forEach(function (b) {
      isi.push(kolom.map(function (k) { return sel(b[k.kunci]); }).join(";"));
    });
    return "\uFEFF" + isi.join("\r\n");   // BOM supaya Excel membaca UTF-8 dengan benar
  }

  // Unduh berkas di sisi klien. Kalau lingkungan memblokir unduhan, kembalikan false
  // supaya layar bisa menawarkan salin ke papan klip.
  function unduh(namaBerkas, isi, tipe) {
    try {
      var blob = new Blob([isi], { type: (tipe || "text/csv") + ";charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = namaBerkas;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
      return true;
    } catch (e) { return false; }
  }

  global.NBReport = { keCsv: keCsv, unduh: unduh };
})(window);

</script>
<script>
/* js/domain/impor.js */
// Mesin impor. Parser CSV, pembuat templat, dan definisi berkas yang boleh diunggah.
//
// Prinsip yang dipegang di sini:
// 1. Impor tidak pernah melewati validasi. Baris yang diunggah melewati aturan yang sama
//    persis dengan baris yang diketik di layar, termasuk BR-01, BR-A, BR-I, dan V09.
// 2. Baris bergalat tidak menggagalkan seluruh berkas. Yang lolos masuk, yang gagal
//    dikembalikan lengkap dengan alasannya supaya bisa diperbaiki dan diunggah ulang.
// 3. Impor selalu menambah atau membuat versi baru, tidak pernah menimpa diam-diam.
(function (global) {
  "use strict";

  // Pemisah dideteksi dari baris pertama. Excel Indonesia menulis titik koma,
  // ekspor dari sistem lain sering memakai koma.
  function deteksiPemisah(teks) {
    var baris = teks.split(/\r?\n/)[0] || "";
    var titikKoma = (baris.match(/;/g) || []).length;
    var koma = (baris.match(/,/g) || []).length;
    return titikKoma >= koma ? ";" : ",";
  }

  // Tanggal dari Excel berbahasa Indonesia (F10-1): 15/03/2027, 15-03-2027, 15.03.2027,
  // nomor seri Excel, atau sudah TTTT-BB-HH. Selalu disimpan sebagai TTTT-BB-HH.
  function tanggalDari(v) {
    if (v === null || v === undefined) return "";
    var t = String(v).trim();
    if (!t) return "";
    if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
    var m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
    if (m) return m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
    var m2 = t.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/);
    if (m2) return m2[1] + "-" + m2[2].padStart(2, "0") + "-" + m2[3].padStart(2, "0");
    if (/^\d{5}$/.test(t)) {   // nomor seri Excel, hari sejak 30 Desember 1899
      var d = new Date(Date.UTC(1899, 11, 30) + Number(t) * 86400000);
      return d.toISOString().slice(0, 10);
    }
    return t;   // dibiarkan, validasi yang menolak
  }

  // Kepala kolom lentur (F10-3): "Employee ID", "employee id", "EMPLOYEE_ID" menjadi employee_id.
  var ALIAS = {
    "nik": "employee_id", "nama": "name", "nama_karyawan": "name", "grade": "grade_id",
    "departemen": "department_id", "posisi": "position_id", "atasan": "direct_report_id",
    "atasan_langsung": "direct_report_id", "tanggal_masuk": "join_date", "status": "employment_status"
  };
  function normalKepala(h) {
    var k = String(h || "").replace(/^\uFEFF/, "").trim().toLowerCase()
      .replace(/[\s\-]+/g, "_").replace(/[^a-z0-9_]/g, "");
    return ALIAS[k] || k;
  }

  // Kolom kode dibaca tanpa spasi tepi dan tanpa membedakan huruf besar kecil (F10-2).
  var KOLOM_KODE = ["employee_id", "position_id", "grade_id", "department_id", "direct_report_id",
    "target_manager_id", "target_department_id", "target_grade_id", "vacancy_id", "allocation_id",
    "entity_id", "directorate_id", "division_id", "cost_center_id", "user_id", "nik_sementara",
    "currency", "action_type", "scope_type", "role"];
  var KOLOM_TANGGAL = ["join_date", "actual_date", "effective_date", "vacancy_date"];
  function normalNilai(kolom, v) {
    var t = String(v === undefined || v === null ? "" : v).trim();
    if (KOLOM_KODE.indexOf(kolom) !== -1) return t.toUpperCase();
    if (KOLOM_TANGGAL.indexOf(kolom) !== -1) return tanggalDari(t);
    return t;
  }

  function urai(teks) {
    if (!teks) return { kolom: [], baris: [] };
    if (teks.charCodeAt(0) === 0xFEFF) teks = teks.slice(1);
    var pemisah = deteksiPemisah(teks);
    var baris = [], sel = "", kini = [], dalamKutip = false;

    for (var i = 0; i < teks.length; i++) {
      var c = teks[i];
      if (dalamKutip) {
        if (c === '"' && teks[i + 1] === '"') { sel += '"'; i++; }
        else if (c === '"') dalamKutip = false;
        else sel += c;
      } else if (c === '"') dalamKutip = true;
      else if (c === pemisah) { kini.push(sel); sel = ""; }
      else if (c === "\n") { kini.push(sel); baris.push(kini); kini = []; sel = ""; }
      else if (c !== "\r") sel += c;
    }
    if (sel.length || kini.length) { kini.push(sel); baris.push(kini); }
    baris = baris.filter(function (b) { return b.some(function (x) { return String(x).trim() !== ""; }); });
    if (!baris.length) return { kolom: [], baris: [] };

    var kepala = baris[0].map(normalKepala);
    var isi = baris.slice(1).map(function (b, idx) {
      var o = { _baris: idx + 2 };   // nomor baris di berkas, kepala dihitung baris 1
      kepala.forEach(function (h, j) { if (h) o[h] = normalNilai(h, b[j]); });
      return o;
    });
    return { kolom: kepala, baris: isi, pemisah: pemisah };
  }

  // Definisi berkas yang boleh diunggah. kolom wajib ditandai w.
  var BERKAS = {
    // Struktur organisasi: entitas, direktorat, divisi, departemen, cost center.
    ORGANISASI: {
      kode: "ORGANISASI", cap: "admin", urutan: 0,
      kolom: [
        { k: "entity_id", w: true }, { k: "entity_name", w: true }, { k: "country", w: true },
        { k: "currency", w: false },
        { k: "directorate_id", w: true }, { k: "directorate_name", w: true },
        { k: "division_id", w: true }, { k: "division_name", w: true },
        { k: "department_id", w: true }, { k: "department_name", w: true },
        { k: "cost_center_id", w: true }, { k: "cost_center_name", w: false }
      ],
      contoh: [{ entity_id: "ENT-KSNI", entity_name: "PT Kaldu Sari Nabati Indonesia", country: "ID",
                 currency: "IDR", directorate_id: "DIR-COM", directorate_name: "Commercial",
                 division_id: "DIV-COM", division_name: "Commercial",
                 department_id: "D-MKT", department_name: "Marketing",
                 cost_center_id: "CC-2100", cost_center_name: "Marketing" }]
    },
    POSISI: {
      kode: "POSISI", cap: "admin", urutan: 1,
      kolom: [
        { k: "position_id", w: true }, { k: "code", w: false }, { k: "title", w: true },
        { k: "grade_id", w: true }, { k: "department_id", w: true },
        { k: "is_unique", w: false }, { k: "headcount_slot", w: false }
      ],
      contoh: [{ position_id: "POS-MKT-004", code: "MKT-4A-004", title: "Digital Marketing Officer",
                 grade_id: "4A", department_id: "D-MKT", is_unique: 0, headcount_slot: 3 }]
    },
    // Karyawan dengan atasan langsung. Kolom keterbacaan manusia (legal_entity, country,
    // directorate, division, position_title, direct_report_name, direct_report_position)
    // hanya diperiksa cocok, yang dipercaya sistem adalah id-nya.
    KARYAWAN: {
      kode: "KARYAWAN", cap: "master.employee.edit", urutan: 2,
      kolom: [
        { k: "employee_id", w: true }, { k: "name", w: true }, { k: "position_id", w: true },
        { k: "position_title", w: false }, { k: "grade_id", w: true },
        { k: "legal_entity", w: false }, { k: "country", w: false },
        { k: "directorate", w: false }, { k: "division", w: false },
        { k: "department_id", w: true }, { k: "employment_status", w: false },
        { k: "join_date", w: false }, { k: "direct_report_id", w: false },
        { k: "direct_report_name", w: false }, { k: "direct_report_position", w: false },
        { k: "nik_sementara", w: false }
      ],
      contoh: [{ employee_id: "NBT2004", name: "Dimas Handayani", position_id: "POS-MKT-003",
                 position_title: "Assistant Brand Manager", grade_id: "4C",
                 legal_entity: "PT Kaldu Sari Nabati Indonesia", country: "ID",
                 directorate: "Commercial", division: "Commercial", department_id: "D-MKT",
                 employment_status: "Tetap", join_date: "2019-03-04",
                 direct_report_id: "NBT2002", direct_report_name: "Ayu Permata",
                 direct_report_position: "Brand Manager", nik_sementara: "" }]
    },
    VACANCY: {
      kode: "VACANCY", cap: "admin", urutan: 3,
      kolom: [
        { k: "vacancy_id", w: true }, { k: "position_id", w: true }, { k: "department_id", w: true },
        { k: "grade_id", w: false }, { k: "vacancy_date", w: false },
        { k: "source", w: false }, { k: "status", w: false }
      ],
      contoh: [{ vacancy_id: "VAC-001", position_id: "POS-MKT-004", department_id: "D-MKT",
                 grade_id: "4A", vacancy_date: "2025-09-15", source: "Resign", status: "Open" }]
    },
    // Pengguna non-lini saja. HOD dan manajer diturunkan otomatis dari pohon; baris yang
    // menautkan employee_id hanya menyumbang user_id, nama, dan surel.
    PENGGUNA: {
      kode: "PENGGUNA", cap: "admin", urutan: 4,
      kolom: [
        { k: "user_id", w: true }, { k: "name", w: true }, { k: "email", w: true },
        { k: "role", w: true }, { k: "title", w: false }, { k: "employee_id", w: false },
        { k: "scope_type", w: false }, { k: "scope_ids", w: false }
      ],
      contoh: [{ user_id: "U-OD-01", name: "M. Dzuhri", email: "od.lead@nabati.co.id", role: "OD",
                 title: "Organization Development Lead", employee_id: "", scope_type: "ALL", scope_ids: "" }]
    },
    // Lima angka utama diisi langsung; tiga belas rincian di sebelahnya sebagai keterangan.
    ASUMSI: {
      kode: "ASUMSI", cap: "cost.assumption", urutan: 5,
      kolom: [
        { k: "grade_id", w: true }, { k: "entity_id", w: false },
        { k: "fixed_income", w: true }, { k: "variable_income", w: true }, { k: "company_coverage", w: true },
        { k: "gaji_pokok", w: false }, { k: "tunj_grade", w: false }, { k: "tunj_jabatan", w: false },
        { k: "tunj_komunikasi", w: false }, { k: "tunj_kehadiran", w: false }, { k: "tunj_makan", w: false },
        { k: "tunj_pph21", w: false }, { k: "tunj_cop_hop", w: false },
        { k: "bpjs_kes", w: false }, { k: "jht", w: false }, { k: "jkk", w: false }, { k: "jkm", w: false },
        { k: "jp", w: false }, { k: "jkp", w: false }, { k: "asuransi_pihak_ketiga", w: false },
        { k: "accrual_thr", w: true }, { k: "accrual_bonus", w: true }
      ],
      contoh: [{ grade_id: "4A", entity_id: "", fixed_income: 14300000, variable_income: 2500000, company_coverage: 1600000,
                 gaji_pokok: 12000000, tunj_grade: 1200000, tunj_jabatan: 0, tunj_komunikasi: 350000,
                 tunj_kehadiran: 400000, tunj_makan: 600000, tunj_pph21: 1500000, tunj_cop_hop: 0,
                 bpjs_kes: 480000, jht: 488000, jkk: 71000, jkm: 40000, jp: 211000, jkp: 29000,
                 asuransi_pihak_ketiga: 250000, accrual_thr: 1100000, accrual_bonus: 1100000 }]
    },
    KURS: {
      kode: "KURS", cap: "cost.assumption", urutan: 6,
      kolom: [
        { k: "currency", w: true }, { k: "rate_to_idr", w: true },
        { k: "effective_date", w: true }, { k: "source", w: false }
      ],
      contoh: [{ currency: "MYR", rate_to_idr: 3650, effective_date: "2027-01-01", source: "Kurs tengah BI" }]
    },
    USULAN: {
      kode: "USULAN", cap: "plan.create", urutan: 7,
      kolom: [
        { k: "department_id", w: true }, { k: "action_type", w: true },
        { k: "employee_id", w: false }, { k: "position_id", w: false }, { k: "vacancy_id", w: false },
        { k: "new_position_title", w: false }, { k: "target_grade_id", w: false },
        { k: "target_department_id", w: false }, { k: "target_manager_id", w: false },
        { k: "vacancy_subtype", w: false },
        { k: "reduction_reason", w: false }, { k: "replacement_flag", w: false },
        { k: "quantity", w: false }, { k: "effective_month", w: true },
        { k: "fill_immediately", w: false }, { k: "justification", w: true }
      ],
      contoh: [{ department_id: "D-MKT", action_type: "EXTERNAL_HIRING", employee_id: "",
                 position_id: "POS-MKT-004", vacancy_id: "", new_position_title: "",
                 target_grade_id: "", target_department_id: "", target_manager_id: "", vacancy_subtype: "",
                 reduction_reason: "", replacement_flag: "Additional", quantity: 1,
                 effective_month: 3, fill_immediately: "",
                 justification: "Menambah kapasitas eksekusi kampanye digital 2027" }]
    },
    REALISASI: {
      kode: "REALISASI", cap: "actual.record", urutan: 8,
      kolom: [
        { k: "allocation_id", w: true }, { k: "quantity", w: true },
        { k: "actual_date", w: true }, { k: "employee_name", w: false }, { k: "employee_id", w: false }
      ],
      contoh: [{ allocation_id: "ALO-2027-0001", quantity: 1, actual_date: "2027-03-10",
                 employee_name: "Nama yang benar-benar masuk" }]
    }
  };

  function def(kode) { return BERKAS[kode] || null; }
  function daftar() {
    return Object.keys(BERKAS).sort(function (a, b) { return BERKAS[a].urutan - BERKAS[b].urutan; });
  }

  // Templat berisi kepala kolom dan satu baris contoh, supaya format tidak perlu ditebak.
  function templat(kode) {
    var b = def(kode);
    if (!b) return "";
    var kolom = b.kolom.map(function (k) { return { kunci: k.k, label: k.k }; });
    return NBReport.keCsv(kolom, b.contoh);
  }

  // Kolom kunci per berkas, untuk menolak kode yang muncul dua kali (F10-4).
  var KUNCI_BERKAS = { ORGANISASI: "department_id", POSISI: "position_id", KARYAWAN: "employee_id",
                       VACANCY: "vacancy_id", PENGGUNA: "user_id", ASUMSI: "grade_id" };
  function barisGanda(kode, baris) {
    var kunci = KUNCI_BERKAS[kode];
    if (!kunci) return {};
    var hitung = {}, ganda = {};
    function nilai(r) { return kode === "ASUMSI" ? (r.grade_id + "|" + (r.entity_id || "")) : r[kunci]; }
    baris.forEach(function (r) { var v = nilai(r); if (v) hitung[v] = (hitung[v] || 0) + 1; });
    baris.forEach(function (r) { var v = nilai(r); if (v && hitung[v] > 1) ganda[r._baris] = r[kunci]; });
    return ganda;
  }

  // Pemeriksaan bentuk berkas sebelum isinya diperiksa satu per satu.
  function periksaKepala(kode, kolom) {
    var b = def(kode);
    if (!b) return { ok: false, kunci: "imp.errBerkas" };
    var kurang = b.kolom.filter(function (k) { return k.w && kolom.indexOf(k.k) === -1; })
                        .map(function (k) { return k.k; });
    if (kurang.length) return { ok: false, kunci: "imp.errKolom", vars: { k: kurang.join(", ") } };
    return { ok: true };
  }

  global.NBImpor = {
    urai: urai, def: def, daftar: daftar, templat: templat, tanggalDari: tanggalDari,
    barisGanda: barisGanda, normalKepala: normalKepala,
    periksaKepala: periksaKepala, BERKAS: BERKAS
  };
})(window);

</script>
<script>
/* js/core/store.js */
// Store. Satu-satunya jalur data masuk dan keluar layar.
// Alasan lapisan ini ada: saat prototipe berpindah ke API sungguhan, hanya berkas ini
