<style>
/* assets/nabati-ds.css */
/* ==========================================================================
   NABATI FLK DESIGN SYSTEM v1.0
   Diekstrak langsung dari screenshot aplikasi Pipeline Rekrutmen FLK Online.
   Seluruh nilai warna di bawah adalah hasil sampling piksel, bukan perkiraan.
   Pasangkan dengan nabati-fonts.css (Schibsted Grotesk, Geist, Geist Mono).
   ========================================================================== */

:root {
  /* --- Brand ------------------------------------------------------------ */
  --nb-red-50:   #FDF2F2;   /* isian tombol destruktif lembut */
  --nb-red-100:  #FCEBEA;   /* isian badge nomor seksi, ikon tile merah */
  --nb-red-200:  #F6DAD8;   /* garis tepi elemen aktif bernuansa merah */
  --nb-red-500:  #E1231B;   /* merah identitas Nabati */
  --nb-red-600:  #CF392B;   /* merah solid yang dipakai tombol dan avatar */
  --nb-red-700:  #B12C20;   /* teks aktif, hover tombol solid */
  --nb-rose-600: #CF364C;   /* ikon avatar baris varian rose */

  /* --- Netral ----------------------------------------------------------- */
  --nb-white:    #FFFFFF;
  --nb-gray-25:  #FEFEFF;   /* permukaan tabel */
  --nb-gray-50:  #F9FAFB;   /* panel baris pengaturan */
  --nb-gray-100: #F3F4F6;   /* pemisah baris, ikon tile netral, badge abu */
  --nb-gray-150: #F5F5F7;   /* wadah navigasi pil */
  --nb-gray-200: #E8E9ED;   /* garis tepi kartu */
  --nb-gray-300: #D2D5DB;   /* garis tepi input dan select */
  --nb-gray-400: #9EA3AE;   /* ikon pasif, placeholder */
  --nb-gray-500: #6D727F;   /* teks sekunder, label tabel */
  --nb-gray-700: #394150;   /* teks kuat, timestamp */
  --nb-gray-800: #212936;   /* kode mono, label badge netral */
  --nb-gray-900: #121826;   /* judul dan angka utama */

  /* --- Warna status (badge, chip, tile ikon) ---------------------------- */
  --nb-blue-fg:     #273FA9;  --nb-blue-bg:     #F1F6FE;  --nb-blue-bd:   #C5DAFB;
  --nb-emerald-fg:  #295E48;  --nb-emerald-bg:  #EFFDF6;  --nb-emerald-bd:#B8F1D2;
  --nb-emerald-500: #43946C;  /* titik status aktif */
  --nb-amber-fg:    #88451D;  --nb-amber-bg:    #FFFBED;  --nb-amber-bd:  #F9E796;
  --nb-teal-fg:     #2B5D59;  --nb-teal-bg:     #F3FDFA;  --nb-teal-bd:   #AFF4E5;
  --nb-indigo-fg:   #4139C3;  --nb-indigo-bg:   #F4F4FE;  --nb-indigo-bd: #C9D2FB;
  --nb-violet-bg:   #F9F5FE;  --nb-violet-fg:   #6D3FC4;  --nb-violet-bd: #E4D5FA;
  --nb-slate-fg:    #394150;  --nb-slate-bg:    #F3F4F6;  --nb-slate-bd:  #E6E7EB;
  --nb-checkbox:    #3273F6;  /* accent-color kotak centang */
  --nb-avatar-blue: #3762E3;

  /* --- Latar halaman ---------------------------------------------------- */
  --nb-bg: linear-gradient(147deg,
              #F6E9EB 0%,      /* sudut kiri atas bernuansa mawar */
              #F7F8FA 26%,
              #FEFAFA 52%,     /* kabut merah tipis di sekitar konten */
              #F4F5F7 78%,
              #E8EAEF 100%);   /* sudut bawah lebih dingin */

  /* --- Tipografi -------------------------------------------------------- */
  --nb-font-head: 'Schibsted Grotesk', system-ui, sans-serif;
  --nb-font-body: 'Geist', system-ui, -apple-system, sans-serif;
  --nb-font-mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace;

  --nb-fs-display: 26px;  /* judul halaman */
  --nb-fs-metric:  26px;  /* angka KPI */
  --nb-fs-title:   17px;  /* judul kartu dan modal */
  --nb-fs-body:    14px;  /* teks utama, sel tabel, tombol */
  --nb-fs-sub:     13px;  /* baris kedua, deskripsi */
  --nb-fs-label:   12px;  /* header tabel, badge */
  --nb-fs-micro:   11px;  /* label KPI, peran pada log */

  /* --- Radius ----------------------------------------------------------- */
  --nb-r-sm:   8px;
  --nb-r-md:  10px;   /* tombol, input, select */
  --nb-r-lg:  12px;   /* tile ikon, panel dalam */
  --nb-r-xl:  16px;   /* kartu KPI, kartu tabel */
  --nb-r-2xl: 20px;   /* modal */
  --nb-r-pill: 999px;

  /* --- Elevasi ---------------------------------------------------------- */
  --nb-sh-card:  0 1px 2px rgba(16, 24, 40, .04);
  --nb-sh-raise: 0 1px 3px rgba(16, 24, 40, .08);
  --nb-sh-btn:   0 1px 2px rgba(176, 40, 30, .24);
  --nb-sh-modal: 0 24px 64px rgba(16, 24, 40, .18);

  /* --- Spasi ------------------------------------------------------------ */
  --nb-sp-1: 4px;  --nb-sp-2: 8px;  --nb-sp-3: 12px; --nb-sp-4: 16px;
  --nb-sp-5: 20px; --nb-sp-6: 24px; --nb-sp-8: 32px; --nb-sp-10: 40px;

  --nb-maxw: 1360px;
}

/* ==========================================================================
   DASAR
   ========================================================================== */

* { box-sizing: border-box; }

body.nb-app {
  margin: 0;
  min-height: 100vh;
  background: var(--nb-bg);
  background-attachment: fixed;
  font-family: var(--nb-font-body);
  font-size: var(--nb-fs-body);
  color: var(--nb-gray-900);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, .nb-head { font-family: var(--nb-font-head); letter-spacing: -.02em; }

.nb-container { max-width: var(--nb-maxw); margin: 0 auto; padding: 0 var(--nb-sp-6); }
.nb-mono { font-family: var(--nb-font-mono); font-size: var(--nb-fs-sub); color: var(--nb-gray-800); }
.nb-muted { color: var(--nb-gray-500); }

/* ==========================================================================
   APP BAR
   ========================================================================== */

.nb-appbar {
  display: flex; align-items: center; justify-content: space-between; gap: var(--nb-sp-6);
  padding: 14px var(--nb-sp-6);
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--nb-gray-200);
  position: sticky; top: 0; z-index: 40;
}
.nb-brand { display: flex; align-items: center; gap: var(--nb-sp-3); }
.nb-brand img { height: 30px; width: auto; display: block; }
.nb-brand-name { font-family: var(--nb-font-head); font-weight: 700; font-size: 17px; line-height: 1.2; }
.nb-brand-sub  { font-size: var(--nb-fs-sub); color: var(--nb-gray-500); line-height: 1.3; }

/* Navigasi pil */
.nb-nav { display: flex; gap: var(--nb-sp-1); padding: 5px; background: var(--nb-gray-150);
          border: 1px solid var(--nb-gray-200); border-radius: var(--nb-r-pill); }
.nb-nav-item {
  display: inline-flex; align-items: center; gap: var(--nb-sp-2);
  padding: 8px 16px; border-radius: var(--nb-r-pill);
  font-size: var(--nb-fs-body); font-weight: 500; color: var(--nb-gray-500);
  background: transparent; border: 1px solid transparent; cursor: pointer;
  text-decoration: none; white-space: nowrap; transition: background .15s, color .15s;
}
.nb-nav-item:hover { color: var(--nb-gray-800); background: rgba(255, 255, 255, .6); }
.nb-nav-item.is-active {
  background: var(--nb-white); color: var(--nb-red-700); font-weight: 600;
  border-color: var(--nb-red-200); box-shadow: var(--nb-sh-raise);
}
.nb-nav-item svg { width: 16px; height: 16px; }

/* Chip status koneksi */
.nb-chip {
  display: inline-flex; align-items: center; gap: var(--nb-sp-2);
  padding: 7px 14px; border-radius: var(--nb-r-pill);
  font-size: var(--nb-fs-sub); font-weight: 500;
  color: var(--nb-emerald-fg); background: var(--nb-emerald-bg); border: 1px solid var(--nb-emerald-bd);
}
.nb-chip svg { width: 15px; height: 15px; }

/* Avatar */
.nb-avatar {
  width: 36px; height: 36px; border-radius: var(--nb-r-pill);
  background: var(--nb-red-600); color: var(--nb-white);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: var(--nb-fs-body); flex: none;
}
.nb-avatar-lg { width: 56px; height: 56px; font-size: 18px;
                background: linear-gradient(140deg, #E1443A, #C22A1C); }
.nb-avatar-soft { background: var(--nb-blue-bg); color: var(--nb-avatar-blue); }
.nb-avatar-soft.is-rose { background: #FBE6E9; color: var(--nb-rose-600); }
.nb-avatar-soft.is-gray { background: var(--nb-gray-100); color: var(--nb-gray-500); }
.nb-avatar-sm { width: 28px; height: 28px; }
.nb-avatar-sm svg { width: 15px; height: 15px; }

/* Sakelar bahasa */

}

.nb-btn-outline:hover { background: var(--nb-gray-50); }

.nb-iconbtn {

  background: var(--nb-white); color: var(--nb-gray-500); cursor: pointer;
}

/* ==========================================================================

  background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; }

<script>
/* js/core/simpanan.js */
// Pembungkus penyimpanan sesi. Dipakai hanya untuk simulasi sesi, draft, dan audit prototipe.
// Kalau sessionStorage diblokir (mode privat, iframe terkunci), otomatis jatuh ke memori
// sehingga aplikasi tetap jalan, hanya kehilangan jejak saat berpindah halaman.
//
// Data HR sungguhan tidak boleh disimpan di sini. Lihat peringatan di store.js.
(function (global) {
  "use strict";
  var memo = {};
  var kunciDipakai = ["nb_mpp_user", "nb_mpp_audit"];

  function get(k) {
    try { var v = sessionStorage.getItem(k); return v === null ? (memo[k] || null) : v; }
    catch (e) { return memo[k] || null; }
  }
  function set(k, v) {
    memo[k] = v;
    try { sessionStorage.setItem(k, v); } catch (e) { /* memori saja */ }
  }
  function hapus(k) {
    delete memo[k];
    try { sessionStorage.removeItem(k); } catch (e) { /* memori saja */ }
  }
  function bersihkan() { kunciDipakai.forEach(hapus); }

  global.NBSimpanan = { get: get, set: set, hapus: hapus, bersihkan: bersihkan };
})(window);

</script>
<script>
/* js/core/format.js */
// Format lokal Indonesia. Satu-satunya tempat angka dan tanggal diformat.
// Aturan tetap: Rupiah tanpa desimal, pemisah ribuan titik, bulan bahasa Indonesia.
(function (global) {
  "use strict";

  var BULAN = ["Januari","Februari","Maret","April","Mei","Juni",
               "Juli","Agustus","September","Oktober","November","Desember"];
  var BULAN_PENDEK = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

  function angka(n) {
    if (n === null || n === undefined || isNaN(n)) return "-";
    return Math.round(n).toLocaleString("id-ID");
  }

  // Rupiah penuh: Rp27.000.000
  function rupiah(n) {
    if (n === null || n === undefined || isNaN(n)) return "-";
    return "Rp" + angka(n);
  }

  // Rupiah ringkas untuk kartu KPI: Rp27,0 jt / Rp1,2 M
  function rupiahRingkas(n) {
    if (n === null || n === undefined || isNaN(n)) return "-";
    var abs = Math.abs(n);
    if (abs >= 1e9) return "Rp" + (n / 1e9).toFixed(1).replace(".", ",") + " M";
    if (abs >= 1e6) return "Rp" + (n / 1e6).toFixed(1).replace(".", ",") + " jt";
    return rupiah(n);
  }

  function delta(n) {
    if (!n) return "0";
    return (n > 0 ? "+" : "") + angka(n);
  }

  // "2026-08-30" menjadi "30 Agustus 2026"
  function tanggal(iso) {
    if (!iso) return "-";
    var d = new Date(iso);
    if (isNaN(d)) return "-";
    return d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear();
  }

  // "2026-08-30" menjadi "30 Agu 2026"
  function tanggalPendek(iso) {
    if (!iso) return "-";
    var d = new Date(iso);
    if (isNaN(d)) return "-";
    return d.getDate() + " " + BULAN_PENDEK[d.getMonth()] + " " + d.getFullYear();
  }

  // Jam gaya log aplikasi: 13.35.37 WIB
  function jam(iso) {
    var d = iso ? new Date(iso) : new Date();
    var p = function (x) { return String(x).padStart(2, "0"); };
    return p(d.getHours()) + "." + p(d.getMinutes()) + "." + p(d.getSeconds()) + " WIB";
  }

  // Bulan efektif 1 sampai 12 (BR-01). Bulan 6 berarti berlaku Juni.
  function bulanNama(n) { return BULAN[n - 1] || "-"; }
  function bulanPendek(n) { return BULAN_PENDEK[n - 1] || "-"; }

  // Jumlah bulan biaya yang berlaku dalam satu tahun siklus (BR-E).
  // Efektif Juni berarti 7 bulan, bukan 12. Dipakai penuh di Modul 5.
  function bulanBerlaku(bulanEfektif) {
    var m = Number(bulanEfektif);
    if (!m || m < 1 || m > 12) return 0;
    return 13 - m;
  }

  global.NBFormat = {
    angka: angka, rupiah: rupiah, rupiahRingkas: rupiahRingkas, delta: delta,
    tanggal: tanggal, tanggalPendek: tanggalPendek, jam: jam,
    bulanNama: bulanNama, bulanPendek: bulanPendek, bulanBerlaku: bulanBerlaku,
    BULAN: BULAN, BULAN_PENDEK: BULAN_PENDEK
  };
})(window);

</script>

<script>
/* js/core/rbac.js */
// Kendali akses tiga sumbu: kapabilitas (RBAC), baris (row level), kolom biaya (column level).
// Referensi: bab 23. Prinsip yang tidak boleh dilanggar nomor 2 dan 3.
// Sumbu kolom biaya tidak tertulis di dokumen. Saya tambahkan karena tanpa itu,
// MPP Monitor dan HOD lintas departemen akan melihat nominal yang bukan haknya.
(function (global) {
  "use strict";

  // Kapabilitas diturunkan langsung dari matriks bab 23.
  var CAPS = {
    OD: ["cycle.create", "snapshot.upload", "view.own", "view.all", "plan.create", "plan.submit",
         "plan.review", "consolidate", "cost.view", "approved.distribute", "monitor.all",
         "audit.all", "admin", "dept.note.edit", "master.employee.edit",
         "cycle.manage", "snapshot.view"],
    HOD: ["view.own", "plan.create", "plan.submit", "plan.review.own", "cost.view.own",
          "monitor.own", "audit.own", "dept.note.edit"],
    CB: ["view.all", "cost.assumption", "cost.calculate", "cost.view", "review.support",
         "monitor.cost", "audit.relevant"],
    MANAGEMENT: ["view.all", "cost.view", "review.decide", "approve", "adjust.approved",
                 "monitor.company", "audit.relevant"],
    MONITOR: ["view.all", "monitor.all", "audit.all"]
  };

  var ROLE_LABEL = {
    OD: "Organization Development", HOD: "Head of Department",
    CB: "Compensation & Benefit", MANAGEMENT: "Management", MONITOR: "MPP Monitor"
  };

  function can(user, cap) {
    if (!user) return false;
    return (CAPS[user.role] || []).indexOf(cap) !== -1;
  }

  // Daftar department_id yang boleh dilihat pengguna. Ini satu-satunya sumber
  // kebenaran untuk penyaringan baris. Layar tidak boleh menyaring sendiri.
  function scopeDepartments(user, allDepartments) {
    if (!user) return [];
    if (user.scope.type === "ALL") return allDepartments.map(function (d) { return d.department_id; });
    if (user.scope.type === "DEPARTMENT") return user.scope.ids.slice();
    if (user.scope.type === "DIVISION") {
      return allDepartments.filter(function (d) { return user.scope.ids.indexOf(d.division_id) !== -1; })
                           .map(function (d) { return d.department_id; });
    }
    return [];
  }

  function inScope(user, allDepartments, departmentId) {
    return scopeDepartments(user, allDepartments).indexOf(departmentId) !== -1;
  }

  // Penyaring baris generik. Dipakai setiap kali data menyentuh layar.
  function filterRows(user, allDepartments, rows, key) {
    var izin = scopeDepartments(user, allDepartments);
    var k = key || "department_id";
    return rows.filter(function (r) { return izin.indexOf(r[k]) !== -1; });
  }

  // Kolom biaya. MPP Monitor tidak pernah melihat nominal.
  // HOD hanya melihat nominal departemennya sendiri.
  function canSeeCost(user, departmentId) {
    if (!user) return false;
    if (user.role === "MONITOR") return false;
    if (user.role === "HOD") {
      if (!departmentId) return false;
      return user.scope.ids.indexOf(departmentId) !== -1;
    }
    return can(user, "cost.view");
  }

  global.NBRbac = {
    can: can, scopeDepartments: scopeDepartments, inScope: inScope,
    filterRows: filterRows, canSeeCost: canSeeCost,
    roleLabel: function (r) { return ROLE_LABEL[r] || r; },
    caps: CAPS
  };
})(window);

</script>
<script>
/* js/core/audit.js */
// Audit log. Append only, tidak pernah diubah dan tidak pernah dihapus (BR-08).
// Perbedaan dengan Revision History (bab 47): audit mencatat siapa melakukan apa,
// revision mencatat data bergerak dari nilai apa ke nilai apa. Revision History
// dibangun di Modul 6 saat versioning masuk. Modul 0 sudah menyiapkan kolom before/after
// supaya tidak ada jalur perubahan data yang lolos tanpa jejak.
(function (global) {
  "use strict";

  var KUNCI = "nb_mpp_audit";
  var log = [];
  var seq = 0;

  // Audit prototipe bertahan antar halaman lewat penyimpanan sesi.
  // Kalau penyimpanan tidak tersedia, log hanya hidup selama satu halaman.
  (function muat() {
    try {
      var mentah = global.NBSimpanan ? NBSimpanan.get(KUNCI) : null;
      if (mentah) { log = JSON.parse(mentah); seq = log.length; }
    } catch (e) { log = []; seq = 0; }
  })();

  function simpan() {
    if (!global.NBSimpanan) return;
    try { NBSimpanan.set(KUNCI, JSON.stringify(log)); } catch (e) { /* abaikan */ }
  }

  var TIPE = {
    "USER_LOGIN":     { label: "User Login",     badge: "is-plain" },
    "USER_LOGOUT":    { label: "User Logout",    badge: "is-plain" },
    "DATA_VIEW":      { label: "Data View",      badge: "is-blue" },
    "DATA_EDIT":      { label: "Data Edit",      badge: "is-indigo" },
    "SCOPE_DENIED":   { label: "Access Denied",  badge: "is-red" },
    "SNAPSHOT_RELEASE": { label: "Snapshot Release", badge: "is-teal" },
    "CYCLE_CREATE":   { label: "Cycle Created", badge: "is-violet" },
    "CYCLE_STATUS":   { label: "Cycle Status",  badge: "is-amber" },
    "DATA_RESET":     { label: "Data Reset",    badge: "is-red" }
  };

  function tulis(actor, tipe, objectType, objectId, detail, before, after) {
    seq += 1;
    var entri = {
      audit_id: "AUD-" + String(seq).padStart(5, "0"),
      timestamp: new Date().toISOString(),
      actor_id: actor ? actor.user_id : "-",
      actor_email: actor ? actor.email : "-",
      actor_role: actor ? actor.role : "-",
      event_type: tipe,
      object_type: objectType || "-",
      object_id: objectId || "-",
      detail: detail || "",
      before: before === undefined ? null : before,
      after: after === undefined ? null : after,
      // Prototipe tidak punya IP nyata. Ditandai jelas supaya tidak dikira data riil.
      source: "prototipe-lokal"
    };
    log.push(entri);
    simpan();
    document.dispatchEvent(new CustomEvent("nb:audit", { detail: entri }));
    return entri;
  }

  function semua() { return log.slice().reverse(); }

  // Penyaringan audit mengikuti lingkup pengguna (bab 23: HOD hanya "own relevant").
  function untuk(user, departmentResolver) {
    if (!user) return [];
    if (user.role === "HOD") {
      return semua().filter(function (e) {
        if (e.actor_id === user.user_id) return true;
        var dep = departmentResolver ? departmentResolver(e) : null;
        return dep && user.scope.ids.indexOf(dep) !== -1;
      });
    }
    return semua();
  }

  function reset() {
    log = []; seq = 0;
    if (global.NBSimpanan) NBSimpanan.hapus(KUNCI);
  }

  global.NBAudit = { tulis: tulis, semua: semua, untuk: untuk, reset: reset, TIPE: TIPE };
})(window);

</script>
<script>
/* js/core/store.js */
// Store. Satu-satunya jalur data masuk dan keluar layar.
// Alasan lapisan ini ada: saat prototipe berpindah ke API sungguhan, hanya berkas ini
// yang diganti, layar dan aturan bisnis tidak ikut dibongkar.
//
// PERINGATAN KEAMANAN (dibaca saat produksi):
// Seluruh data di sini berada di sisi klien dan bisa dilihat siapa pun yang membuka
// developer tools. Data HR sungguhan TIDAK BOLEH diperlakukan seperti ini. Penyaringan
// lingkup di bawah adalah simulasi kontrol, bukan kontrol keamanan. Di produksi,
// penyaringan wajib terjadi di server sebelum data dikirim ke browser.
(function (global) {
  "use strict";

  var KUNCI_DB = "nb_mpp_db";
  var simpanan = global.NBSimpanan;
  var sesi = { user: null, mulai: null };
  var db = null;

  function salin(x) { return JSON.parse(JSON.stringify(x)); }

  // --- Muat basis data ----------------------------------------------------
  function muat() {
    var tersimpan = null;
    try {
      var mentah = simpanan.get(KUNCI_DB);
      if (mentah) tersimpan = JSON.parse(mentah);
    } catch (e) { tersimpan = null; }

    if (tersimpan) { db = tersimpan; return; }

    var D = global.NB_DATA || {};
    db = {
      entities: salin(D.entities || []),
      divisions: salin(D.divisions || []),
      departments: salin(D.departments || []),
      cost_centers: salin(D.cost_centers || []),
      grades: salin(D.grades || []),
      positions: salin(D.positions || []),
      employees: salin(D.employees || []),
      users: salin(D.users || []),
      vacancies: salin(D.vacancies || []),
      cycles: salin(D.cycles || []),
      snapshots: salin(D.snapshots || [])
    };
    // Baris snapshot historis dipasang sekali saat inisialisasi.
    db.snapshots.forEach(function (s) {
      if (s.snapshot_id === "SNAP-2026-V1" && !s.lines) {
        s.lines = salin(D.snapshot_lines_2026 || []);
        s.line_count = s.lines.length;
      }
    });
  }

  function simpan() {
    try { simpanan.set(KUNCI_DB, JSON.stringify(db)); } catch (e) { /* memori saja */ }
  }

  function reset() {
    if (!NBRbac.can(sesi.user, "admin")) return { ok: false, alasan: "Hanya OD yang boleh mereset data prototipe" };
    simpanan.hapus(KUNCI_DB);
    muat();
    if (global.NBAudit && NBAudit.reset) NBAudit.reset();
    NBAudit.tulis(sesi.user, "DATA_RESET", "Prototype", "-", "Mereset seluruh data prototipe ke kondisi awal");
    return { ok: true };
  }

  // --- Sesi ---------------------------------------------------------------
  function masuk(userId) {
    var u = (db.users || []).filter(function (x) { return x.user_id === userId; })[0];
    if (!u) return null;
    sesi.user = u;
    sesi.mulai = new Date().toISOString();
    simpanan.set("nb_mpp_user", userId);
    NBAudit.tulis(u, "USER_LOGIN", "Session", u.user_id,
      "Sesi simulasi dimulai sebagai " + NBRbac.roleLabel(u.role));
    return u;
  }

  function pulihkanSesi() {
    var id = simpanan.get("nb_mpp_user");
    if (!id) return null;
    var u = (db.users || []).filter(function (x) { return x.user_id === id; })[0];
    if (u) { sesi.user = u; sesi.mulai = new Date().toISOString(); }
    return u || null;
  }

  function keluar() {
    if (sesi.user) NBAudit.tulis(sesi.user, "USER_LOGOUT", "Session", sesi.user.user_id, "Sesi diakhiri");
    sesi.user = null;
    simpanan.hapus("nb_mpp_user");
  }

  function user() { return sesi.user; }

  // --- Master data --------------------------------------------------------
  // Pencari internal mengembalikan objek asli, hanya dipakai di dalam berkas ini.
  // Getter publik mengembalikan salinan, supaya layar tidak bisa menulis data
  // dengan cara mengubah objek hasil pembacaan dan melewati audit (BR-08).
  function _dep(id) { return db.departments.filter(function (d) { return d.department_id === id; })[0] || null; }
  function _kar(id) { return db.employees.filter(function (e) { return e.employee_id === id; })[0] || null; }
  function _pos(id) { return db.positions.filter(function (p) { return p.position_id === id; })[0] || null; }
  function _snap(id) { return db.snapshots.filter(function (s) { return s.snapshot_id === id; })[0] || null; }
  function _sik(id) { return db.cycles.filter(function (c) { return c.cycle_id === id; })[0] || null; }

  function semuaDepartemen() { return salin(db.departments); }
  function departemen(id) { var x = _dep(id); return x ? salin(x) : null; }
  function divisi(id) {
    var x = db.divisions.filter(function (d) { return d.division_id === id; })[0];
    return x ? salin(x) : null;
  }
  function grade(id) {
    var x = db.grades.filter(function (g) { return g.grade_id === id; })[0];
    return x ? salin(x) : null;
  }
  function semuaGrade() { return salin(db.grades); }
  function posisi(id) { var x = _pos(id); return x ? salin(x) : null; }
  function costCenter(id) {
    var x = db.cost_centers.filter(function (c) { return c.cost_center_id === id; })[0];
    return x ? salin(x) : null;
  }
  function karyawan(id) { var x = _kar(id); return x ? salin(x) : null; }
  // Pengguna aplikasi bukan karyawan. Dua entitas berbeda, jadi resolvernya juga berbeda.
  function semuaPengguna() { return salin(db.users); }
  function pengguna(id) {
    var x = db.users.filter(function (u) { return u.user_id === id; })[0];
    return x ? salin(x) : null;
  }

  // --- Data terikat lingkup pengguna --------------------------------------
  function departemenTerlihat() {
    var izin = NBRbac.scopeDepartments(sesi.user, semuaDepartemen());
    return semuaDepartemen().filter(function (d) { return izin.indexOf(d.department_id) !== -1; });
  }

  function karyawanTerlihat(filter) {
    var f = filter || {};
    var baris = NBRbac.filterRows(sesi.user, db.departments, salin(db.employees), "department_id");
    if (f.department_id) baris = baris.filter(function (e) { return e.department_id === f.department_id; });
    if (f.q) {
      var q = f.q.toLowerCase();
      baris = baris.filter(function (e) {
        var p = posisi(e.position_id);
        return e.name.toLowerCase().indexOf(q) !== -1 ||
               e.employee_id.toLowerCase().indexOf(q) !== -1 ||
               (p && p.title.toLowerCase().indexOf(q) !== -1);
      });
    }
    return baris;
  }

  function posisiTerlihat() {
    return NBRbac.filterRows(sesi.user, db.departments, salin(db.positions), "department_id");
  }

  function vacancyTerlihat() {
    return NBRbac.filterRows(sesi.user, db.departments, salin(db.vacancies), "department_id");
  }

  // --- Siklus MPP (FR-01) -------------------------------------------------
  function semuaSiklus() {
    return salin(db.cycles).sort(function (a, b) { return b.year - a.year; });
  }
  function siklus(id) { var x = _sik(id); return x ? salin(x) : null; }

  // Siklus perencanaan aktif. Urutan prioritas: yang sedang berjalan lebih dulu,
  // lalu tahun terdekat. Tanpa aturan ini, membuat siklus tahun jauh di depan akan
  // merebut penanda siklus aktif dari siklus yang sedang dikerjakan.
  var URUT_STATUS = { OPEN: 0, LOCKED: 1, DRAFT: 2 };
  function siklusAktif() {
    var kandidat = db.cycles.filter(function (c) { return c.status !== "CLOSED"; })
      .sort(function (a, b) {
        var sa = URUT_STATUS[a.status], sb = URUT_STATUS[b.status];
        if (sa !== sb) return sa - sb;
        return a.year - b.year;
      });
    if (kandidat.length) return salin(kandidat[0]);
    return semuaSiklus()[0] || null;
  }

  function bolehUbahSiklus(c) {
    // BR-09: siklus tertutup hanya bisa dibaca.
    if (!c) return { ok: false, alasan: "Siklus tidak ditemukan" };
    if (c.status === "CLOSED") return { ok: false, alasan: "Siklus sudah ditutup dan bersifat read only (BR-09)" };
    return { ok: true };
  }

  function buatSiklus(data) {
    if (!NBRbac.can(sesi.user, "cycle.create")) {
      NBAudit.tulis(sesi.user, "SCOPE_DENIED", "MPPCycle", data.year, "Peran tidak berhak membuat siklus");
      return { ok: false, alasan: "Hanya OD yang boleh membuat siklus" };
    }
    var tahun = Number(data.year);
    if (!tahun || tahun < 2020 || tahun > 2100) return { ok: false, alasan: "Tahun siklus tidak masuk akal" };
    if (db.cycles.filter(function (c) { return c.year === tahun; }).length) {
      return { ok: false, alasan: "Siklus tahun " + data.year + " sudah ada" };
    }
    if (!data.start_date || !data.end_date || !data.submission_deadline) {
      return { ok: false, alasan: "Tanggal mulai, selesai, dan batas pengumpulan wajib diisi" };
    }
    if (data.end_date <= data.start_date) {
      return { ok: false, alasan: "Tanggal selesai harus setelah tanggal mulai" };
    }
    if (data.submission_deadline < data.start_date || data.submission_deadline > data.end_date) {
      return { ok: false, alasan: "Batas pengumpulan harus berada di dalam periode siklus" };
    }
    var c = {
      cycle_id: "MPP-" + data.year,
      year: Number(data.year),
      name: data.name || ("MPP " + data.year),
      start_date: data.start_date,
      end_date: data.end_date,
      submission_deadline: data.submission_deadline,
      status: "DRAFT",
      version: 1,
      created_by: sesi.user.user_id,
      created_at: new Date().toISOString(),
      closed_by: null, closed_at: null, reopen_reason: null, note: ""
    };
    db.cycles.push(c); simpan();
    NBAudit.tulis(sesi.user, "CYCLE_CREATE", "MPPCycle", c.cycle_id,
      "Membuat siklus " + c.name + ", batas pengumpulan " + NBFormat.tanggal(c.submission_deadline));
    return { ok: true, siklus: c };
  }

  // Transisi status yang diizinkan. Jalur mundur hanya lewat buka ulang dengan alasan.
  var TRANSISI = {
    DRAFT:  ["OPEN"],
    OPEN:   ["LOCKED", "CLOSED"],
    LOCKED: ["OPEN", "CLOSED"],
    CLOSED: ["OPEN"]
  };

  function ubahStatusSiklus(cycleId, statusBaru, alasan) {
    var c = _sik(cycleId);
    if (!c) return { ok: false, alasan: "Siklus tidak ditemukan" };
    if (!NBRbac.can(sesi.user, "cycle.create")) {
      NBAudit.tulis(sesi.user, "SCOPE_DENIED", "MPPCycle", cycleId, "Peran tidak berhak mengubah status siklus");
      return { ok: false, alasan: "Hanya OD yang boleh mengubah status siklus" };
    }
    if ((TRANSISI[c.status] || []).indexOf(statusBaru) === -1) {
      return { ok: false, alasan: "Transisi " + c.status + " ke " + statusBaru + " tidak diizinkan" };
    }
    // Buka ulang siklus tertutup menaikkan versi siklus. Alokasi lama tetap berlaku
    // sampai versi baru disetujui. Lihat catatan gap nomor 8 pada fase perencanaan.
    if (c.status === "CLOSED" && statusBaru === "OPEN") {
      if (!alasan) return { ok: false, alasan: "Buka ulang wajib menyertakan alasan" };
      c.version += 1;
      c.reopen_reason = alasan;
      c.closed_by = null; c.closed_at = null;
    }
    if (statusBaru === "CLOSED") {
      c.closed_by = sesi.user.user_id;
      c.closed_at = new Date().toISOString();
    }
    var sebelum = c.status;
    c.status = statusBaru;
    simpan();
    NBAudit.tulis(sesi.user, "CYCLE_STATUS", "MPPCycle", c.cycle_id,
      "Status siklus " + c.name + " berubah" + (alasan ? ". Alasan: " + alasan : ""), sebelum, statusBaru);
    return { ok: true, siklus: c };
  }

  // --- Snapshot struktur organisasi (FR-02) -------------------------------
  // Ringkasan snapshot tanpa baris detail, supaya daftar tidak menyalin ribuan baris.
  function _ringkas(s) {
    var r = {};
    Object.keys(s).forEach(function (k) { if (k !== "lines") r[k] = s[k]; });
    r.line_count = s.line_count !== undefined ? s.line_count : (s.lines || []).length;
    return r;
  }
  function snapshotSiklus(cycleId) {
    return db.snapshots.filter(function (s) { return s.cycle_id === cycleId; })
                       .sort(function (a, b) { return b.version - a.version; })
                       .map(_ringkas);
  }
  function snapshot(id) { var x = _snap(id); return x ? salin(x) : null; }

  // Jumlah baris snapshot yang benar-benar boleh dilihat pengguna.
  // Tanpa ini, angka Current di dashboard membocorkan headcount seluruh perusahaan
  // kepada HOD yang lingkupnya hanya satu departemen (prinsip akses nomor 2).
  function snapshotBarisTerlihat(snapshotId) {
    var s = _snap(snapshotId);
    if (!s || !s.lines) return [];
    return NBRbac.filterRows(sesi.user, db.departments, salin(s.lines), "department_id");
  }

  function snapshotAktif(cycleId) {
    return snapshotSiklus(cycleId).filter(function (s) { return s.status === "RELEASED"; })[0] || null;
  }

  // Rilis snapshot menyalin keadaan master saat ini menjadi baris beku.
  // Setelah dirilis, baris ini tidak pernah diubah lagi walaupun master berubah.
  // Inilah state Current dalam rantai Current, Proposed, Approved, Actual.
  function rilisSnapshot(cycleId, effectiveDate) {
    var c = _sik(cycleId);
    var jaga = bolehUbahSiklus(c);
    if (!jaga.ok) return jaga;
    if (!NBRbac.can(sesi.user, "snapshot.upload")) {
      NBAudit.tulis(sesi.user, "SCOPE_DENIED", "OrgSnapshot", cycleId, "Peran tidak berhak merilis snapshot");
      return { ok: false, alasan: "Hanya OD yang boleh merilis snapshot" };
    }
    if (!effectiveDate) return { ok: false, alasan: "Tanggal berlaku snapshot wajib diisi" };

    var versi = snapshotSiklus(cycleId).length + 1;
    var lines = db.employees.map(function (e) {
      var p = _pos(e.position_id);
      return {
        line_id: "SNL" + String(c.year).slice(2) + "-" + e.employee_id,
        employee_id: e.employee_id,
        employee_name: e.name,
        position_id: e.position_id,
        position_title: p ? p.title : "-",
        department_id: e.department_id,
        division_id: e.division_id,
        entity_id: e.entity_id,
        cost_center_id: e.cost_center_id,
        grade_id: e.grade_id,
        employment_status: e.employment_status,
        vacancy_flag: false,
        current_hc: 1
      };
    });

    var s = {
      snapshot_id: "SNAP-" + c.year + "-V" + versi,
      cycle_id: cycleId,
      version: versi,
      effective_date: effectiveDate,
      status: "RELEASED",
      released_by: sesi.user.user_id,
      released_at: new Date().toISOString(),
      source: "Salinan master organisasi dalam aplikasi",
      lines: salin(lines),
      line_count: lines.length,
      vacancy_ids: db.vacancies.filter(function (v) { return v.status === "Open"; })
                               .map(function (v) { return v.vacancy_id; }),
      note: ""
    };
    db.snapshots.push(s);
    simpan();
    NBAudit.tulis(sesi.user, "SNAPSHOT_RELEASE", "OrgSnapshot", s.snapshot_id,
      "Merilis snapshot " + s.snapshot_id + " berisi " + lines.length + " baris karyawan dan " +
      s.vacancy_ids.length + " vacancy, berlaku " + NBFormat.tanggal(effectiveDate));
    return { ok: true, snapshot: s };
  }

  // Perbandingan snapshot terhadap master hari ini. Dipakai untuk membuktikan
  // snapshot benar-benar beku, dan nanti menjadi dasar analisis Current versus Actual.
  function bandingkanSnapshot(snapshotId) {
    var s = _snap(snapshotId);
    if (!s || !s.lines) return [];
    var beda = [];
    s.lines.forEach(function (l) {
      var e = _kar(l.employee_id);
      if (!e) {
        beda.push({ employee_id: l.employee_id, nama: l.employee_name, field: "keberadaan",
                    snapshot: "ada", master: "tidak ada" });
        return;
      }
      ["grade_id", "department_id", "position_id", "employment_status"].forEach(function (f) {
        if (e[f] !== l[f]) {
          beda.push({ employee_id: l.employee_id, nama: l.employee_name, field: f,
                      snapshot: l[f], master: e[f] });
        }
      });
    });
    var idSnap = s.lines.map(function (l) { return l.employee_id; });
    db.employees.forEach(function (e) {
      if (idSnap.indexOf(e.employee_id) === -1) {
        beda.push({ employee_id: e.employee_id, nama: e.name, field: "keberadaan",
                    snapshot: "tidak ada", master: "ada" });
      }
    });
    return beda;
  }

  // --- Perubahan data master ---------------------------------------------
  // Tidak ada jalur tulis lain. Setiap perubahan wajib lewat sini supaya
  // audit tidak bisa dilewati (BR-08).
  function ubah(objectType, objectId, field, nilaiBaru, opsi) {
    var o = opsi || {};
    var target = null;
    if (objectType === "Department") target = _dep(objectId);
    if (objectType === "Employee") target = _kar(objectId);
    if (!target) return { ok: false, alasan: "Objek tidak ditemukan" };

    var deptTarget = objectType === "Department" ? objectId : target.department_id;
    if (!NBRbac.inScope(sesi.user, semuaDepartemen(), deptTarget)) {
      NBAudit.tulis(sesi.user, "SCOPE_DENIED", objectType, objectId,
        "Percobaan mengubah data di luar lingkup akses");
      return { ok: false, alasan: "Di luar lingkup akses Anda" };
    }
    if (!NBRbac.can(sesi.user, o.capability || "dept.note.edit")) {
      NBAudit.tulis(sesi.user, "SCOPE_DENIED", objectType, objectId,
        "Peran tidak memiliki kapabilitas " + (o.capability || "dept.note.edit"));
      return { ok: false, alasan: "Peran Anda tidak berhak melakukan ini" };
    }

    var sebelum = target[field];
    if (sebelum === nilaiBaru) return { ok: true, tidakBerubah: true };
    target[field] = nilaiBaru;
    simpan();
    NBAudit.tulis(sesi.user, "DATA_EDIT", objectType, objectId,
      (o.detail || ("Mengubah " + field)) + (o.reason ? ". Alasan: " + o.reason : ""),
      sebelum, nilaiBaru);
    return { ok: true, sebelum: sebelum, sesudah: nilaiBaru };
  }

  function departemenDariAudit(entri) {
    if (entri.object_type === "Department") return entri.object_id;
    if (entri.object_type === "Employee") {
      var e = _kar(entri.object_id);
      return e ? e.department_id : null;
    }
    return null;
  }

  muat();

  global.NBStore = {
    masuk: masuk, keluar: keluar, user: user, pulihkanSesi: pulihkanSesi, reset: reset,
    semuaDepartemen: semuaDepartemen, departemenTerlihat: departemenTerlihat,
    departemen: departemen, divisi: divisi, grade: grade, semuaGrade: semuaGrade,
    posisi: posisi, costCenter: costCenter, karyawan: karyawan, pengguna: pengguna, semuaPengguna: semuaPengguna,
    karyawanTerlihat: karyawanTerlihat, posisiTerlihat: posisiTerlihat, vacancyTerlihat: vacancyTerlihat,
    semuaSiklus: semuaSiklus, siklus: siklus, siklusAktif: siklusAktif, bolehUbahSiklus: bolehUbahSiklus,
    buatSiklus: buatSiklus, ubahStatusSiklus: ubahStatusSiklus,
    snapshotSiklus: snapshotSiklus, snapshot: snapshot, snapshotAktif: snapshotAktif,
    rilisSnapshot: rilisSnapshot, bandingkanSnapshot: bandingkanSnapshot,
    snapshotBarisTerlihat: snapshotBarisTerlihat,
    ubah: ubah, departemenDariAudit: departemenDariAudit
  };
})(window);

</script>

<script>
/* js/pages/login.js */
// Pemilih persona. Sebelumnya berupa halaman terpisah, sekarang menjadi modul di dalam shell
// supaya aplikasi hanya punya satu titik masuk. Satu berkas HTML berarti satu kemungkinan gagal
// saat deploy, bukan dua.
(function (global) {
  "use strict";

  function render() {
    var deps = NBStore.semuaDepartemen();
    var kartu = NBStore.semuaPengguna().map(function (u) {
      var lingkup = u.scope.type === "ALL"
        ? "Seluruh departemen"
        : u.scope.ids.map(function (id) {
            var d = deps.filter(function (x) { return x.department_id === id; })[0];
            return d ? d.name : id;
          }).join(", ");
      var jml = NBRbac.scopeDepartments(u, deps).length;

      return "<button class='nb-card nb-card-pad persona' data-user='" + u.user_id + "' " +
        "style='text-align:left;cursor:pointer;font-family:inherit'>" +
        "<div style='display:flex;align-items:center;gap:12px;margin-bottom:12px'>" +
          "<span class='nb-avatar'>" + NBUi.esc(u.name.charAt(0)) + "</span><div>" +
          "<div style='font-weight:600'>" + NBUi.esc(u.name) + "</div>" +
          "<div class='nb-mono' style='font-size:12px;color:var(--nb-gray-500)'>" + NBUi.esc(u.email) + "</div>" +
        "</div></div>" +
        "<div style='margin-bottom:8px'>" + NBUi.badge(NBRbac.roleLabel(u.role), "is-plain") + "</div>" +
        "<div class='nb-cell-sub'>" + NBUi.esc(u.title) + "<br>Lingkup: " + NBUi.esc(lingkup) +
        " (" + jml + " departemen)</div></button>";
    }).join("");

    return "" +
      "<div class='nb-pagehead'><div>" +
        "<h1 data-i18n='login.judul'>Masuk sebagai persona</h1>" +
        "<p data-i18n='login.sub'>Prototipe tanpa autentikasi. Pilih peran untuk melihat perbedaan hak akses dan lingkup data.</p>" +
      "</div></div>" +
      "<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px'>" +
        kartu + "</div>" +
      "<div style='margin-top:28px;padding:16px 18px;border-radius:var(--nb-r-lg);" +
        "background:var(--nb-amber-bg);border:1px solid var(--nb-amber-bd);color:var(--nb-amber-fg);" +
        "font-size:13px;line-height:1.6'>" +
        "<b>Batas prototipe.</b> Tidak ada kata sandi, tidak ada server, dan seluruh data karyawan di sini fiktif. " +
        "Penyaringan lingkup akses berjalan di browser sehingga hanya berfungsi sebagai simulasi kontrol, " +
        "bukan kontrol keamanan. Versi produksi wajib memakai SSO korporat dan menyaring data di sisi server." +
      "</div>";
  }

  function mount() {
    document.querySelectorAll("button[data-user]").forEach(function (b) {
      b.onclick = function () {
        NBStore.masuk(b.dataset.user);
        location.hash = "#dashboard";
        NBApp.ulang();
      };
    });
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.login = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/dashboard.js */
// Layar 1 dari inventaris bab 25. Modul 0 hanya menampilkan yang benar-benar ada datanya.
// KPI siklus MPP sengaja dikosongkan sampai Modul 1, bukan diisi angka contoh (prinsip 5).
(function (global) {
  "use strict";

  // Ringkasan siklus dan snapshot. Angka Proposed, Approved, dan Actual sengaja belum ada,
  // karena baru terbentuk mulai Modul 2. Layar tidak menampilkan angka tebakan (prinsip 5).
  function kartuSiklus() {
    var c = NBStore.siklusAktif();
    if (!c) return "<div class='nb-card'>" + NBUi.kosong("Belum ada siklus MPP", "OD belum membuat siklus perencanaan.") + "</div>";
    var snap = NBStore.snapshotAktif(c.cycle_id);
    var st = { DRAFT: ["Draft", "is-plain"], OPEN: ["Terbuka", "is-blue"],
               LOCKED: ["Pengumpulan ditutup", "is-amber"], CLOSED: ["Ditutup", "is-emerald"] }[c.status] || [c.status, ""];

    var terlihat = snap ? NBStore.snapshotBarisTerlihat(snap.snapshot_id).length : 0;
    var seluruh = snap ? snap.line_count : 0;
    var catatanCurrent = snap
      ? "Snapshot " + snap.snapshot_id + (terlihat < seluruh ? ", terbatas pada lingkup Anda" : "")
      : "Snapshot belum dirilis";

    var rantai = [
      ["Current", snap ? NBFormat.angka(terlihat) + " HC" : "Belum ada", snap ? "is-blue" : "is-plain",
       catatanCurrent],
      ["Proposed", "Belum ada", "is-plain", "Terbentuk saat departemen menyusun usulan (Modul 2)"],
      ["Approved", "Belum ada", "is-plain", "Terbentuk setelah keputusan manajemen (Modul 6)"],
      ["Actual", "Belum ada", "is-plain", "Terbentuk saat realisasi dicatat (Modul 8)"]
    ];

    return "<div class='nb-card nb-card-pad'>" +
      "<div class='nb-card-head'>" + NBUi.svg("layers") + "<div>" +
        "<h3>Rantai state " + NBUi.esc(c.name) + " " + NBUi.badge(st[0], st[1]) + "</h3>" +
        "<p>Empat state berdiri sendiri dan tidak saling menimpa. Selisih di antaranya adalah inti nilai aplikasi ini.</p>" +
      "</div></div>" +
      "<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px'>" +
      rantai.map(function (r) {
        return "<div class='nb-setting' style='display:block;margin:0'>" +
          "<div class='nb-kpi-label'>" + r[0] + "</div>" +
          "<div style='font-weight:600;margin:6px 0'>" + r[1] + "</div>" +
          "<div class='nb-setting-desc'>" + NBUi.esc(r[3]) + "</div></div>";
      }).join("") + "</div></div>";
  }

  function render() {
    var u = NBStore.user();
    var karyawan = NBStore.karyawanTerlihat();
    var deps = NBStore.departemenTerlihat();
    var pos = NBStore.posisiTerlihat();
    var tetap = karyawan.filter(function (e) { return e.employment_status === "Tetap"; }).length;

    var kpi =
      NBUi.kpi("Karyawan dalam lingkup", NBFormat.angka(karyawan.length), "users", "") +
      NBUi.kpi("Departemen", NBFormat.angka(deps.length), "building", "is-blue") +
      NBUi.kpi("Posisi terdaftar", NBFormat.angka(pos.length), "briefcase", "is-teal") +
      NBUi.kpi("Karyawan tetap", NBFormat.angka(tetap), "check", "is-emerald",
               karyawan.length ? Math.round(tetap / karyawan.length * 100) + " persen dari lingkup" : "");

    // Ringkasan headcount per departemen. Kolom biaya sengaja belum diisi,
    // karena Cost Assumption baru masuk di Modul 5 (BR-11, larangan hardcode biaya).
    var baris = deps.map(function (d) {
      var isi = karyawan.filter(function (e) { return e.department_id === d.department_id; });
      var div = NBStore.divisi(d.division_id);
      var bolehBiaya = NBRbac.canSeeCost(u, d.department_id);
      return "<tr><td><div class='nb-cell-title'>" + NBUi.esc(d.name) + "</div>" +
             "<div class='nb-cell-sub'>" + NBUi.esc(div ? div.name : "-") + "</div></td>" +
             "<td class='nb-mono'>" + NBUi.esc(d.cost_center_id) + "</td>" +
             "<td class='nb-num'>" + NBFormat.angka(isi.length) + "</td>" +
             "<td class='nb-num nb-muted'>" +
               (bolehBiaya ? "<span data-i18n='umum.belumDihitung'>Belum dihitung</span>"
                           : NBUi.svg("lock", "") ) + "</td></tr>";
    }).join("");

    return '' +
    '<div class="nb-pagehead"><div>' +
      '<h1 data-i18n="dash.judul">Dashboard</h1>' +
      '<p data-i18n="dash.sub">Ringkasan sesuai peran dan lingkup akses Anda.</p>' +
    "</div>" +
      '<span class="nb-badge is-plain">' + NBUi.esc(NBRbac.roleLabel(u.role)) + "</span>" +
    "</div>" +

    '<div class="nb-kpigrid">' + kpi + "</div>" +

    '<div class="nb-card" style="margin-bottom:24px">' +
      '<div class="nb-toolbar"><div><div style="font-weight:600">Headcount berjalan per departemen</div>' +
      '<div class="nb-cell-sub">Sumber: data master organisasi, bukan usulan MPP.</div></div></div>' +
      '<div class="nb-tablewrap"><table class="nb-table">' +
        "<thead><tr><th>Departemen</th><th>Cost Center</th><th class='nb-num'>Current HC</th>" +
        "<th class='nb-num'>People Cost</th></tr></thead><tbody>" + baris + "</tbody></table></div>" +
    "</div>" +

    kartuSiklus();
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.dashboard = { render: render };
})(window);

</script>
<script>
/* js/pages/organisasi.js */
// Layar 2 dari inventaris bab 25 (My Department diperluas menjadi Data Organisasi).
// Membuktikan tiga sumbu akses sekaligus: kapabilitas, baris, dan kolom biaya.
(function (global) {
  "use strict";

  var state = { department_id: "", q: "" };

  function barisKaryawan(u, list) {
    var kolom = NBRbac.can(u, "master.employee.edit") ? 7 : 6;
    if (!list.length) return "<tr><td colspan='" + kolom + "'>" +
      NBUi.kosong("Tidak ada karyawan yang cocok", "Ubah kata kunci atau filter departemen.") + "</td></tr>";

    return list.map(function (e) {
      var p = NBStore.posisi(e.position_id);
      var d = NBStore.departemen(e.department_id);
      var g = NBStore.grade(e.grade_id);
      var bolehBiaya = NBRbac.canSeeCost(u, e.department_id);
      var rentang = bolehBiaya
        ? "<span class='nb-mono'>" + NBFormat.rupiahRingkas(g.min) + " sampai " + NBFormat.rupiahRingkas(g.max) + "</span>"
        : "<span class='nb-muted'>" + NBUi.svg("lock") + "</span>";

      return "<tr>" +
        "<td><span class='nb-code'>" + NBUi.esc(e.employee_id) + "</span></td>" +
        "<td><div class='nb-cell-person'><span class='nb-avatar nb-avatar-sm nb-avatar-soft'>" +
            NBUi.esc(e.name.charAt(0)) + "</span><div>" +
            "<div class='nb-cell-title'>" + NBUi.esc(e.name) + "</div>" +
            "<div class='nb-cell-sub'>" + NBUi.esc(p ? p.title : "-") + "</div></div></div></td>" +
        "<td>" + NBUi.esc(d ? d.name : "-") +
            "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(e.cost_center_id) + "</div></td>" +
        "<td>" + NBUi.badge(e.grade_id, "is-plain") +
            "<div class='nb-cell-sub'>" + NBUi.esc(g ? g.label : "") + "</div></td>" +
        "<td>" + NBUi.badge(e.employment_status, e.employment_status === "Tetap" ? "is-emerald" : "is-amber") + "</td>" +
        "<td class='nb-num'>" + rentang + "</td>" +
        (NBRbac.can(u, "master.employee.edit")
          ? "<td class='nb-num'><button class='nb-btn nb-btn-outline' data-edit='" + e.employee_id + "'>Ubah</button></td>"
          : "") +
      "</tr>";
    }).join("");
  }

  function panelCatatan(u) {
    // Hanya pemilik departemen dan OD yang boleh mengubah (kapabilitas dept.note.edit).
    if (!NBRbac.can(u, "dept.note.edit")) return "";
    var deps = NBStore.departemenTerlihat();
    if (!deps.length) return "";
    var pilihan = deps.map(function (d) {
      return "<option value='" + d.department_id + "'>" + NBUi.esc(d.name) + "</option>";
    }).join("");

    return '<div class="nb-card nb-card-pad" style="margin-bottom:24px">' +
      '<div class="nb-card-head">' + NBUi.svg("save") + "<div>" +
        '<h3 data-i18n="org.catatan">Catatan departemen</h3>' +
        '<p data-i18n="org.catatanSub">Catatan bebas milik pemilik departemen. Setiap perubahan tercatat di audit.</p>' +
      "</div></div>" +
      '<div class="nb-setting">' +
        "<div style='flex:1'>" +
          "<div class='nb-setting-label'>Departemen</div>" +
          "<select class='nb-select' id='noteDept' style='margin-top:8px;width:100%'>" + pilihan + "</select>" +
          "<textarea class='nb-input' id='noteText' rows='3' style='margin-top:12px;resize:vertical' " +
            "placeholder='Contoh: fokus 2027 pada penguatan tim digital.'></textarea>" +
        "</div>" +
      "</div>" +
      '<div class="nb-formfoot"><button class="nb-btn nb-btn-primary" id="noteSave">' +
        NBUi.svg("save") + "<span data-i18n='aksi.simpan'>Simpan</span></button></div>" +
    "</div>";
  }

  // Perubahan master mensimulasikan koreksi data dari HRIS di tengah tahun.
  // Snapshot yang sudah dirilis tidak boleh ikut berubah (FR-02, state separation bab 5.2).
  function modalEdit() {
    return "<div class='nb-overlay' id='mEdit' hidden><div class='nb-modal' style='max-width:560px'>" +
      "<div class='nb-modal-head'><div class='nb-modal-id'>" +
        "<span class='nb-avatar nb-avatar-lg' id='mAvatar'></span><div>" +
        "<div class='nb-modal-title'><h2 id='mNama'></h2></div>" +
        "<div class='nb-metachips'><span class='nb-metachip is-code' id='mNik'></span>" +
        "<span class='nb-metachip' id='mPosisi'></span></div></div></div>" +
        "<button class='nb-iconbtn' data-tutup='1'>&times;</button></div>" +
      "<div class='nb-modal-body'><div class='nb-section'>" +
        "<div class='nb-section-head'><span class='nb-roman'>I</span><h4>Koreksi data master</h4></div>" +
        "<div class='nb-fields'>" +
          "<div><div class='nb-field-label'>Grade</div><select class='nb-select' id='mGrade'></select></div>" +
          "<div><div class='nb-field-label'>Departemen</div><select class='nb-select' id='mDept'></select></div>" +
        "</div>" +
        "<div style='margin-top:16px'><div class='nb-field-label'>Alasan koreksi</div>" +
        "<input class='nb-input' id='mAlasan' placeholder='Contoh: koreksi data dari HRIS'></div>" +
        "<p class='nb-cell-sub' style='margin-top:12px'>Perubahan ini hanya mengubah data master hari ini. " +
        "Snapshot yang sudah dirilis tetap menyimpan nilai lama.</p>" +
      "</div></div>" +
      "<div class='nb-modal-foot'><button class='nb-btn nb-btn-quiet' data-tutup='1'>Batal</button>" +
      "<div class='nb-group'><button class='nb-btn nb-btn-primary' id='mSimpan'>Simpan koreksi</button></div></div>" +
    "</div></div>";
  }

  function render() {
    var u = NBStore.user();
    var deps = NBStore.departemenTerlihat();
    var list = NBStore.karyawanTerlihat(state);

    var opsiDept = "<option value=''>" + NBi18n.t("umum.semua") + "</option>" +
      deps.map(function (d) {
        return "<option value='" + d.department_id + "'" +
               (state.department_id === d.department_id ? " selected" : "") + ">" +
               NBUi.esc(d.name) + "</option>";
      }).join("");

    return '' +
    '<div class="nb-pagehead"><div>' +
      '<h1 data-i18n="org.judul">Data Organisasi</h1>' +
      '<p data-i18n="org.sub">Struktur karyawan berjalan. Sumber data master, belum ada usulan MPP di sini.</p>' +
    "</div>" +
      '<span class="nb-badge is-plain">' + NBFormat.angka(list.length) + " baris dalam lingkup Anda</span>" +
    "</div>" +

    panelCatatan(u) +

    '<div class="nb-card">' +
      '<div class="nb-toolbar">' +
        "<div style='display:flex;gap:12px;align-items:center'>" +
          "<select class='nb-select' id='fDept' style='width:240px'>" + opsiDept + "</select>" +
        "</div>" +
        '<label class="nb-search">' + NBUi.svg("search") +
          "<input class='nb-input' id='fQ' value='" + NBUi.esc(state.q) + "' placeholder='Cari nama, NIK, posisi'></label>" +
      "</div>" +
      '<div class="nb-tablewrap"><table class="nb-table"><thead><tr>' +
        "<th>NIK</th><th>Karyawan</th><th>Departemen</th><th>Grade</th><th>Status</th>" +
        "<th class='nb-num'>Rentang Gaji Grade</th>" +
        (NBRbac.can(u, "master.employee.edit") ? "<th class='nb-num'>Aksi</th>" : "") +
      "</tr></thead><tbody>" + barisKaryawan(u, list) + "</tbody></table></div>" +
    "</div>" +
    (NBRbac.can(u, "master.employee.edit") ? modalEdit() : "");
  }

  function mount() {
    var u = NBStore.user();

    var fd = document.getElementById("fDept");
    if (fd) fd.onchange = function () { state.department_id = this.value; NBApp.ulang(); };

    var fq = document.getElementById("fQ");
    if (fq) {
      fq.oninput = function () {
        state.q = this.value;
        var tbody = document.querySelector(".nb-table tbody");
        if (tbody) tbody.innerHTML = barisKaryawan(u, NBStore.karyawanTerlihat(state));
      };
    }

    var sel = document.getElementById("noteDept");
    var txt = document.getElementById("noteText");
    if (sel && txt) {
      var muat = function () {
        var d = NBStore.departemen(sel.value);
        txt.value = d ? (d.note || "") : "";
      };
      sel.onchange = muat; muat();

      document.getElementById("noteSave").onclick = function () {
        var hasil = NBStore.ubah("Department", sel.value, "note", txt.value.trim(), {
          capability: "dept.note.edit",
          detail: "Mengubah catatan departemen " + (NBStore.departemen(sel.value) || {}).name
        });
        if (!hasil.ok) { NBUi.toast(hasil.alasan, "error"); return; }
        if (hasil.tidakBerubah) { NBUi.toast("Tidak ada perubahan"); return; }
        NBUi.toast("Tersimpan dan tercatat di audit");
      };
    }

    pasangEdit();
  }

  function pasangEdit() {
    var modal = document.getElementById("mEdit");
    if (!modal) return;
    var aktif = null;

    function buka(id) {
      aktif = NBStore.karyawan(id);
      if (!aktif) return;
      var p = NBStore.posisi(aktif.position_id);
      document.getElementById("mAvatar").textContent = aktif.name.charAt(0);
      document.getElementById("mNama").textContent = aktif.name;
      document.getElementById("mNik").textContent = "# " + aktif.employee_id;
      document.getElementById("mPosisi").textContent = p ? p.title : "-";
      document.getElementById("mGrade").innerHTML = NBStore.semuaGrade().map(function (g) {
        return "<option value='" + g.grade_id + "'" + (g.grade_id === aktif.grade_id ? " selected" : "") +
               ">" + g.grade_id + " " + NBUi.esc(g.label) + "</option>";
      }).join("");
      document.getElementById("mDept").innerHTML = NBStore.departemenTerlihat().map(function (d) {
        return "<option value='" + d.department_id + "'" +
               (d.department_id === aktif.department_id ? " selected" : "") + ">" + NBUi.esc(d.name) + "</option>";
      }).join("");
      document.getElementById("mAlasan").value = "";
      modal.hidden = false;
    }

    document.querySelectorAll("button[data-edit]").forEach(function (b) {
      b.onclick = function () { buka(b.dataset.edit); };
    });
    modal.querySelectorAll("[data-tutup]").forEach(function (b) {
      b.onclick = function () { modal.hidden = true; };
    });
    modal.onclick = function (e) { if (e.target === modal) modal.hidden = true; };

    document.getElementById("mSimpan").onclick = function () {
      if (!aktif) return;
      var alasan = document.getElementById("mAlasan").value.trim();
      if (!alasan) { NBUi.toast("Alasan koreksi wajib diisi", "error"); return; }
      var g = document.getElementById("mGrade").value;
      var d = document.getElementById("mDept").value;
      var berubah = false;
      [["grade_id", g], ["department_id", d]].forEach(function (pair) {
        var hasil = NBStore.ubah("Employee", aktif.employee_id, pair[0], pair[1], {
          capability: "master.employee.edit",
          detail: "Koreksi master " + pair[0] + " untuk " + aktif.name,
          reason: alasan
        });
        if (hasil.ok && !hasil.tidakBerubah) berubah = true;
        if (!hasil.ok) NBUi.toast(hasil.alasan, "error");
      });
      modal.hidden = true;
      NBUi.toast(berubah ? "Master diperbarui. Snapshot yang sudah dirilis tidak ikut berubah." : "Tidak ada perubahan");
      if (berubah) NBApp.ulang();
    };
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.organisasi = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/siklus.js */
// Layar Siklus MPP dan Snapshot. FR-01 dan FR-02.
// Snapshot yang sudah dirilis adalah state Current. Tidak pernah ditimpa, hanya ditambah versinya.
(function (global) {
  "use strict";

  var state = { cycle_id: null, snapshot_id: null };
  var BATAS_BARIS = 200;

  var STATUS_SIKLUS = {
    DRAFT:  { label: "Draft",             badge: "is-plain",   ket: "Belum dibuka untuk departemen" },
    OPEN:   { label: "Terbuka",           badge: "is-blue",    ket: "Departemen boleh menyusun usulan" },
    LOCKED: { label: "Pengumpulan Ditutup",badge: "is-amber",  ket: "Usulan baru tidak diterima" },
    CLOSED: { label: "Ditutup",           badge: "is-emerald", ket: "Read only sesuai BR-09" }
  };

  function siklusTerpilih() {
    var c = state.cycle_id ? NBStore.siklus(state.cycle_id) : null;
    return c || NBStore.siklusAktif();
  }

  function kartuSiklus(c, aktifId) {
    var st = STATUS_SIKLUS[c.status] || { label: c.status, badge: "" };
    var snap = NBStore.snapshotAktif(c.cycle_id);
    return "<tr class='" + (c.cycle_id === aktifId ? "is-active" : "") + "' data-cycle='" + c.cycle_id + "' style='cursor:pointer'>" +
      "<td><div class='nb-cell-title'>" + NBUi.esc(c.name) + "</div>" +
        "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(c.cycle_id) + " v" + c.version + "</div></td>" +
      "<td>" + NBUi.badge(st.label, st.badge) + "<div class='nb-cell-sub'>" + NBUi.esc(st.ket) + "</div></td>" +
      "<td>" + NBFormat.tanggalPendek(c.start_date) + " sampai " + NBFormat.tanggalPendek(c.end_date) + "</td>" +
      "<td>" + NBFormat.tanggalPendek(c.submission_deadline) + "</td>" +
      "<td>" + (snap ? "<span class='nb-mono'>" + NBUi.esc(snap.snapshot_id) + "</span>" +
                 "<div class='nb-cell-sub'>" + NBFormat.angka(NBStore.snapshotBarisTerlihat(snap.snapshot_id).length) + " baris</div>"
               : "<span class='nb-muted'>Belum ada</span>") + "</td>" +
    "</tr>";
  }

  function aksiSiklus(u, c) {
    if (!NBRbac.can(u, "cycle.create")) {
      return "<span class='nb-cell-sub'>Peran Anda hanya membaca siklus. Pengelolaan siklus milik OD.</span>";
    }
    var tombol = [];
    if (c.status === "DRAFT") tombol.push(["OPEN", "Buka siklus", "nb-btn-primary"]);
    if (c.status === "OPEN") {
      tombol.push(["LOCKED", "Tutup pengumpulan", "nb-btn-outline"]);
      tombol.push(["CLOSED", "Tutup siklus", "nb-btn-soft-danger"]);
    }
    if (c.status === "LOCKED") {
      tombol.push(["OPEN", "Buka lagi pengumpulan", "nb-btn-outline"]);
      tombol.push(["CLOSED", "Tutup siklus", "nb-btn-soft-danger"]);
    }
    if (c.status === "CLOSED") tombol.push(["OPEN", "Buka ulang siklus", "nb-btn-ghost-danger"]);

    return tombol.map(function (t) {
      return "<button class='nb-btn " + t[2] + "' data-status='" + t[0] + "'>" + t[1] + "</button>";
    }).join("");
  }

  function panelSnapshot(u, c) {
    var daftar = NBStore.snapshotSiklus(c.cycle_id);
    var aktif = NBStore.snapshotAktif(c.cycle_id);
    var bolehRilis = NBRbac.can(u, "snapshot.upload") && c.status !== "CLOSED";

    var isi;
    if (!daftar.length) {
      isi = NBUi.kosong("Snapshot belum dirilis",
        "Selama snapshot belum ada, departemen tidak punya baseline Current untuk direncanakan. Ini prasyarat Modul 2.",
        NBUi.svg("layers"));
    } else {
      isi = "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
        "<th>Snapshot</th><th>Berlaku</th><th>Dirilis</th><th>Sumber</th>" +
        "<th class='nb-num'>Baris</th><th class='nb-num'>Vacancy</th><th></th>" +
        "</tr></thead><tbody>" +
        daftar.map(function (s) {
          var perilis = (NBStore.pengguna(s.released_by) || {}).name;
          return "<tr><td><span class='nb-code'>" + NBUi.esc(s.snapshot_id) + "</span>" +
            (s === aktif ? " " + NBUi.badge("Aktif", "is-emerald") : "") + "</td>" +
            "<td>" + NBFormat.tanggal(s.effective_date) + "</td>" +
            "<td>" + NBFormat.tanggalPendek(s.released_at) +
              "<div class='nb-cell-sub'>" + NBUi.esc(perilis || s.released_by) + "</div></td>" +
            "<td class='nb-cell-sub'>" + NBUi.esc(s.source) + "</td>" +
            "<td class='nb-num'>" + NBFormat.angka(NBStore.snapshotBarisTerlihat(s.snapshot_id).length) + "</td>" +
            "<td class='nb-num'>" + NBFormat.angka((s.vacancy_ids || []).length) + "</td>" +
            "<td class='nb-num'><button class='nb-btn nb-btn-outline' data-lihat='" + s.snapshot_id + "'>Lihat isi</button></td>" +
          "</tr>";
        }).join("") + "</tbody></table></div>";
    }

    var formulir = bolehRilis
      ? "<div class='nb-setting'><div style='flex:1'>" +
          "<div class='nb-setting-label'>Rilis snapshot baru</div>" +
          "<div class='nb-setting-desc'>Menyalin seluruh data master organisasi menjadi baris beku. " +
          "Versi sebelumnya tidak dihapus.</div></div>" +
          "<input type='date' class='nb-select' id='snapDate' value='" + NBUi.esc(c.start_date) + "' style='width:200px'>" +
          "<button class='nb-btn nb-btn-primary' id='snapRilis'>Rilis V" +
            (daftar.length + 1) + "</button></div>"
      : "";

    return "<div class='nb-card' style='margin-bottom:24px'>" +
      "<div class='nb-toolbar'><div><div style='font-weight:600' data-i18n='siklus.snapshot'>Snapshot struktur organisasi</div>" +
      "<div class='nb-cell-sub'>State Current untuk " + NBUi.esc(c.name) +
      ". Sekali dirilis, isinya tidak ikut berubah walaupun data master berubah.</div></div></div>" +
      (formulir ? "<div style='padding:0 20px 4px'>" + formulir + "</div>" : "") +
      isi + "</div>";
  }

  function panelIsiSnapshot() {
    if (!state.snapshot_id) return "";
    var s = NBStore.snapshot(state.snapshot_id);
    if (!s) return "";
    var u = NBStore.user();
    var izin = NBRbac.scopeDepartments(u, NBStore.semuaDepartemen());
    var baris = (s.lines || []).filter(function (l) { return izin.indexOf(l.department_id) !== -1; });
    var beda = NBStore.bandingkanSnapshot(s.snapshot_id);

    var tabelBeda = beda.length
      ? "<div class='nb-tablewrap' style='border:1px solid var(--nb-gray-200);margin-top:12px'>" +
        "<table class='nb-table'><thead><tr><th>Karyawan</th><th>Field</th>" +
        "<th>Nilai di snapshot</th><th>Nilai di master hari ini</th></tr></thead><tbody>" +
        beda.map(function (b) {
          return "<tr><td><div class='nb-cell-title'>" + NBUi.esc(b.nama) + "</div>" +
            "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(b.employee_id) + "</div></td>" +
            "<td class='nb-mono'>" + NBUi.esc(b.field) + "</td>" +
            "<td>" + NBUi.badge(NBUi.esc(b.snapshot), "is-blue") + "</td>" +
            "<td>" + NBUi.badge(NBUi.esc(b.master), "is-amber") + "</td></tr>";
        }).join("") + "</tbody></table></div>"
      : "<p class='nb-cell-sub' style='margin-top:12px'>Tidak ada perbedaan. Snapshot ini masih identik dengan master.</p>";

    return "<div class='nb-card nb-card-pad'>" +
      "<div class='nb-card-head'>" + NBUi.svg("layers") + "<div>" +
        "<h3>Isi " + NBUi.esc(s.snapshot_id) + "</h3>" +
        "<p>Berlaku " + NBFormat.tanggal(s.effective_date) + ". Menampilkan " +
        NBFormat.angka(baris.length) + " baris dalam lingkup akses Anda.</p></div></div>" +

      "<div class='nb-tablewrap' style='border:1px solid var(--nb-gray-200)'><table class='nb-table'><thead><tr>" +
      "<th>NIK</th><th>Karyawan</th><th>Departemen</th><th>Grade saat snapshot</th><th class='nb-num'>HC</th>" +
      "</tr></thead><tbody>" +
      (baris.length ? baris.slice(0, BATAS_BARIS).map(function (l) {
        var d = NBStore.departemen(l.department_id);
        return "<tr><td><span class='nb-code'>" + NBUi.esc(l.employee_id) + "</span></td>" +
          "<td><div class='nb-cell-title'>" + NBUi.esc(l.employee_name) + "</div>" +
            "<div class='nb-cell-sub'>" + NBUi.esc(l.position_title) + "</div></td>" +
          "<td>" + NBUi.esc(d ? d.name : l.department_id) + "</td>" +
          "<td>" + NBUi.badge(l.grade_id, "is-plain") + "</td>" +
          "<td class='nb-num'>" + l.current_hc + "</td></tr>";
      }).join("") : "<tr><td colspan='5'>" + NBUi.kosong("Tidak ada baris dalam lingkup Anda", "") + "</td></tr>") +
      "</tbody></table></div>" +
      (baris.length > BATAS_BARIS
        ? "<p class='nb-cell-sub' style='margin-top:8px'>Menampilkan " + BATAS_BARIS + " baris pertama dari " +
          NBFormat.angka(baris.length) + " baris dalam lingkup Anda. Ekspor lengkap menyusul di Modul 9.</p>"
        : "") +

      "<h4 class='nb-head' style='font-size:14px;margin:20px 0 0'>Bukti pembekuan: snapshot dibanding master</h4>" +
      "<p class='nb-cell-sub' style='margin:4px 0 0'>Daftar ini dihitung ulang setiap kali layar dibuka. " +
      "Kalau data master diubah setelah rilis, perbedaannya muncul di sini, bukan menimpa snapshot.</p>" +
      tabelBeda + "</div>";
  }

  function render() {
    var u = NBStore.user();
    var c = siklusTerpilih();
    if (!c) return "<div class='nb-card'>" + NBUi.kosong("Belum ada siklus MPP", "") + "</div>";
    state.cycle_id = c.cycle_id;
    var st = STATUS_SIKLUS[c.status];
    var snap = NBStore.snapshotAktif(c.cycle_id);

    var formBaru = NBRbac.can(u, "cycle.create")
      ? "<div class='nb-card nb-card-pad' style='margin-bottom:24px'>" +
        "<div class='nb-card-head'>" + NBUi.svg("layers") + "<div><h3 data-i18n='siklus.buatJudul'>Buat siklus baru</h3>" +
        "<p>Satu siklus per tahun perencanaan. Batas pengumpulan dipakai untuk penanda keterlambatan (BR-H).</p></div></div>" +
        "<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px'>" +
          "<div><div class='nb-field-label'>Tahun</div><input class='nb-input' id='cyYear' type='number' value='2028'></div>" +
          "<div><div class='nb-field-label'>Mulai</div><input class='nb-input' id='cyStart' type='date' value='2027-09-01'></div>" +
          "<div><div class='nb-field-label'>Selesai</div><input class='nb-input' id='cyEnd' type='date' value='2028-12-31'></div>" +
          "<div><div class='nb-field-label'>Batas pengumpulan</div><input class='nb-input' id='cyDl' type='date' value='2027-10-15'></div>" +
        "</div><div class='nb-formfoot'><button class='nb-btn nb-btn-primary' id='cyBuat'>Buat siklus</button></div></div>"
      : "";

    return "" +
    "<div class='nb-pagehead'><div><h1 data-i18n='siklus.judul'>Siklus MPP &amp; Snapshot</h1>" +
    "<p data-i18n='siklus.sub'>Pengelolaan siklus perencanaan dan pembekuan struktur organisasi sebagai baseline Current.</p></div>" +
    NBUi.badge(c.name + " " + st.label, st.badge) + "</div>" +

    "<div class='nb-kpigrid'>" +
      NBUi.kpi("Siklus aktif", NBUi.esc(c.name), "layers", "", st.ket) +
      NBUi.kpi("Versi siklus", "v" + c.version, "shield", "is-violet",
               c.reopen_reason ? "Pernah dibuka ulang" : "Belum pernah dibuka ulang") +
      NBUi.kpi("Snapshot Current", snap ? NBUi.esc(snap.snapshot_id) : "Belum ada", "building",
               snap ? "is-emerald" : "is-amber",
               snap ? NBFormat.angka(NBStore.snapshotBarisTerlihat(snap.snapshot_id).length) + " baris beku dalam lingkup Anda"
                    : "Departemen belum bisa merencanakan") +
      NBUi.kpi("Batas pengumpulan", NBFormat.tanggalPendek(c.submission_deadline), "chart", "is-blue") +
    "</div>" +

    "<div class='nb-card' style='margin-bottom:24px'>" +
      "<div class='nb-toolbar'><div><div style='font-weight:600' data-i18n='siklus.daftar'>Daftar siklus</div>" +
      "<div class='nb-cell-sub' data-i18n='siklus.daftarSub'>Klik baris untuk berpindah siklus.</div></div>" +
      "<div style='display:flex;gap:8px;flex-wrap:wrap'>" + aksiSiklus(u, c) +
        (NBRbac.can(u, "admin")
          ? "<button class='nb-btn nb-btn-quiet' id='cyReset' title='Mengembalikan seluruh data prototipe ke kondisi awal'>Reset data prototipe</button>"
          : "") +
      "</div></div>" +
      "<div class='nb-tablewrap'><table class='nb-table'><thead><tr>" +
      "<th>Siklus</th><th>Status</th><th>Periode</th><th>Batas pengumpulan</th><th>Snapshot aktif</th>" +
      "</tr></thead><tbody>" +
      NBStore.semuaSiklus().map(function (x) { return kartuSiklus(x, c.cycle_id); }).join("") +
      "</tbody></table></div></div>" +

    formBaru +
    panelSnapshot(u, c) +
    panelIsiSnapshot();
  }

  function mount() {
    document.querySelectorAll("tr[data-cycle]").forEach(function (tr) {
      tr.onclick = function () {
        state.cycle_id = tr.dataset.cycle;
        state.snapshot_id = null;
        NBApp.ulang();
      };
    });

    document.querySelectorAll("button[data-status]").forEach(function (b) {
      b.onclick = function () {
        var target = b.dataset.status;
        var c = siklusTerpilih();
        var alasan = null;
        if (c.status === "CLOSED" && target === "OPEN") {
          alasan = prompt("Alasan membuka ulang siklus " + c.name + ". Alasan wajib diisi dan tercatat di audit.");
          if (!alasan) return;
        }
        if (target === "CLOSED" && !confirm("Tutup siklus " + c.name + "? Setelah ditutup, siklus hanya bisa dibaca (BR-09).")) return;
        var hasil = NBStore.ubahStatusSiklus(c.cycle_id, target, alasan);
        NBUi.toast(hasil.ok ? "Status siklus diperbarui" : hasil.alasan, hasil.ok ? "ok" : "error");
        if (hasil.ok) NBApp.ulang();
      };
    });

    var reset = document.getElementById("cyReset");
    if (reset) reset.onclick = function () {
      if (!confirm("Reset seluruh data prototipe ke kondisi awal? Siklus, snapshot, koreksi master, dan audit akan hilang.")) return;
      var hasil = NBStore.reset();
      NBUi.toast(hasil.ok ? "Data prototipe dikembalikan ke kondisi awal" : hasil.alasan, hasil.ok ? "ok" : "error");
      if (hasil.ok) { state.cycle_id = null; state.snapshot_id = null; NBApp.ulang(); }
    };

    var buat = document.getElementById("cyBuat");
    if (buat) buat.onclick = function () {
      var hasil = NBStore.buatSiklus({
        year: document.getElementById("cyYear").value,
        start_date: document.getElementById("cyStart").value,
        end_date: document.getElementById("cyEnd").value,
        submission_deadline: document.getElementById("cyDl").value
      });
      NBUi.toast(hasil.ok ? "Siklus dibuat dalam status Draft" : hasil.alasan, hasil.ok ? "ok" : "error");
      if (hasil.ok) { state.cycle_id = hasil.siklus.cycle_id; NBApp.ulang(); }
    };

    var rilis = document.getElementById("snapRilis");
    if (rilis) rilis.onclick = function () {
      var c = siklusTerpilih();
      var hasil = NBStore.rilisSnapshot(c.cycle_id, document.getElementById("snapDate").value);
      NBUi.toast(hasil.ok ? "Snapshot " + hasil.snapshot.snapshot_id + " dirilis dan dibekukan" : hasil.alasan,
                 hasil.ok ? "ok" : "error");
      if (hasil.ok) { state.snapshot_id = hasil.snapshot.snapshot_id; NBApp.ulang(); }
    };

    document.querySelectorAll("button[data-lihat]").forEach(function (b) {
      b.onclick = function () { state.snapshot_id = b.dataset.lihat; NBApp.ulang(); };
    });
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.siklus = { render: render, mount: mount };
})(window);

</script>
<script>
/* js/pages/audit.js */
// Layar 11 dari inventaris bab 25. Audit log (BR-08) dan pembeda dengan Revision History (bab 47).
(function (global) {
  "use strict";

  function nilai(v) {
    if (v === null || v === undefined) return "<span class='nb-muted'>-</span>";
    if (v === "") return "<span class='nb-muted'>(kosong)</span>";
    return "<span class='nb-mono'>" + NBUi.esc(String(v).slice(0, 60)) + "</span>";
  }

  function render() {
    var u = NBStore.user();
    var data = NBAudit.untuk(u, NBStore.departemenDariAudit);

    var baris = data.map(function (e) {
      var tipe = NBAudit.TIPE[e.event_type] || { label: e.event_type, badge: "" };
      var perubahan = (e.before === null && e.after === null)
        ? "<span class='nb-muted'>-</span>"
        : nilai(e.before) + " <span class='nb-muted'>ke</span> " + nilai(e.after);

      return "<tr>" +
        "<td class='nb-ts'>" + NBFormat.tanggalPendek(e.timestamp) +
          "<small>" + NBFormat.jam(e.timestamp) + "</small></td>" +
        "<td><span class='nb-actor'>" + NBUi.esc(e.actor_email) + "</span>" +
          "<span class='nb-role'>Peran: " + NBUi.esc(e.actor_role) + "</span></td>" +
        "<td>" + NBUi.badge(tipe.label, tipe.badge) + "</td>" +
        "<td>" + NBUi.esc(e.detail) +
          "<div class='nb-cell-sub nb-mono'>" + NBUi.esc(e.object_type + " " + e.object_id) + "</div></td>" +
        "<td>" + perubahan + "</td>" +
      "</tr>";
    }).join("");

    var isi = data.length
      ? '<div class="nb-tablewrap"><table class="nb-table"><thead><tr>' +
        "<th data-i18n='audit.waktu'>Waktu</th><th data-i18n='audit.aktor'>Pengguna / Aktor</th>" +
        "<th data-i18n='audit.aksi'>Tipe Event</th><th data-i18n='audit.rincian'>Rincian</th>" +
        "<th data-i18n='audit.nilai'>Perubahan Nilai</th>" +
        "</tr></thead><tbody>" + baris + "</tbody></table></div>"
      : NBUi.kosong("Belum ada aktivitas", "Lakukan satu perubahan data, lalu kembali ke layar ini.");

    return '' +
    '<div class="nb-pagehead"><div>' +
      '<h1 data-i18n="audit.judul">Audit & Riwayat Perubahan</h1>' +
      '<p data-i18n="audit.sub">Rekaman jejak setiap aksi dan setiap perubahan nilai data.</p>' +
    "</div>" +
      '<span class="nb-badge is-plain">' + NBFormat.angka(data.length) + " event</span>" +
    "</div>" +
    '<div class="nb-card">' + isi + "</div>" +
    '<p class="nb-cell-sub" style="margin-top:12px">Audit bersifat append only. Revision History yang mencatat versi ' +
    "usulan dibangun terpisah pada Modul 6, sesuai pembedaan di bab 47.</p>";
  }

  global.NBPages = global.NBPages || {};
  global.NBPages.audit = { render: render };
})(window);

</script>

<script>
/* js/app.js */
// Shell dan router. Satu halaman, navigasi berbasis hash, tanpa build step.
// Navigasi dirakit dari kapabilitas peran, bukan disembunyikan dengan CSS.
(function (global) {
  "use strict";

  // Layar mengikuti inventaris bab 25. cap null berarti terbuka untuk semua peran yang login.
  var RUTE = [
    { id: "dashboard",   i18n: "nav.dashboard",   cap: null },
    { id: "organisasi",  i18n: "nav.organisasi",  cap: null },
    { id: "siklus",      i18n: "nav.siklus",      cap: null },
    { id: "planning",    i18n: "nav.planning",    cap: "plan.create" },
    { id: "konsolidasi", i18n: "nav.konsolidasi", cap: "consolidate" },
    { id: "biaya",       i18n: "nav.biaya",       cap: "cost.view" },
    { id: "review",      i18n: "nav.review",      cap: "review.decide", capAlt: "review.support" },
    { id: "approved",    i18n: "nav.approved",    cap: null },
    { id: "monitoring",  i18n: "nav.monitoring",  cap: null },
    { id: "laporan",     i18n: "nav.laporan",     cap: null },
    { id: "audit",       i18n: "nav.audit",       cap: null },
    { id: "admin",       i18n: "nav.admin",       cap: "admin" }
  ];

  function bolehLihat(u, r) {
    if (!r.cap) return true;
    return NBRbac.can(u, r.cap) || (r.capAlt && NBRbac.can(u, r.capAlt)) ||
           (r.cap === "cost.view" && NBRbac.can(u, "cost.view.own"));
  }

  function rutuSaatIni() {
    var h = (location.hash || "#dashboard").replace("#", "");
    return RUTE.filter(function (r) { return r.id === h; })[0] || RUTE[0];
  }

  function gambarNav() {
    var u = NBStore.user();
    var nav = document.getElementById("nbNav");
    var aktif = rutuSaatIni().id;
    nav.innerHTML = RUTE.filter(function (r) { return bolehLihat(u, r); }).map(function (r) {
      return "<a class='nb-nav-item" + (r.id === aktif ? " is-active" : "") + "' href='#" + r.id + "'>" +
             "<span data-i18n='" + r.i18n + "'>" + NBi18n.t(r.i18n) + "</span></a>";
    }).join("");
  }

  // Penanda siklus aktif di app bar. Semua modul berikutnya bergantung pada siklus ini,
  // jadi statusnya harus terlihat di setiap layar.
  function gambarSiklus() {
    var el = document.getElementById("nbCycle");
    if (!el) return;
    var c = NBStore.siklusAktif();
    if (!c) { el.style.display = "none"; return; }
    var peta = { DRAFT: "is-plain", OPEN: "is-blue", LOCKED: "is-amber", CLOSED: "is-emerald" };
    var teks = { DRAFT: "Draft", OPEN: "Terbuka", LOCKED: "Terkunci", CLOSED: "Ditutup" };
    el.className = "nb-badge " + (peta[c.status] || "");
    el.textContent = c.name + " \u00b7 " + (teks[c.status] || c.status);
    el.style.display = "inline-flex";
  }

  function gambarIdentitas() {
    var u = NBStore.user();
    var deps = NBStore.departemenTerlihat();
    var lingkup = u.scope.type === "ALL"
      ? NBi18n.t("umum.semua")
      : deps.map(function (d) { return d.name; }).join(", ");
    document.getElementById("nbUser").innerHTML =
      "<div style='text-align:right'>" +
        "<div style='font-weight:600;font-size:13px'>" + NBUi.esc(u.name) + "</div>" +
        "<div class='nb-cell-sub'>" + NBUi.esc(NBRbac.roleLabel(u.role)) + " &middot; " + NBUi.esc(lingkup) + "</div>" +
      "</div><span class='nb-avatar'>" + NBUi.esc(u.name.charAt(0)) + "</span>";
  }

  function ulang() {
    var u = NBStore.user();
    var chrome = document.getElementById("nbChrome");

    // Belum masuk: shell tetap dipakai, isinya pemilih persona.
    if (!u) {
      if (chrome) chrome.style.display = "none";
      document.getElementById("nbNav").innerHTML = "";
      var hostLogin = document.getElementById("nbPage");
      hostLogin.innerHTML = NBPages.login.render();
      NBPages.login.mount();
      NBi18n.apply(hostLogin);
      return;
    }
    if (chrome) chrome.style.display = "";
    var r = rutuSaatIni();

    // Penjagaan rute. Peran yang tidak berhak tidak bisa masuk lewat URL.
    if (!bolehLihat(u, r)) {
      NBAudit.tulis(u, "SCOPE_DENIED", "Screen", r.id, "Percobaan membuka layar tanpa kapabilitas");
      location.hash = "#dashboard";
      NBUi.toast("Layar itu di luar hak akses peran Anda", "error");
      return;
    }

    var page = (global.NBPages || {})[r.id];
    var host = document.getElementById("nbPage");
    host.innerHTML = page ? page.render() : NBUi.kosong("Layar tidak ditemukan", "");
    if (page && page.mount) page.mount();
    NBi18n.apply(host);
    gambarNav();
    gambarSiklus();
    gambarIdentitas();
    window.scrollTo(0, 0);
  }

  function mulai() {
    NBStore.pulihkanSesi();

    document.getElementById("nbLogout").onclick = function () {
      NBStore.keluar();
      location.hash = "#dashboard";
      ulang();
    };
    document.querySelectorAll(".nb-lang button").forEach(function (b) {
      b.onclick = function () {
        document.querySelectorAll(".nb-lang button").forEach(function (x) {
          x.classList.toggle("is-active", x === b);
        });
        NBi18n.set(b.dataset.lang);
        ulang();
      };
    });

    window.addEventListener("hashchange", ulang);
    if (!location.hash) location.hash = "#dashboard";
    NBi18n.apply(document);
    ulang();
  }

  global.NBApp = { mulai: mulai, ulang: ulang };
})(window);

</script>
<script>NBApp.mulai();</script>
</body>
</html>
