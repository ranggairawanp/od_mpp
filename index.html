<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPP Micro-App</title>
<link rel="stylesheet" href="assets/nabati-fonts.css">
<link rel="stylesheet" href="assets/nabati-ds.css">
<style>
  #nbToast { position: fixed; right: 24px; bottom: 24px; z-index: 80; display: none; box-shadow: var(--nb-sh-raise); }
  #nbUser > div { white-space: nowrap; }
  #nbUser .nb-cell-sub { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  /* Pada layar sempit blok identitas menyusut bertahap: lingkup dulu, lalu namanya,
     menyisakan avatar. Tombol keluar tidak pernah ikut hilang. */
  @media (max-width: 1024px) { #nbUser .nb-cell-sub { display: none; } }
  @media (max-width: 760px)  { #nbUser > div { display: none; } }
  @media (max-width: 560px)  { #nbCycle { display: none !important; } }
  #nbUser { display: flex; align-items: center; gap: 10px; }
  .nb-empty svg { width: 20px; height: 20px; }
  td .nb-muted svg { width: 15px; height: 15px; vertical-align: middle; }
</style>
</head>
<body class="nb-app">

<header class="nb-appbar is-stacked">
  <div class="nb-appbar-row">
  <div class="nb-brand">
    <img src="assets/nabati-logo.png" alt="Nabati">
    <div>
      <div class="nb-brand-name">MPP Micro-App</div>
      <div class="nb-brand-sub" id="nbEntity" data-i18n="app.entity">Manpower Planning</div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:12px">
    <div class="nb-lang" id="nbLangBox">
      <button class="is-active" data-lang="id">ID</button>
      <button data-lang="en">EN</button>
    </div>
    <span class="nb-badge is-amber" title="Seluruh data pada prototipe ini fiktif">
      <span data-i18n="app.simulasi">Prototipe</span>
    </span>
    <span id="nbChrome" style="display:flex;align-items:center;gap:12px">
    <span class="nb-badge" id="nbCycle" style="display:none"></span>
    <div id="nbUser"></div>
    <button class="nb-iconbtn" id="nbLogout" data-i18n-title="umum.keluar" title="Keluar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/>
      </svg>
    </button>
    </span>
  </div>
  </div>

  <nav class="nb-nav" id="nbNav"></nav>
</header>

<main class="nb-page nb-container" id="nbPage"></main>

<span id="nbToast" class="nb-badge"></span>

<!-- Data mock. Berkas .js, bukan .json, supaya prototipe bisa dibuka langsung dari disk. -->

<script src="js/pages/login.js"></script>

</body>
</html>
